name: Deploy to GitHub Pages

# 개발 브랜치에 푸시될 때마다 index.html을 gh-pages 브랜치로 발행한다.
# (Pages 사이트 자동 활성화(enablement)는 Actions 토큰 권한 밖이라, 브랜치 발행 방식을 쓴다)
on:
  push:
    branches:
      - claude/academy-dashboard-su4axr
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
