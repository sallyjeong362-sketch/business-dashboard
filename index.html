<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const STORAGE_KEY = 'academy_dashboard_v2';
const DAYS = ['일','월','화','수','목','금','토'];
const STATUS = {
  present: { label: '출석', color: 'bg-green-100 text-green-700 border-green-300' },
  late:    { label: '지각', color: 'bg-yellow-100 text-yellow-700 border-yellow-300' },
  absent:  { label: '결석', color: 'bg-red-100 text-red-700 border-red-300' },
  early:   { label: '조퇴', color: 'bg-gray-100 text-gray-600 border-gray-300' },
};
const PAYMENT_STATUS = {
  paid:    { label: '완납', color: 'bg-green-100 text-green-700 border-green-300' },
  partial: { label: '부분납', color: 'bg-yellow-100 text-yellow-700 border-yellow-300' },
  unpaid:  { label: '미납', color: 'bg-orange-100 text-orange-700 border-orange-300' },
  overdue: { label: '연체', color: 'bg-red-100 text-red-700 border-red-300' },
};

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function daysAgoStr(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0,10);
}

function defaultData() {
  return {
    academyName: '에이스 영어학원',
    classes: [
      { id: 'c1', name: '중2 내신반', teacher: '김선생', room: '301호', time: '15:00', endTime: '16:20', days: ['월','수','금'],
        students: [{id:'s1',name:'이서준'},{id:'s2',name:'최유나'},{id:'s3',name:'정민수'}] },
      { id: 'c2', name: '고1 수능독해', teacher: '박선생', room: '302호', time: '17:00', endTime: '18:20', days: ['화','목'],
        students: [{id:'s4',name:'박하은'},{id:'s5',name:'김도윤'}] },
      { id: 'c3', name: '고3 실전모의고사', teacher: '김선생', room: '301호', time: '19:00', endTime: '20:50', days: ['월','수','금'],
        students: [{id:'s6',name:'한지우'},{id:'s7',name:'윤서연'},{id:'s8',name:'조은우'}] },
    ],
    attendance: {},
    records: {
      s4: { scores: [{id:'sc1', date: daysAgoStr(6), label:'주간 모의고사', score:91}], homework: [] },
    },
    reports: {},
    announcements: [
      { id: 'a1', title: '7월 정기 모의고사 일정 안내', content: '7월 19일(토) 오전 10시, 고3 전체 대상 실전 모의고사가 진행됩니다.', target: '학부모', date: todayStr(), status: '대기', channel: '미정' },
    ],
    payments: {
      s1: { tuition: 350000, status: 'paid', dueDate: todayStr() },
      s2: { tuition: 350000, status: 'unpaid', dueDate: todayStr() },
      s3: { tuition: 350000, status: 'overdue', dueDate: daysAgoStr(10) },
      s4: { tuition: 400000, status: 'paid', dueDate: todayStr() },
      s5: { tuition: 400000, status: 'partial', dueDate: todayStr() },
      s6: { tuition: 450000, status: 'paid', dueDate: todayStr() },
      s7: { tuition: 450000, status: 'unpaid', dueDate: todayStr() },
      s8: { tuition: 450000, status: 'paid', dueDate: todayStr() },
    },
    newsProxyUrl: '',
    newsQuery: '수능 영어',
    counseling: [
      { id: 'k1', studentName: '박하은', parentName: '박하은 학부모', type: '정기상담', date: todayStr(), time: '18:00', content: '최근 성적 상승 관련 안내 및 다음 학기 목표 설정', nextAction: '2주 후 진도 재점검', status: '예정' },
      { id: 'k2', studentName: '신입 문의', parentName: '', type: '입학상담', date: todayStr(), time: '20:00', content: '고1 신입생 레벨테스트 및 반 배정 상담', nextAction: '레벨테스트 결과 후 반 확정', status: '예정' },
    ],
    lessonLogs: {},
    classHomework: {},
    workLogs: [
      { id: 'w1', date: todayStr(), teacher: '김선생', category: '수업', content: '중2 내신반 3과 본문 해석 완료, 다음 시간 단어시험 예정' },
    ],
    vocabTests: [],
  };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.records) parsed.records = {};
      if (!parsed.reports) parsed.reports = {};
      if (!parsed.announcements) parsed.announcements = [];
      if (!parsed.payments) parsed.payments = {};
      if (parsed.newsProxyUrl === undefined) parsed.newsProxyUrl = '';
      if (!parsed.newsQuery) parsed.newsQuery = '수능 영어';
      if (!parsed.counseling) parsed.counseling = [];
      if (!parsed.lessonLogs) parsed.lessonLogs = {};
      if (!parsed.classHomework) parsed.classHomework = {};
      if (!parsed.workLogs) parsed.workLogs = [];
      if (!parsed.vocabTests) parsed.vocabTests = [];
      return parsed;
    }
  } catch (e) {}
  return defaultData();
}

function stripHtml(str) {
  if (!str) return '';
  return str
    .replace(/<\/?b>/g, '')
    .replace(/&quot;/g, '"')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&#39;/g, "'");
}

function formatTimeRange(c) {
  return c.endTime ? `${c.time}~${c.endTime}` : c.time;
}

function classTimeForDay(c, day) {
  const o = c.daySchedule && c.daySchedule[day];
  return o ? { time: o.time, endTime: o.endTime } : { time: c.time, endTime: c.endTime };
}

function formatClassTimeForDay(c, day) {
  const t = classTimeForDay(c, day);
  return t.endTime ? `${t.time}~${t.endTime}` : t.time;
}

function hasVariedTimes(c) {
  if (!c.daySchedule) return false;
  return c.days.some(d => {
    const o = c.daySchedule[d];
    return o && (o.time !== c.time || o.endTime !== c.endTime);
  });
}

function classScheduleSummary(c) {
  if (!hasVariedTimes(c)) return `${formatTimeRange(c)} · ${c.days.join(',')}`;
  return c.days.map(d => `${d} ${formatClassTimeForDay(c, d)}`).join(', ');
}

function collectDaySchedulePrompt(days, baseTime, baseEndTime, existing) {
  const daySchedule = {};
  if (!days.length) return daySchedule;
  const setPerDay = confirm('요일마다 수업 시간이 다른가요? (아니오를 누르면 위에서 입력한 기본 시간이 모든 요일에 적용됩니다)');
  if (!setPerDay) return daySchedule;
  for (const d of days) {
    const current = (existing && existing[d]) || { time: baseTime, endTime: baseEndTime };
    const dTime = prompt(`${d}요일 시작 시간`, current.time) ?? current.time;
    const dEnd = prompt(`${d}요일 종료 시간`, current.endTime || '') ?? current.endTime;
    if (dTime !== baseTime || dEnd !== (baseEndTime || '')) {
      daySchedule[d] = { time: dTime, endTime: dEnd };
    }
  }
  return daySchedule;
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getAttendanceEntry(data, date, classId, studentId) {
  const raw = data.attendance[date]?.[classId]?.[studentId];
  if (!raw) return null;
  if (typeof raw === 'string') return { status: raw, homework: false };
  return raw;
}

function normalizeHomework(entry) {
  if (!entry) return null;
  if (entry.homework === true) return 'done';
  if (entry.homework === 'done' || entry.homework === 'missing') return entry.homework;
  return null;
}

function getLessonLog(data, date, classId) {
  return data.lessonLogs?.[date]?.[classId] || '';
}

function getClassHomework(data, date, classId) {
  return data.classHomework?.[date]?.[classId] || '';
}

function allStudents(data) {
  const map = {};
  data.classes.forEach(c => c.students.forEach(s => { map[s.id] = { ...s, className: c.name, classId: c.id }; }));
  return Object.values(map);
}

function App() {
  const [data, setData] = useState(loadData());
  const [tab, setTab] = useState('schedule');
  const [selectedClassId, setSelectedClassId] = useState(null);
  const [date, setDate] = useState(todayStr());
  const [reportStudentId, setReportStudentId] = useState(null);
  const [comment, setComment] = useState('');
  const [newsItems, setNewsItems] = useState([]);
  const [newsLoading, setNewsLoading] = useState(false);
  const [newsError, setNewsError] = useState('');

  useEffect(() => { saveData(data); }, [data]);

  const weekday = DAYS[new Date(date + 'T00:00:00').getDay()];

  const todayClasses = useMemo(() => {
    return data.classes
      .filter(c => c.days.includes(weekday))
      .sort((a,b) => classTimeForDay(a, weekday).time.localeCompare(classTimeForDay(b, weekday).time));
  }, [data.classes, weekday]);

  useEffect(() => {
    if (todayClasses.length && !todayClasses.find(c => c.id === selectedClassId)) {
      setSelectedClassId(todayClasses[0].id);
    }
    if (!todayClasses.length) setSelectedClassId(null);
  }, [todayClasses]);

  useEffect(() => {
    const students = allStudents(data);
    if (students.length && !students.find(s => s.id === reportStudentId)) {
      setReportStudentId(students[0].id);
    }
  }, [data.classes]);

  const attendanceForDate = data.attendance[date] || {};

  function setAttendance(classId, studentId, patch) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.attendance[date]) next.attendance[date] = {};
      if (!next.attendance[date][classId]) next.attendance[date][classId] = {};
      const current = getAttendanceEntry(next, date, classId, studentId) || { status: null, homework: false };
      next.attendance[date][classId][studentId] = { ...current, ...patch };
      return next;
    });
  }

  function setLessonLog(classId, content) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.lessonLogs[date]) next.lessonLogs[date] = {};
      if (content) next.lessonLogs[date][classId] = content;
      else delete next.lessonLogs[date][classId];
      return next;
    });
  }

  function setClassHomework(classId, content) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.classHomework[date]) next.classHomework[date] = {};
      if (content) next.classHomework[date][classId] = content;
      else delete next.classHomework[date][classId];
      return next;
    });
  }

  const summary = useMemo(() => {
    let present=0, late=0, absent=0, early=0, total=0;
    todayClasses.forEach(c => {
      c.students.forEach(s => {
        total++;
        const entry = getAttendanceEntry(data, date, c.id, s.id);
        const st = entry?.status;
        if (st === 'present') present++;
        else if (st === 'late') late++;
        else if (st === 'absent') absent++;
        else if (st === 'early') early++;
      });
    });
    return { present, late, absent, early, total, unchecked: total - present - late - absent - early };
  }, [todayClasses, data, date]);

  function addClass() {
    const name = prompt('반 이름 (예: 중3 문법반)');
    if (!name) return;
    const teacher = prompt('담당 강사') || '';
    const room = prompt('강의실') || '';
    const time = prompt('시작 시간 (기본, 예: 16:00)') || '00:00';
    const endTime = prompt('종료 시간 (기본, 예: 17:20)') || '';
    const daysInput = prompt('요일 (쉼표로 구분, 예: 월,수,금)') || '';
    const days = daysInput.split(',').map(d => d.trim()).filter(d => DAYS.includes(d));
    const daySchedule = collectDaySchedulePrompt(days, time, endTime, null);
    const newClass = { id: 'c' + Date.now(), name, teacher, room, time, endTime, days, daySchedule, students: [] };
    setData(prev => ({ ...prev, classes: [...prev.classes, newClass] }));
  }

  function deleteClass(id) {
    if (!confirm('이 반을 삭제하시겠습니까?')) return;
    setData(prev => ({ ...prev, classes: prev.classes.filter(c => c.id !== id) }));
  }

  function addStudent(classId) {
    const name = prompt('학생 이름');
    if (!name) return;
    setData(prev => ({
      ...prev,
      classes: prev.classes.map(c => c.id === classId
        ? { ...c, students: [...c.students, { id: 's' + Date.now(), name }] }
        : c)
    }));
  }

  function deleteStudent(classId, studentId) {
    setData(prev => ({
      ...prev,
      classes: prev.classes.map(c => c.id === classId
        ? { ...c, students: c.students.filter(s => s.id !== studentId) }
        : c)
    }));
  }

  function editStudentInfo(classId, studentId) {
    const cls = data.classes.find(c => c.id === classId);
    const student = cls?.students.find(s => s.id === studentId);
    if (!student) return;
    const school = prompt('학교', student.school || '');
    if (school === null) return;
    const grade = prompt('학년 (예: 고1)', student.grade || '') || '';
    const parentPhone = prompt('학부모 연락처', student.parentPhone || '') || '';
    const studentPhone = prompt('학생 연락처', student.studentPhone || '') || '';
    const enrollDate = prompt('등록일자 (YYYY-MM-DD)', student.enrollDate || '') || '';
    const dueDayStr = prompt('매월 결제일 (일, 예: 5)', student.paymentDueDay || '') || '';
    const paymentDueDay = dueDayStr ? parseInt(dueDayStr, 10) : '';
    const memo = prompt('메모 (특이사항 등)', student.memo || '') || '';
    setData(prev => ({
      ...prev,
      classes: prev.classes.map(c => c.id === classId
        ? { ...c, students: c.students.map(s => s.id === studentId ? { ...s, school, grade, parentPhone, studentPhone, enrollDate, paymentDueDay, memo } : s) }
        : c)
    }));
  }

  function addScore(studentId) {
    const label = prompt('시험 이름 (예: 7월 3주차 모의고사)');
    if (!label) return;
    const scoreStr = prompt('점수 (숫자만)');
    const score = parseFloat(scoreStr);
    if (isNaN(score)) { alert('숫자로 입력해주세요.'); return; }
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.records[studentId]) next.records[studentId] = { scores: [], homework: [] };
      next.records[studentId].scores.push({ id: 'sc' + Date.now(), date: todayStr(), label, score });
      return next;
    });
  }

  function deleteScore(studentId, scoreId) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      next.records[studentId].scores = next.records[studentId].scores.filter(sc => sc.id !== scoreId);
      return next;
    });
  }

  function editScore(studentId, scoreId) {
    const sc = data.records[studentId]?.scores.find(s => s.id === scoreId);
    if (!sc) return;
    const label = prompt('시험 이름', sc.label);
    if (!label) return;
    const scoreStr = prompt('점수 (숫자만)', String(sc.score));
    const score = parseFloat(scoreStr);
    if (isNaN(score)) { alert('숫자로 입력해주세요.'); return; }
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const target = next.records[studentId].scores.find(s => s.id === scoreId);
      target.label = label;
      target.score = score;
      return next;
    });
  }

  function addAnnouncement() {
    const title = prompt('공지 제목 (예: 8월 여름방학 특강 안내)');
    if (!title) return;
    const content = prompt('공지 내용') || '';
    const target = prompt('대상 (학부모 / 강사 / 전체)', '학부모') || '전체';
    setData(prev => ({
      ...prev,
      announcements: [
        { id: 'a' + Date.now(), title, content, target, date: todayStr(), status: '대기', channel: '미정' },
        ...prev.announcements,
      ],
    }));
  }

  function deleteAnnouncement(id) {
    if (!confirm('이 공지를 삭제하시겠습니까?')) return;
    setData(prev => ({ ...prev, announcements: prev.announcements.filter(a => a.id !== id) }));
  }

  function editAnnouncement(id) {
    const a = data.announcements.find(a => a.id === id);
    if (!a) return;
    const title = prompt('공지 제목', a.title);
    if (!title) return;
    const content = prompt('공지 내용', a.content) ?? a.content;
    const target = prompt('대상 (학부모 / 강사 / 전체)', a.target) ?? a.target;
    setData(prev => ({
      ...prev,
      announcements: prev.announcements.map(x => x.id === id ? { ...x, title, content, target } : x),
    }));
  }

  function setPaymentStatus(studentId, status) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.payments[studentId]) next.payments[studentId] = { tuition: 0, status: 'unpaid', dueDate: todayStr() };
      next.payments[studentId].status = status;
      if (status === 'paid' && !next.payments[studentId].paidDate) {
        next.payments[studentId].paidDate = todayStr();
      }
      return next;
    });
  }

  function editPaidDate(studentId) {
    const current = data.payments[studentId]?.paidDate || '';
    const dateStr = prompt('결제일 (YYYY-MM-DD)', current);
    if (dateStr === null) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.payments[studentId]) next.payments[studentId] = { tuition: 0, status: 'unpaid' };
      next.payments[studentId].paidDate = dateStr;
      return next;
    });
  }

  function editTuition(studentId) {
    const current = data.payments[studentId]?.tuition || 0;
    const amountStr = prompt('수강료 금액 (원)', String(current));
    const amount = parseInt(amountStr, 10);
    if (isNaN(amount)) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.payments[studentId]) next.payments[studentId] = { tuition: 0, status: 'unpaid', dueDate: todayStr() };
      next.payments[studentId].tuition = amount;
      return next;
    });
  }

  function addCounseling() {
    const studentName = prompt('학생 이름 (또는 문의자)');
    if (!studentName) return;
    const parentName = prompt('학부모 이름 (선택)') || '';
    const type = prompt('상담 유형 (입학상담 / 정기상담 / 민원 / 기타)', '정기상담') || '기타';
    const cDate = prompt('상담 날짜 (YYYY-MM-DD)', todayStr()) || todayStr();
    const time = prompt('상담 시간 (예: 18:00)', '18:00') || '';
    const content = prompt('상담 내용') || '';
    const nextAction = prompt('다음 액션 (팔로우업 계획)') || '';
    setData(prev => ({
      ...prev,
      counseling: [
        { id: 'k' + Date.now(), studentName, parentName, type, date: cDate, time, content, nextAction, status: '예정' },
        ...prev.counseling,
      ],
    }));
  }

  function deleteCounseling(id) {
    if (!confirm('이 상담 기록을 삭제하시겠습니까?')) return;
    setData(prev => ({ ...prev, counseling: prev.counseling.filter(k => k.id !== id) }));
  }

  function editCounseling(id) {
    const k = data.counseling.find(k => k.id === id);
    if (!k) return;
    const studentName = prompt('학생 이름 (또는 문의자)', k.studentName);
    if (!studentName) return;
    const parentName = prompt('학부모 이름 (선택)', k.parentName) ?? k.parentName;
    const type = prompt('상담 유형 (입학상담 / 정기상담 / 민원 / 기타)', k.type) ?? k.type;
    const cDate = prompt('상담 날짜 (YYYY-MM-DD)', k.date) ?? k.date;
    const time = prompt('상담 시간 (예: 18:00)', k.time) ?? k.time;
    const content = prompt('상담 내용', k.content) ?? k.content;
    const nextAction = prompt('다음 액션 (팔로우업 계획)', k.nextAction) ?? k.nextAction;
    setData(prev => ({
      ...prev,
      counseling: prev.counseling.map(x => x.id === id ? { ...x, studentName, parentName, type, date: cDate, time, content, nextAction } : x),
    }));
  }

  function toggleCounselingStatus(id) {
    setData(prev => ({
      ...prev,
      counseling: prev.counseling.map(k => k.id === id ? { ...k, status: k.status === '예정' ? '완료' : '예정' } : k),
    }));
  }

  const todayCounselingCount = useMemo(() => {
    return data.counseling.filter(k => k.date === date && k.status === '예정').length;
  }, [data.counseling, date]);

  function addWorkLog() {

    const wDate = prompt('날짜 (YYYY-MM-DD)', todayStr()) || todayStr();

    setData(prev => ({
      ...prev,
      workLogs: [

        ...prev.workLogs,
      ],

    if (!confirm('이 업무일지를 삭제하시겠습니까?')) return;
    setData(prev => ({ ...prev, workLogs: prev.workLogs.filter(w => w.id !== id) }));
  }

  function editWorkLog(id) {
    const w = data.workLogs.find(w => w.id === id);

    const teacher = prompt('작성자', w.teacher) ?? w.teacher;
    const category = prompt('구분 (수업 / 상담 / 행정 / 기타)', w.category) ?? w.category;

    const content = prompt('내용', w.content);
    if (!content) return;
    setData(prev => ({
      ...prev,
      workLogs: prev.workLogs.map(x => x.id === id ? { ...x, teacher, category, date: wDate, content } : x),

  function addVocabTest() {
    const students = allStudents(data);
    if (!students.length) { alert('등록된 학생이 없습니다.'); return; }
    const studentLabel = prompt('학생 이름을 정확히 입력해주세요:\n' + students.map(s => s.name).join(', '));
    if (!studentLabel) return;
    const student = students.find(s => s.name === studentLabel.trim());
    if (!student) { alert('일치하는 학생을 찾을 수 없습니다.'); return; }
    const testType = prompt('시험 종류 (단어시험 / 문법 복습시험)', '단어시험') || '단어시험';
    const vDate = prompt('날짜 (YYYY-MM-DD)', todayStr()) || todayStr();
    const resultInput = prompt('결과 (pass / fail)', 'pass') || 'pass';
    const result = resultInput.trim().toLowerCase() === 'fail' ? 'fail' : 'pass';
    const wrongCount = parseInt(prompt('틀린 개수', '0'), 10) || 0;
    const retest = confirm('재시험이 필요한가요?');
    const comment = prompt('코멘트 (선택)') || '';
    setData(prev => ({
      ...prev,
      vocabTests: [
        { id: 'vt' + Date.now(), studentId: student.id, testType, date: vDate, result, wrongCount, retest, comment },
        ...prev.vocabTests,
      ],
    }));
  }

  function editVocabTest(id) {
    const v = data.vocabTests.find(v => v.id === id);
    if (!v) return;
    const testType = prompt('시험 종류 (단어시험 / 문법 복습시험)', v.testType) ?? v.testType;
    const vDate = prompt('날짜 (YYYY-MM-DD)', v.date) ?? v.date;
    const resultInput = prompt('결과 (pass / fail)', v.result) ?? v.result;
    const result = resultInput.trim().toLowerCase() === 'fail' ? 'fail' : 'pass';
    const wrongCountStr = prompt('틀린 개수', String(v.wrongCount));
    const wrongCount = wrongCountStr === null ? v.wrongCount : (parseInt(wrongCountStr, 10) || 0);
    const retest = confirm('재시험이 필요한가요?');
    const comment = prompt('코멘트', v.comment) ?? v.comment;
    setData(prev => ({
      ...prev,
      vocabTests: prev.vocabTests.map(x => x.id === id ? { ...x, testType, date: vDate, result, wrongCount, retest, comment } : x),
    }));
  }

  function deleteVocabTest(id) {
    if (!confirm('이 시험 기록을 삭제하시겠습니까?')) return;
    setData(prev => ({ ...prev, vocabTests: prev.vocabTests.filter(v => v.id !== id) }));
  }

  async function fetchNews() {
    if (!data.newsProxyUrl) { setNewsError('먼저 프록시 URL을 입력해주세요.'); return; }
    setNewsLoading(true);
    setNewsError('');
    try {
      const res = await fetch(`${data.newsProxyUrl}?query=${encodeURIComponent(data.newsQuery)}&display=10`);
      if (!res.ok) throw new Error('요청 실패');
      const json = await res.json();
      setNewsItems(json.items || []);
    } catch (e) {
      setNewsError('뉴스를 불러오지 못했어요. 프록시 URL과 Worker의 API 키 설정을 확인해주세요.');
    } finally {
      setNewsLoading(false);
    }
  }

  function editAcademyName() {
    const name = prompt('학원명', data.academyName);
    if (!name) return;
    setData(prev => ({ ...prev, academyName: name }));
  }

  function editClassInfo(classId) {
    const cls = data.classes.find(c => c.id === classId);
    if (!cls) return;
    const name = prompt('반 이름', cls.name);
    if (!name) return;
    const teacher = prompt('담당 강사', cls.teacher) ?? cls.teacher;
    const room = prompt('강의실', cls.room) ?? cls.room;
    const time = prompt('시작 시간 (기본, 예: 16:00)', cls.time) ?? cls.time;
    const endTime = prompt('종료 시간 (기본, 예: 17:20)', cls.endTime || '') ?? cls.endTime;
    const daysInput = prompt('요일 (쉼표로 구분, 예: 월,수,금)', cls.days.join(',')) ?? cls.days.join(',');
    const days = daysInput.split(',').map(d => d.trim()).filter(d => DAYS.includes(d));
    const daySchedule = collectDaySchedulePrompt(days, time, endTime, cls.daySchedule);
    setData(prev => ({
      ...prev,
      classes: prev.classes.map(c => c.id === classId ? { ...c, name, teacher, room, time, endTime, days, daySchedule } : c)
    }));
  }

  function renameStudent(classId, studentId) {
    const cls = data.classes.find(c => c.id === classId);
    const student = cls?.students.find(s => s.id === studentId);
    if (!student) return;
    const name = prompt('학생 이름', student.name);
    if (!name) return;
    setData(prev => ({
      ...prev,
      classes: prev.classes.map(c => c.id === classId
        ? { ...c, students: c.students.map(s => s.id === studentId ? { ...s, name } : s) }
        : c)
    }));
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `academy-dashboard-data-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const paymentSummary = useMemo(() => {
    const students = allStudents(data);
    let paidCount = 0, totalDue = 0, totalCollected = 0;
    students.forEach(s => {
      const p = data.payments[s.id];
      if (!p) return;
      totalDue += p.tuition || 0;
      if (p.status === 'paid') { paidCount++; totalCollected += p.tuition || 0; }
    });
    const rate = students.length ? Math.round((paidCount / students.length) * 100) : 0;
    return { paidCount, total: students.length, rate, totalDue, totalCollected };
  }, [data]);

  const paymentAlerts = useMemo(() => {
    const now = new Date();
    const todayDay = now.getDate();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowDay = tomorrow.getDate();
    const dueToday = [], dueTomorrow = [], unpaidList = [];
    allStudents(data).forEach(s => {
      const p = data.payments[s.id];
      if (s.paymentDueDay === todayDay) dueToday.push(s);
      else if (s.paymentDueDay === tomorrowDay) dueTomorrow.push(s);
      if (p && (p.status === 'unpaid' || p.status === 'overdue')) unpaidList.push(s);
    });
    return { dueToday, dueTomorrow, unpaidList };
  }, [data]);

  const reportData = useMemo(() => {
    if (!reportStudentId) return null;
    const students = allStudents(data);
    const student = students.find(s => s.id === reportStudentId);
    if (!student) return null;

    const rangeDates = Array.from({length:7}, (_,i) => daysAgoStr(6-i));
    let attCount=0, presentCount=0, hwTotal=0, hwDone=0;
    const attendanceDetails = [];
    rangeDates.forEach(d => {
      const entry = getAttendanceEntry(data, d, student.classId, student.id);
      if (entry && entry.status) {
        attCount++;
        if (entry.status === 'present' || entry.status === 'late') presentCount++;
        const hw = normalizeHomework(entry);
        if (hw) { hwTotal++; if (hw === 'done') hwDone++; }
        attendanceDetails.push({
          date: d, status: entry.status, note: entry.note || '', hw, hwNote: entry.homeworkNote || '',
          attitude: entry.attitude || '', lesson: getLessonLog(data, d, student.classId),
          homeworkAssigned: getClassHomework(data, d, student.classId),
        });
      }
    });
    attendanceDetails.reverse();
    const attendanceRate = attCount ? Math.round((presentCount/attCount)*100) : null;
    const homeworkRate = hwTotal ? Math.round((hwDone/hwTotal)*100) : null;

    const scores = (data.records[student.id]?.scores || []).slice(-3).reverse();

    return { student, attendanceRate, homeworkRate, scores, attCount, hwTotal, attendanceDetails };
  }, [reportStudentId, data]);

  function saveComment() {
    if (!reportStudentId) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.reports[reportStudentId]) next.reports[reportStudentId] = [];
      next.reports[reportStudentId].push({ date: todayStr(), comment, channel: '미정' });
      return next;

    alert('리포트가 저장됐어요. 발송 채널(카카오 알림톡)은 추후 연동 예정입니다.');

                <div>
                  <p className="font-medium text-gray-900">{c.name}</p>
                  <p className="text-xs text-gray-500">{c.teacher} · {c.room} · {classScheduleSummary(c)}</p>
                </div>
                <button onClick={() => deleteClass(c.id)} className="text-xs text-red-500 hover:underline">반 삭제</button>
              </div>
              <div className="space-y-1.5 mb-2">
                {c.students.map(s => (
                  <div key={s.id} className="flex items-center justify-between text-xs bg-gray-50 px-2.5 py-1.5 rounded-lg">
                    <div>
                      <span className="text-gray-700 font-medium">{s.name}</span>
                      {(s.school || s.grade || s.parentPhone || s.enrollDate || s.paymentDueDay) && (
                        <p className="text-gray-400 mt-0.5">
                          {[
                            s.school,
                            s.grade,
                            s.parentPhone,
                            s.enrollDate && `등록 ${s.enrollDate}`,
                            s.paymentDueDay && `매월 ${s.paymentDueDay}일 결제`,
                          ].filter(Boolean).join(' · ')}
                        </p>
                      )}
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <button onClick={() => editStudentInfo(c.id, s.id)} className="text-gray-500 hover:underline">정보</button>
                      <button onClick={() => addScore(s.id)} className="text-indigo-600 hover:underline">성적</button>
                      <button onClick={() => deleteStudent(c.id, s.id)} className="text-gray-400 hover:text-red-500">×</button>
                    </div>
                  </div>
                ))}
              </div>
              <button onClick={() => addStudent(c.id)} className="text-xs text-indigo-600 hover:underline">+ 학생 추가</button>
            </div>
          ))}
        </div>
      )}

      {tab === 'report' && (
        <div>
          <select
            value={reportStudentId || ''}
            onChange={e => setReportStudentId(e.target.value)}
            className="border border-gray-300 rounded-lg px-3 py-1.5 text-sm mb-4"
          >
            {allStudents(data).map(s => (
              <option key={s.id} value={s.id}>{s.name} ({s.className})</option>
            ))}
          </select>

          {reportData && (
            <div className="bg-white border border-gray-200 rounded-xl p-5">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-sm font-medium text-indigo-700">
                    {reportData.student.name.slice(0,2)}
                  </div>
                  <div>
                    <p className="font-medium text-gray-900">{reportData.student.name} 학습리포트</p>
                    <p className="text-xs text-gray-500">{daysAgoStr(6)} ~ {todayStr()} · {reportData.student.className}</p>
                    {reportData.student.parentPhone && (
                      <p className="text-xs text-gray-400">학부모 연락처: {reportData.student.parentPhone}</p>
                    )}
                  </div>
                </div>
                <span className="text-xs px-2.5 py-1 rounded-full bg-yellow-50 text-yellow-700">발송 채널 미정</span>
              </div>

              <div className="grid grid-cols-3 gap-2 mb-4">
                <MetricBox label="출석률" value={reportData.attendanceRate!==null ? reportData.attendanceRate+'%' : '기록없음'} />
                <MetricBox label="숙제 제출률" value={reportData.homeworkRate!==null ? reportData.homeworkRate+'%' : '기록없음'} />
                <MetricBox label="최근 점수" value={reportData.scores[0] ? reportData.scores[0].score+'점' : '기록없음'} />
              </div>

              {reportData.attendanceDetails.length > 0 && (
                <div className="mb-4">
                  <p className="text-xs text-gray-500 mb-1.5">최근 출결 상세</p>
                  <div className="space-y-1.5">
                    {reportData.attendanceDetails.map((a, i) => (
                      <div key={i} className="text-xs bg-gray-50 px-2.5 py-1.5 rounded-lg">
                        <div className="flex items-center gap-1.5 flex-wrap">
                          <span className="font-medium text-gray-700">{a.date}</span>
                          <span className={`px-1.5 py-0.5 rounded-full ${STATUS[a.status]?.color}`}>{STATUS[a.status]?.label}</span>
                          {a.hw && (
                            <span className={`px-1.5 py-0.5 rounded-full ${a.hw === 'done' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                              숙제 {a.hw === 'done' ? '완료' : '미완'}
                            </span>
                          )}
                        </div>
                        {a.note && <p className="text-gray-500 mt-1">사유: {a.note}</p>}
                        {a.hwNote && <p className="text-gray-500 mt-1">숙제 후속조치: {a.hwNote}</p>}
                        {a.lesson && <p className="text-gray-700 mt-1">수업 내용: {a.lesson}</p>}
                        {a.homeworkAssigned && <p className="text-gray-700 mt-1">내준 숙제: {a.homeworkAssigned}</p>}
                        {a.attitude && <p className="text-gray-700 mt-1">수업 태도: {a.attitude}</p>}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {reportData.scores.length > 0 && (
                <div className="mb-4">
                  <p className="text-xs text-gray-500 mb-1.5">최근 시험 기록</p>
                  <div className="space-y-1">
                    {reportData.scores.map(sc => (
                      <div key={sc.id} className="flex justify-between text-xs text-gray-700 bg-gray-50 px-2.5 py-1.5 rounded-lg">
                        <span>{sc.label} ({sc.date})</span>
                        <span className="flex items-center gap-2">
                          {sc.score}점
                          <button onClick={() => editScore(reportData.student.id, sc.id)} className="text-indigo-600 hover:underline">수정</button>
                          <button onClick={() => deleteScore(reportData.student.id, sc.id)} className="text-gray-400 hover:text-red-500">×</button>
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="mb-4">
                <p className="text-xs text-gray-500 mb-1.5">담당 강사 코멘트</p>
                <textarea
                  value={comment}
                  onChange={e => setComment(e.target.value)}
                  placeholder="이번 주 학습 태도, 잘한 점, 다음 목표 등을 적어주세요."
                  className="w-full border border-gray-300 rounded-lg p-2.5 text-sm h-20"
                />
              </div>

              <div className="flex gap-2">
                <button onClick={saveComment} className="flex-1 py-2 text-sm rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50">
                  리포트 저장
                </button>
                <button
                  disabled
                  title="카카오 알림톡 연동 준비 중"
                  className="flex-1 py-2 text-sm rounded-lg border border-gray-200 text-gray-300 cursor-not-allowed"
                >
                  발송 (보류)
                </button>
              </div>

              {data.reports[reportData.student.id]?.length > 0 && (
                <div className="mt-4 pt-3 border-t border-gray-100">
                  <p className="text-xs text-gray-500 mb-1.5">발송 이력</p>
                  {data.reports[reportData.student.id].slice().reverse().map((r,i) => (
                    <p key={i} className="text-xs text-gray-400">{r.date} · 채널: {r.channel}</p>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {tab === 'vocabtest' && (
        <div className="space-y-3">
          <button onClick={addVocabTest} className="w-full py-2 border-2 border-dashed border-indigo-300 rounded-xl text-sm text-indigo-600 hover:bg-indigo-50">
            + 시험 기록 추가
          </button>
          {data.vocabTests.length === 0 && <EmptyState text="등록된 시험 기록이 없습니다." />}
          {data.vocabTests
            .slice()
            .sort((a,b) => b.date.localeCompare(a.date))
            .map(v => {
              const student = allStudents(data).find(s => s.id === v.studentId);
              return (
                <div key={v.id} className="bg-white border border-gray-200 rounded-xl p-4">
                  <div className="flex items-start justify-between mb-1.5">
                    <div>
                      <p className="font-medium text-gray-900">{student ? `${student.name} (${student.className})` : '삭제된 학생'}</p>
                      <p className="text-xs text-gray-500">{v.date} · {v.testType}</p>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${v.result === 'pass' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                        {v.result === 'pass' ? '합격' : '불합격'}
                      </span>
                      {v.retest && <span className="text-xs px-2 py-0.5 rounded-full bg-yellow-50 text-yellow-700 font-medium">재시험 필요</span>}
                      <button onClick={() => editVocabTest(v.id)} className="text-xs text-indigo-600 hover:underline">수정</button>
                      <button onClick={() => deleteVocabTest(v.id)} className="text-xs text-gray-400 hover:text-red-500">삭제</button>
                    </div>
                  </div>
                  <p className="text-sm text-gray-600 mb-1">틀린 개수: {v.wrongCount}개</p>
                  {v.comment && <p className="text-sm text-gray-600">{v.comment}</p>}
                </div>
              );
          })}
        </div>
      )}

      {tab === 'notice' && (
        <div className="space-y-3">
          <button onClick={addAnnouncement} className="w-full py-2 border-2 border-dashed border-indigo-300 rounded-xl text-sm text-indigo-600 hover:bg-indigo-50">
            + 새 공지 작성
          </button>
          {data.announcements.length === 0 && <EmptyState text="등록된 공지가 없습니다." />}
          {data.announcements.map(a => (
            <div key={a.id} className="bg-white border border-gray-200 rounded-xl p-4">
              <div className="flex items-start justify-between mb-1.5">
                <p className="font-medium text-gray-900">{a.title}</p>
                <div className="flex items-center gap-2 shrink-0 ml-2">
                  <button onClick={() => editAnnouncement(a.id)} className="text-xs text-indigo-600 hover:underline">수정</button>
                  <button onClick={() => deleteAnnouncement(a.id)} className="text-xs text-gray-400 hover:text-red-500">삭제</button>
                </div>
              </div>
              <p className="text-sm text-gray-600 mb-2">{a.content}</p>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700">대상: {a.target}</span>
                <span className="text-xs text-gray-400">{a.date}</span>
                <span className="text-xs px-2 py-0.5 rounded-full bg-yellow-50 text-yellow-700">발송 채널 미정</span>
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === 'counseling' && (
        <div className="space-y-3">
          <button onClick={addCounseling} className="w-full py-2 border-2 border-dashed border-indigo-300 rounded-xl text-sm text-indigo-600 hover:bg-indigo-50">
            + 새 상담 등록
          </button>
          {data.counseling.length === 0 && <EmptyState text="등록된 상담이 없습니다." />}
          {data.counseling
            .slice()
            .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time))
            .map(k => (
              <div key={k.id} className="bg-white border border-gray-200 rounded-xl p-4">
                <div className="flex items-start justify-between mb-1.5">
                  <div>
                    <p className="font-medium text-gray-900">{k.studentName}{k.parentName ? ` · ${k.parentName}` : ''}</p>
                    <p className="text-xs text-gray-500">{k.date} {k.time} · {k.type}</p>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    <button
                      onClick={() => toggleCounselingStatus(k.id)}
                      className={`text-xs px-2 py-0.5 rounded-full border ${k.status==='완료' ? 'bg-green-100 text-green-700 border-green-300' : 'bg-yellow-50 text-yellow-700 border-yellow-300'}`}
                    >{k.status}</button>
                    <button onClick={() => editCounseling(k.id)} className="text-xs text-indigo-600 hover:underline">수정</button>
                    <button onClick={() => deleteCounseling(k.id)} className="text-xs text-gray-400 hover:text-red-500">삭제</button>
                  </div>
                </div>
                {k.content && <p className="text-sm text-gray-600 mb-1">{k.content}</p>}
                {k.nextAction && <p className="text-xs text-indigo-600">다음 액션: {k.nextAction}</p>}
              </div>
          ))}
        </div>
      )}

      {tab === 'worklog' && (
        <div className="space-y-3">
          <button onClick={addWorkLog} className="w-full py-2 border-2 border-dashed border-indigo-300 rounded-xl text-sm text-indigo-600 hover:bg-indigo-50">
            + 업무일지 작성
          </button>
          {data.workLogs.length === 0 && <EmptyState text="작성된 업무일지가 없습니다." />}
          {data.workLogs
            .slice()
            .sort((a,b) => b.date.localeCompare(a.date))
            .map(w => (
              <div key={w.id} className="bg-white border border-gray-200 rounded-xl p-4">
                <div className="flex items-start justify-between mb-1.5">
                  <div>
                    <p className="font-medium text-gray-900">{w.teacher || '미지정'}</p>
                    <p className="text-xs text-gray-500">{w.date}</p>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700">{w.category}</span>
                    <button onClick={() => editWorkLog(w.id)} className="text-xs text-indigo-600 hover:underline">수정</button>
                    <button onClick={() => deleteWorkLog(w.id)} className="text-xs text-gray-400 hover:text-red-500">삭제</button>
                  </div>
                </div>
                <p className="text-sm text-gray-600">{w.content}</p>
              </div>
          ))}
        </div>
      )}

      {tab === 'news' && (
        <div>
          <div className="bg-white border border-gray-200 rounded-xl p-4 mb-4 space-y-2">
            <div>
              <label className="text-xs text-gray-500 mb-1 block">Worker 프록시 URL</label>
              <input
                type="text"
                value={data.newsProxyUrl}
                onChange={e => setData(prev => ({ ...prev, newsProxyUrl: e.target.value }))}
                placeholder="https://your-worker-name.your-subdomain.workers.dev"
                className="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm"
              />
            </div>
            <div className="flex gap-2">
              <input
                type="text"
                value={data.newsQuery}
                onChange={e => setData(prev => ({ ...prev, newsQuery: e.target.value }))}
                placeholder="검색어 (예: 수능 영어)"
                className="flex-1 border border-gray-300 rounded-lg px-3 py-1.5 text-sm"
              />
              <button onClick={fetchNews} disabled={newsLoading} className="px-4 py-1.5 text-sm rounded-lg bg-indigo-600 text-white disabled:opacity-50">
                {newsLoading ? '불러오는 중...' : '뉴스 불러오기'}
              </button>
            </div>
            {newsError && <p className="text-xs text-red-500">{newsError}</p>}
            {!data.newsProxyUrl && <p className="text-xs text-gray-400">naver-news-proxy-worker.js를 Cloudflare Worker에 배포하고 주소를 입력하시면 뉴스를 불러올 수 있어요.</p>}
          </div>

          <div className="space-y-2">
            {newsItems.map((item, i) => (
              <a key={i} href={item.link} target="_blank" rel="noopener noreferrer"
                 className="block bg-white border border-gray-200 rounded-xl p-4 hover:border-indigo-300 transition">
                <p className="font-medium text-gray-900 mb-1">{stripHtml(item.title)}</p>
                <p className="text-xs text-gray-500 mb-1.5">{stripHtml(item.description)}</p>
                <p className="text-xs text-gray-400">{item.pubDate}</p>
              </a>
            ))}
            {newsItems.length === 0 && !newsLoading && (
              <EmptyState text="검색어를 입력하고 '뉴스 불러오기'를 눌러주세요." />
            )}
          </div>
        </div>
      )}

      {tab === 'admin' && (
        <div className="space-y-5">
          <div>
            <p className="text-sm font-medium text-gray-900 mb-2">학원 설정</p>
            <div className="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between">
              <span className="text-sm text-gray-700">{data.academyName}</span>
              <button onClick={editAcademyName} className="text-xs text-indigo-600 hover:underline">학원명 수정</button>
            </div>
          </div>

          <div>
            <p className="text-sm font-medium text-gray-900 mb-2">반 정보 · 학생 이름 수정</p>
            <div className="space-y-2">
              {data.classes.map(c => (
                <div key={c.id} className="bg-white border border-gray-200 rounded-xl p-4">
                  <div className="flex items-center justify-between mb-2">
                    <div>
                      <p className="font-medium text-gray-900">{c.name}</p>
                      <p className="text-xs text-gray-500">{c.teacher} · {c.room} · {classScheduleSummary(c)}</p>
                    </div>
                    <button onClick={() => editClassInfo(c.id)} className="text-xs text-indigo-600 hover:underline">정보 수정</button>
                  </div>
                  <div className="space-y-1">
                    {c.students.map(s => (
                      <div key={s.id} className="flex items-center justify-between text-xs bg-gray-50 px-2.5 py-1.5 rounded-lg">
                        <span className="text-gray-700">{s.name}</span>
                        <button onClick={() => renameStudent(c.id, s.id)} className="text-indigo-600 hover:underline">이름 수정</button>
                      </div>
                    ))}
                    {c.students.length === 0 && <p className="text-xs text-gray-400">등록된 학생이 없습니다.</p>}
                  </div>
                </div>
              ))}
              {data.classes.length === 0 && <EmptyState text="등록된 반이 없습니다." />}
            </div>
          </div>

          <div>
            <p className="text-sm font-medium text-gray-900 mb-2">전체 데이터 한눈에 보기</p>
            <div className="bg-white border border-gray-200 rounded-xl overflow-x-auto">
              <table className="w-full text-xs whitespace-nowrap">
                <thead>
                  <tr className="text-left text-gray-500 border-b border-gray-100">
                    <th className="p-2.5">반</th>
                    <th className="p-2.5">학생</th>
                    <th className="p-2.5">학교/학년</th>
                    <th className="p-2.5">학부모 연락처</th>
                    <th className="p-2.5">수강료</th>
                    <th className="p-2.5">납부상태</th>
                  </tr>
                </thead>
                <tbody>
                  {allStudents(data).map(s => {
                    const p = data.payments[s.id] || { tuition: 0, status: 'unpaid' };
                    return (
                      <tr key={s.id} className="border-b border-gray-50 last:border-0">
                        <td className="p-2.5 text-gray-700">{s.className}</td>
                        <td className="p-2.5 text-gray-900 font-medium">{s.name}</td>
                        <td className="p-2.5 text-gray-500">{[s.school, s.grade].filter(Boolean).join(' ') || '-'}</td>
                        <td className="p-2.5 text-gray-500">{s.parentPhone || '-'}</td>
                        <td className="p-2.5 text-gray-700">{(p.tuition || 0).toLocaleString()}원</td>
                        <td className="p-2.5 text-gray-700">{PAYMENT_STATUS[p.status]?.label || p.status}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {allStudents(data).length === 0 && <p className="p-4 text-xs text-gray-400">등록된 학생이 없습니다.</p>}
            </div>
          </div>

          <button onClick={exportData} className="w-full py-2 text-sm rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50">
            전체 데이터 JSON으로 내보내기
          </button>
        </div>
      )}
    </div>
  );
}

function SummaryCard({ label, value, tone }) {
  return (
    <div className={`rounded-xl p-3 ${tone}`}>
      <p className="text-xs opacity-80 mb-1">{label}</p>
      <p className="text-lg font-semibold">{value}</p>
    </div>
  );
}

function MetricBox({ label, value }) {
  return (
    <div className="bg-gray-50 rounded-lg p-2.5">
      <p className="text-xs text-gray-500 mb-1">{label}</p>
      <p className="text-base font-semibold text-gray-900">{value}</p>
    </div>
  );
}

function EmptyState({ text }) {
  return <div className="text-center py-12 text-sm text-gray-400">{text}</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
