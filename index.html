  // 잘못 입력한 교재비 청구를 통째로 취소 (해당 달 청구 자체와 납부 기록을 모두 삭제)
  function deleteBookFeeCharge(studentId, monthKey) {
    if (!confirm(`${monthKeyLabel(monthKey)} 교재비 청구를 삭제하시겠습니까?\n납부 기록이 있다면 함께 삭제됩니다.`)) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (next.bookFeesByMonth?.[monthKey]) delete next.bookFeesByMonth[monthKey][studentId];
      return next;
    });
  }

  // 실수로 잘못 입력한 교재비 납부 기록만 취소 (청구 금액은 그대로 두고 미납 상태로 되돌림)
  function clearBookFeePayments(studentId, monthKey) {
    if (!confirm(`${monthKeyLabel(monthKey)} 교재비의 납부 기록을 취소하시겠습니까?\n청구 금액은 그대로 남고, 다시 미납 상태로 바뀝니다.`)) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const r = next.bookFeesByMonth?.[monthKey]?.[studentId];
      if (!r) return prev;
      r.payments = [];
      r.status = 'unpaid';
      r.paidDate = null;
      return next;
    });
  }

  // 반별·월별 교재비 일괄 설정 (보는 달 기준, 미납 상태로 청구 생성)
  function bulkSetBookFeeByClass(classId, amount) {
    if (isNaN(amount) || amount < 0 || !classId) { setBookFeeBulkFlash(''); return; }
    const monthKey = activePaymentMonthKey();
    let count = 0;
    let className = '';
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const cls = next.classes.find(c => c.id === classId);
      if (!cls) return prev;
      className = cls.name;
      cls.students.filter(s => isActiveInMonth(s, monthKey)).forEach(s => {
        if (amount === 0) {
          if (next.bookFeesByMonth?.[monthKey]) delete next.bookFeesByMonth[monthKey][s.id];
        } else {
          const r = ensureBookFeeMonthRecord(next, s.id, monthKey);
          r.fee = amount;
        }
        count++;
      });
      return next;
    });
    setBookFeeBulkFlash(amount === 0
      ? `${className} ${count}명의 ${monthKeyLabel(monthKey)} 교재비 청구를 없앴습니다.`
      : `${className} ${count}명에게 ${monthKeyLabel(monthKey)} 교재비 ${amount.toLocaleString()}원을 일괄 설정했습니다.`);
  }

  function bulkSetTuitionByGrade(grade, amount) {
    if (isNaN(amount) || amount < 0) { setBulkGradeApplyFlash(''); return; }
    const monthKey = activePaymentMonthKey();
    let count = 0;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      next.classes.forEach(c => c.students.forEach(s => {
        if (s.grade === grade && isActiveInMonth(s, monthKey)) {
          ensureTuitionRecord(next, s.id, monthKey).tuition = amount;
          count++;
        }
      }));
      return next;
    });
    setBulkGradeApplyFlash(count ? `${grade} 학생 ${count}명에게 수업료 ${amount.toLocaleString()}원을 일괄 적용했습니다.` : `${grade} 학년 학생이 없습니다.`);
  }

  function bulkSetTuitionByClass(classId, amount) {
    if (isNaN(amount) || amount < 0 || !classId) { setBulkClassApplyFlash(''); return; }
    const monthKey = activePaymentMonthKey();
    let count = 0;
    let className = '';
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const cls = next.classes.find(c => c.id === classId);
      if (!cls) return prev;
      className = cls.name;
      cls.students.filter(s => isActiveInMonth(s, monthKey)).forEach(s => {
        ensureTuitionRecord(next, s.id, monthKey).tuition = amount;
        count++;
      });
      return next;
    });
    setBulkClassApplyFlash(count ? `${className} 학생 ${count}명에게 수업료 ${amount.toLocaleString()}원을 일괄 적용했습니다.` : `${className} 반에 학생이 없습니다.`);
  }

  function requestPayment(studentId) {
    const s = allStudents(data).find(s => s.id === studentId);
    if (!s) return;
    const monthKey = activePaymentMonthKey();
    const t = getTuitionRecord(data, studentId, monthKey);
    const bfOut = bookFeeOutstanding(data, studentId, monthKey); // 이월 누적 미납 교재비 포함
    if (!data.paymentGatewayProxyUrl) {
      setGatewayErrorFor(prev => ({ ...prev, [studentId]: '결제선생 등 외부 결제창 프록시 URL이 설정되지 않았습니다. 관리자 탭에서 먼저 설정해주세요.' }));
      return;
    }
    setGatewayPendingFor(studentId);
    setGatewayErrorFor(prev => ({ ...prev, [studentId]: '' }));
    fetch(data.paymentGatewayProxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        studentId, studentName: s.name, phone: s.parentPhone || s.studentPhone || '',
        tuition: t.tuition || 0, bookFee: bfOut.total, amount: (t.tuition || 0) + bfOut.total,
      }),
    })
      .then(res => { if (!res.ok) throw new Error('요청 실패'); return res.json(); })
      .then(json => {
        if (!json.success) throw new Error(json.error || '결제 요청에 실패했습니다.');
        setData(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          ensureTuitionRecord(next, studentId, monthKey).gatewayRequestedAt = todayStr();
          return next;
        });
      })
      .catch(err => setGatewayErrorFor(prev => ({ ...prev, [studentId]: err.message || '결제 요청에 실패했습니다.' })))
      .finally(() => setGatewayPendingFor(null));
  }

      setReminderSendError('선택된 학부모가 없습니다.');

    setReminderSendPending(true);
    setReminderSendError('');
    sendAlimtalk(data.alimtalkProxyUrl, phones, 'payment_reminder', { academyName: data.academyName, date: todayStr() })
      .then(() => {
        setData(prev => ({ ...prev, autoPaymentReminderLastSent: todayStr() }));
        setReminderSendFlash(`${phones.length}명에게 미납 알림을 발송했습니다.`);

      .catch(err => setReminderSendError(err.message || '발송에 실패했습니다.'))
      .finally(() => setReminderSendPending(false));

  /* ---- 알림톡 발송 전 확인 단계 ----
     발송 버튼을 누르면 바로 보내지 않고, 받는 사람 목록과 발송 문구 미리보기를
     먼저 보여준 뒤 "이대로 발송"을 눌러야 실제 발송한다. */
  const [alimtalkConfirm, setAlimtalkConfirm] = useState(null);
  const [alimtalkChecked, setAlimtalkChecked] = useState({}); // 선택 발송용: { phone: 체크여부 }
  // 발송 버튼이 화면 아래쪽에 있어도 확인 창이 바로 보이도록, 확인 창이 열리면 그 위치로 스크롤
  useEffect(() => {
    if (!alimtalkConfirm) return;
    const el = document.getElementById('alimtalkConfirmPanel');
    if (el && typeof el.scrollIntoView === 'function') {
      try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    }
  }, [alimtalkConfirm]);
  const [testSendPhone, setTestSendPhone] = useState('');
  const [testSendPending, setTestSendPending] = useState(false);
  const [testSendFlash, setTestSendFlash] = useState('');
  const [testSendError, setTestSendError] = useState('');

  function runTestSend() {

  function toDotDate(iso) {
    if (!iso) return '';
    const parts = String(iso).split('-');
    if (parts.length !== 3) return iso;
    const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    if (!y || !m || !d) return iso;
    return `${y}.${m}.${d}`;

  // Always reflects the current calendar month — the dashboard-wide overview and reminder alerts
  // are about "right now", regardless of which month an admin might be browsing in the payment tab.
  const paymentSummary = useMemo(() => computePaymentSummary(data, currentMonthKey()), [data]);

  const paymentAlerts = useMemo(() => {
    const now = new Date();
    const todayDay = now.getDate();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowDay = tomorrow.getDate();
    const monthKey = currentMonthKey();
    const dueToday = [], dueTomorrow = [], unpaidList = [];
    allStudents(data).filter(s => isActiveForPaymentView(s, monthKey)).forEach(s => {
      const t = getTuitionRecord(data, s.id, monthKey);
      // 결제일이 31일처럼 이번 달/다음 날짜엔 없는 날일 수 있으므로(30일·28일까지만 있는 달 등),
      // 그 달의 마지막 날로 보정해서 비교한다.
      if (effectivePaymentDueDay(s.paymentDueDay, now.getFullYear(), now.getMonth() + 1) === todayDay) dueToday.push(s);
      else if (effectivePaymentDueDay(s.paymentDueDay, tomorrow.getFullYear(), tomorrow.getMonth() + 1) === tomorrowDay) dueTomorrow.push(s);
      if ((t.status === 'unpaid' || t.status === 'overdue') && !isBeforeDueDateThisMonth(s, monthKey)) unpaidList.push(s);
    });
    return { dueToday, dueTomorrow, unpaidList };
  }, [data]);

  const reportData = useMemo(() => {
    if (!reportStudentId) return null;
    const students = allStudents(data);
    const student = students.find(s => s.id === reportStudentId);
    if (!student) return null;

    let start = reportStartDate || daysAgoStr(6);
    let end = reportEndDate || todayStr();
    if (start > end) { const tmp = start; start = end; end = tmp; }
    const rangeDates = [];
    {
      const cur = new Date(start + 'T00:00:00');
      const endD = new Date(end + 'T00:00:00');
      let guard = 0;
      while (cur <= endD && guard < 370) {
        const tz = cur.getTimezoneOffset() * 60000;
        rangeDates.push(new Date(cur - tz).toISOString().slice(0, 10));
        cur.setDate(cur.getDate() + 1);
        guard++;
      }
    }
    let attCount=0, presentCount=0, hwTotal=0, hwDone=0;
    const statusCounts = { present: 0, late: 0, early: 0, absent: 0 };
    const attendanceDetails = [];
    rangeDates.forEach(d => {
      const entry = getAttendanceEntry(data, d, student.classId, student.id);
      if (entry && entry.status) {
        attCount++;
        if (statusCounts[entry.status] !== undefined) statusCounts[entry.status]++;
        if (entry.status === 'present' || entry.status === 'late') presentCount++;
        const hw = normalizeHomework(entry);
        // 미확인(unchecked, 결석 등)도 이행률 분모에 포함 — 완료만 제출로 인정해
        // 결석으로 검사받지 못한 날도 제출률이 깎이게 한다 (학부모 경각심 목적).
        // 다만 '숙제 없음'(그날 애초에 숙제가 없었던 경우)은 완료와 동일하게 인정한다.
        if (hw) { hwTotal++; if (hw === 'done' || hw === 'none') hwDone++; }
        attendanceDetails.push({
          date: d, status: entry.status, note: entry.note || '', hw, hwNote: entry.homeworkNote || '',
          attitude: entry.attitude || '', lesson: getLessonLog(data, d, student.classId),
          homeworkAssigned: getClassHomework(data, d, student.classId),
        });
      }
    });
    attendanceDetails.reverse();
    const attendanceRate = attCount ? Math.round((presentCount/attCount)*100) : null;
    const homeworkRate = hwTotal ? Math.round((hwDone/hwTotal)*100) : null;
    const hwCounts = { done: hwDone, missing: hwTotal - hwDone };

    const scores = (data.records[student.id]?.scores || []).slice(-3).reverse();

    let homeworkHistory = [];
    Object.keys(data.attendance).sort().reverse().forEach(d => {
      const entry = getAttendanceEntry(data, d, student.classId, student.id);
      const hw = normalizeHomework(entry);
      if (hw) homeworkHistory.push({ date: d, hw, hwNote: entry?.homeworkNote || '', status: entry?.status });
    });
    homeworkHistory = homeworkHistory.slice(0, 10);

    const vtByDate = {};
    let vocabTestHistory = [];
    data.vocabTests
      .filter(v => v.studentId === student.id && v.result)
      .forEach(v => {
        if (!vtByDate[v.date]) { vtByDate[v.date] = { date: v.date, tests: [] }; vocabTestHistory.push(vtByDate[v.date]); }
        vtByDate[v.date].tests.push(v);
      });
    vocabTestHistory = vocabTestHistory
      .slice().sort((a,b) => b.date.localeCompare(a.date))
      .slice(0, 10);
    vocabTestHistory.forEach(g => g.tests.sort((a,b) => VOCAB_TEST_TYPES.indexOf(a.testType) - VOCAB_TEST_TYPES.indexOf(b.testType)));

    const streakBadge = attendanceStreakBadge(data, student.classId, student.id);
    const attendanceAlert = streakBadge ? streakBadge.label : '';
    return { student, attendanceRate, homeworkRate, scores, attCount, hwTotal, attendanceDetails, homeworkHistory, vocabTestHistory, statusCounts, hwCounts, startDate: start, endDate: end, attendanceAlert };
  }, [reportStudentId, data, reportStartDate, reportEndDate]);

  const groupedVocabTests = useMemo(() => {
    const groups = {};
    const order = [];
    data.vocabTests.forEach(v => {
      if (!v.result) return;
      const key = v.studentId + '|' + v.date;
      if (!groups[key]) { groups[key] = { studentId: v.studentId, date: v.date, records: [] }; order.push(key); }
      groups[key].records.push(v);
    });
    return order
      .map(k => groups[k])
      .sort((a, b) => b.date.localeCompare(a.date))
      .map(g => ({ ...g, records: g.records.slice().sort((a,b) => VOCAB_TEST_TYPES.indexOf(a.testType) - VOCAB_TEST_TYPES.indexOf(b.testType)) }));
  }, [data.vocabTests]);

  const [vtCalMonth, setVtCalMonth] = useState(todayStr().slice(0, 7));
  const [vtFilterDate, setVtFilterDate] = useState(null);
  const [vtExpandedDates, setVtExpandedDates] = useState({}); // { [date]: true } — 전체 시험 기록 접기/펼치기
  const [scheduleMonth, setScheduleMonth] = useState(todayStr().slice(0, 7));
  const [scheduleSubTab, setScheduleSubTab] = useState('plan');
  const [scheduleShareFlash, setScheduleShareFlash] = useState('');

  const vocabByDate = useMemo(() => {
    const m = {};
    data.vocabTests.forEach(v => {
      if (!v.result) return;
      if (!m[v.date]) m[v.date] = { total: 0, fail: 0 };
      m[v.date].total++;
      if (v.result === 'fail') m[v.date].fail++;
    });
    return m;
  }, [data.vocabTests]);

  const visibleVocabTestGroups = useMemo(() => {
    if (!vtFilterDate) return groupedVocabTests;
    return groupedVocabTests.filter(g => g.date === vtFilterDate);
  }, [groupedVocabTests, vtFilterDate]);

  function saveComment() {
    if (!reportStudentId) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.reports[reportStudentId]) next.reports[reportStudentId] = [];
      next.reports[reportStudentId].push({ date: todayStr(), comment, channel: '미정' });
      return next;
    });
    alert('리포트가 저장됐어요.');
    setComment('');
  }

  function sendReportAlimtalk(phones) {
    if (!reportData) return;
    // 확인 패널에서 체크해 넘어온 번호가 있으면 그대로 쓰고, 없으면(선택 UI 없이 바로 보낸 경우)
    // 기존처럼 학부모 번호로만 보낸다.
    const targets = (phones && phones.length ? phones : [reportData.student.parentPhone].filter(Boolean));
    if (!targets.length) {
      setReportSendError('학부모/학생 연락처가 등록되어 있지 않습니다. 반 관리 탭에서 먼저 등록해주세요.');
      return;
    }
    setReportSendPending(true);
    setReportSendError('');
    const variables = {
      studentName: reportData.student.name,
      academyName: data.academyName,
      className: reportData.student.className,
      rangeStart: reportData.startDate,
      rangeEnd: reportData.endDate,
      attendanceRate: reportData.attendanceRate !== null ? reportData.attendanceRate + '%' : '기록없음',
      homeworkRate: reportData.homeworkRate !== null ? reportData.homeworkRate + '%' : '기록없음',
      attendanceAlert: reportData.attendanceAlert || '없음',
      testResults: buildPeriodTestSummary(data, reportData.student.id, reportData.startDate, reportData.endDate),
      recentScore: reportData.scores[0] ? reportData.scores[0].score + '점' : '기록없음',
      comment: comment || '-',
    };
    sendAlimtalk(data.alimtalkProxyUrl, targets, 'report', variables)
      .then(() => {
        setData(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          if (!next.reports[reportData.student.id]) next.reports[reportData.student.id] = [];
          targets.forEach(phone => {
            next.reports[reportData.student.id].push({ date: todayStr(), comment, channel: '카카오 알림톡', phone });
          });
          return next;
        });
        setComment('');
        setReportSendSuccessFlash(true);
      })
      .catch(err => setReportSendError(err.message || '발송에 실패했습니다.'))
      .finally(() => setReportSendPending(false));
  }

  return (
    <div className="min-h-screen bg-gray-50 md:flex">
      {sidebarOpen && (
        <div className="fixed inset-0 bg-black/40 z-30 md:hidden" onClick={() => setSidebarOpen(false)} />
      )}
      <aside className={`fixed inset-y-0 left-0 z-40 w-64 ${sidebarCollapsed ? 'md:w-16' : 'md:w-64'} shrink-0 bg-slate-900 text-slate-300 flex flex-col transform transition-all duration-200 md:static md:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
        <div className={`flex items-center gap-2.5 px-5 py-5 border-b border-white/10 ${sidebarCollapsed ? 'md:justify-center md:px-0' : ''}`}>
          <div className={`sally-logo-panel ${sidebarCollapsed ? 'sally-logo-small' : ''}`}><img src="data:image/webp;base64,UklGRkCjAABXRUJQVlA4TDOjAAAv38FPEAHfti1JkiRJkt8DgAMwEP3/ByMgEiuZ6LD8KaL/E6D/j7a/r/a7+h3zO6Gyxex3UppJrnn9Jjgwy6Y5zX4Tp9agMX4THpHd5ZLM0kZw/WywUUQO5K4w2Zxpa8XPxGaudFdajkw7+pFP5D6mumPNTbp+BT8FB+CfQURel36pSfO/w0YnkoY+jTAz+zU64HWcqB1JCt0P+NKP+MgpD+bPFU/E9eA3mvm7+rPk52GTlX0LdBX2gLeYjZTsyA70Ud73fVUuKe9b8iwS9eV+In+FmfU7JXexweQ7yHWDuplJ8uiRgCSG3fQBJrMlGu+IcV0piXkQDQ4EUIEAJInRuxdmdrtnWmYWvIQQIEm2sYg2vjZ3zsYwMyOv2DnvyJCi4AixGwubthN8BsjCyusC3Bf5O2KO4Tq3C5hf004RbVml6xImd19eSgQ6t9tgjIPYIXAOmA23jSRw9Te5t5a9P1DE6Lbxr2k2+pFba+ovkpw+hiT3BS4TMQbPJOoN0NuJfM7es0vuL5F/PkNzuHsBgiFR1d/aVpI82qskufvsHUmmNWB+x7/ETvKW5s4LEhbJZ59Itok+ofCNpagXELSjFIs8InjVpN/LXSgiVeWGMysOJdiI91AQA0RYxZyzyMwCrl+xNqiwl2iDLWw8mkCCjZ1ZFOOM7puwV0S4L9bMMINKEfP2hTEAs0xB74tZXgtjFq1VLsnM7HqD3Fov7tvStEWSbknKTJVppsPFMrVtIAItIbNXvBkdX+jrl/4l5gM4oppfyA1FbniQmxD5HTmmnpKsdUDuH5xF8tnv2ySZpEvy6F1IDupmldzCuA2ZFS6l5GGSXZekIOaUnVAMscgZC3hzq+C6TLZqdQckQR8HIgJb7rTFR0pCBiAJxgc7KhkDFgFItObuLGI1M8tKbhuyoOid1bKQAxLR74MOPECsT1p395MIvzbiSbnrvRfzC75p7CT6LCzRteCtt7PWgd0sYgAHpp27JLmW1tmxURy1kxXcfUq+MQYn0r3ogagdd3fVtDxZl2OaSMlOcFu84tGK8aBVQ6jrAGWmpGxxhFgAISmP8Dmnu1dNX+kPKN0b6l3yQupSkXmko5T8c+Y2xnQHBLqrzAqBvuQ+myT3BZFaMzKPKMRngORwgnw6qlrPSvJw7nsZZ4fuPvonP45EF2zGKOaDORc98kFWEWNHDGCxs6FFAHL3z4dlfdKLLcpiNXZyOlMb7ahyzA2ZInzBF8l9jEWxa3MWVK3qlhvLE7n3GVWMg54VG1uYhTZQrJtePYRGZUVs5FMTJPdoepS9slh6B8TwQjCLcaD2FfVe2CM5LHK/cV+CrY8BmFleKUKFui9mmC1zl9J31FXnfctiSBtrhdyta21x35A2xhhaY1xpNsaUgNRqH1sjonW5pNZA8kfnWSqzkJTF4ywLKVI16DhVp5SrlL/kD5A3mC38LCaBJKMiJaWUR6RpmJTPrvzvGFbJrDJJULC7TNwVRQqZRMrfwFcACSSAa2ER9eUsILgzgbT/ueNgkGS6dD3jyXdZLyiQqPaZSNyFV6yjKPXNfINceV8pMsFskwloKJUpYSB3ZZKSy0wGIKVSfOMXzpN/3Py2ftp8Bz8GdvAPcSHHkSRHkgyDwqCW5xKR9f9fteKKK3FyJLOqB3NUlOTaliMpp7sxoVAodPEeQux/MSyBISPkPZTk2rbt1M0EU1zggrazso5VqXSp//8Cly5f6Zxz7P8E4P9jh5BfRlEEUe0fKYQOiOwfCOAxOOcAXBp+QZ4BgAB8wC9JQQgIH34RgGs08Cuz/FL7qx2hS+IPRwKgSWErCDylsAvMBdAoYGIw7QKAj5JG2JcArv/desp                               />
                            </div>
                          );

// 채점지 사진을 그대로 저장하면 용량이 커서(수 MB) 동기화가 느려지므로, 캔버스로
// 가로 1000px·JPEG 70%로 줄여서 저장한다. 캔버스를 못 쓰는 환경이면 원본을 그대로 쓴다.
function resizeImageForUpload(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('이미지를 읽을 수 없습니다.'));
    reader.onload = () => {
      const rawDataUrl = reader.result;
      const img = new Image();
      img.onerror = () => resolve(rawDataUrl);
      img.onload = () => {
        try {
          const maxW = 1000;
          const scale = img.width > maxW ? maxW / img.width : 1;
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale) || img.width || 1;
          canvas.height = Math.round(img.height * scale) || img.height || 1;
          const ctx = canvas.getContext('2d');
          if (!ctx) { resolve(rawDataUrl); return; }
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        } catch (e) { resolve(rawDataUrl); }
      };
      img.src = rawDataUrl;
    };
    reader.readAsDataURL(file);
  });
}

/* 반 관리: 반 이름·담당 선생님·강의실을 한 화면에서 수정하는 폼
   (시간·요일 변경은 기존 관리자 탭의 반 정보 수정에서 가능) */
function ClassEditForm({ cls, teacherNames, onSave, onCancel }) {
  const [f, setF] = useState({
    name: cls.name || '',
    teacher: cls.teacher || '',
    room: cls.room || '',
    capacity: cls.capacity || '',
    time: cls.time || '',
    endTime: cls.endTime || '',
    days: cls.days || [],
    special: cls.special || false,
    specialStart: cls.specialStart || '',
    specialEnd: cls.specialEnd || '',
  });
  const [varyByDay, setVaryByDay] = useState(hasVariedTimes(cls));
  const [daySchedule, setDaySchedule] = useState(() => {
    const ds = {};
    (cls.days || []).forEach(d => {
      const o = cls.daySchedule && cls.daySchedule[d];
      ds[d] = { time: (o ? o.time : cls.time) || '', endTime: (o ? o.endTime : cls.endTime) || '' };
    });
    return ds;
  });
  const set = k => e => setF(prev => ({ ...prev, [k]: e.target.value }));
  const setChecked = k => e => setF(prev => ({ ...prev, [k]: e.target.checked }));
  const toggleDay = d => setF(prev => ({
    ...prev,
    days: prev.days.includes(d) ? prev.days.filter(x => x !== d) : [...prev.days, d],
  }));
  const setDayTime = (d, key, value) => setDaySchedule(prev => ({
    ...prev,
    [d]: { time: prev[d]?.time ?? f.time, endTime: prev[d]?.endTime ?? f.endTime, [key]: value },
  }));
  const inputCls = 'w-full border border-gray-300 rounded-lg px-2.5 py-1.5 text-sm mt-1 bg-white';
  return (
    <div className="w-full bg-indigo-50/60 border border-indigo-200 rounded-xl p-3 mt-2">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
        <label className="text-xs text-gray-600">반 이름
          <input value={f.name} onChange={set('name')} className={inputCls} />
        </label>
        <label className="text-xs text-gray-600">담당 선생님
          <input value={f.teacher} onChange={set('teacher')} list="classTeacherList" placeholder="예: 김선생" className={inputCls} />
          <datalist id="classTeacherList">
            {teacherNames.map(n => <option key={n} value={n} />)}
          </datalist>
        </label>
        <label className="text-xs text-gray-600">강의실
          <input value={f.room} onChange={set('room')} placeholder="예: 301호" className={inputCls} />
        </label>
        <label className="text-xs text-gray-600">정원 (명)
          <input type="number" min="0" value={f.capacity} onChange={set('capacity')} placeholder="예: 8" className={inputCls} />
        </label>
        <label className="text-xs text-gray-600">시작 시간
          <input type="time" value={f.time} onChange={set('time')} className={inputCls} />
        </label>
        <label className="text-xs text-gray-600">종료 시간
          <input type="time" value={f.endTime} onChange={set('endTime')} className={inputCls} />
        </label>
      </div>
      <div className="mt-2.5">
        <p className="text-xs text-gray-600 mb-1">요일</p>
        <div className="flex flex-wrap gap-x-3 gap-y-1">
          {DAYS.map(d => (
            <label key={d} className="text-xs text-gray-700 flex items-center gap-1">
              <input type="checkbox" checked={f.days.includes(d)} onChange={() => toggleDay(d)} />
              {d}
            </label>
          ))}
        </div>
      </div>
      <div className="mt-2.5 pt-2.5 border-t border-dashed border-indigo-200">
        <label className="text-xs text-gray-700 flex items-center gap-1.5">
          <input type="checkbox" checked={varyByDay} onChange={e => setVaryByDay(e.target.checked)} />
          요일마다 시작·종료 시간이 다름
        </label>
        {varyByDay && (
          <div className="mt-1.5 space-y-1.5">
            {f.days.length === 0 && <p className="text-xs text-gray-400">먼저 위에서 요일을 선택해주세요.</p>}
            {f.days.map(d => (
              <div key={d} className="flex items-center gap-2 text-xs">
                <span className="w-5 text-gray-600 font-medium">{d}</span>
                <input type="time" value={daySchedule[d]?.time ?? f.time} onChange={e => setDayTime(d, 'time', e.target.value)} className="border border-gray-300 rounded-lg px-2 py-1 text-xs bg-white" />
                <span className="text-gray-400">~</span>
                <input type="time" value={daySchedule[d]?.endTime ?? f.endTime} onChange={e => setDayTime(d, 'endTime', e.target.value)} className="border border-gray-300 rounded-lg px-2 py-1 text-xs bg-white" />
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="mt-2.5 pt-2.5 border-t border-dashed border-indigo-200">
        <label className="text-xs text-gray-700 flex items-center gap-1.5">
          <input type="checkbox" checked={f.special} onChange={setChecked('special')} />
          🗓 특강반 (방학특강 등 운영기간이 정해진 일시적인 반)
        </label>
        {f.special && (
          <div className="mt-1.5">
            <div className="flex items-center gap-2 text-xs">
              <span className="text-gray-600">운영기간</span>
              <input type="date" value={f.specialStart} onChange={set('specialStart')} className="border border-gray-300 rounded-lg px-2 py-1 text-xs bg-white" />
              <span className="text-gray-400">~</span>
              <input type="date" value={f.specialEnd} onChange={set('specialEnd')} className="border border-gray-300 rounded-lg px-2 py-1 text-xs bg-white" />
            </div>
            <p className="text-[11px] text-gray-400 mt-1">
              운영 종료일이 지나면 이 반은 자동으로 보관 처리되어 재원생 수·시간표·수납현황에서 빠지고(반 관리 하단 "보관된 반"에서 계속 열람 가능), 수강료는 운영 시작일이 속한 달에만 수납현황에 표시됩니다.
            </p>
          </div>
        )}
      </div>
      <p className="text-xs text-gray-400 mt-2">정원을 입력하면 재원생(퇴소생 제외)이 정원에 찼을 때 "정원 마감"이 자동 표시되고, 퇴소생이 생기면 자동으로 풀립니다. 담당 선생님 변경은 경영지표·업무일지에 바로 반영돼요.</p>
      <div className="flex gap-2 mt-3">
        <button
          disabled={!f.name.trim()}
          onClick={() => {
            const finalDaySchedule = {};
            if (varyByDay) {
              f.days.forEach(d => {
                const o = daySchedule[d] || {};
                const t = o.time || f.time;
                const e2 = o.endTime || f.endTime;
                if (t !== f.time || e2 !== f.endTime) finalDaySchedule[d] = { time: t, endTime: e2 };
              });
            }
            onSave({
              name: f.name.trim(), teacher: f.teacher.trim(), room: f.room.trim(),
              capacity: f.capacity === '' ? '' : Math.max(0, parseInt(f.capacity, 10) || 0),
              time: f.time, endTime: f.endTime, days: f.days,
              daySchedule: finalDaySchedule,
              special: f.special, specialStart: f.special ? f.specialStart : '', specialEnd: f.special ? f.specialEnd : '',
            });
          }}
          className="px-4 py-1.5 rounded-lg text-sm bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed">저장</button>
        <button onClick={onCancel} className="px-4 py-1.5 rounded-lg text-sm border border-gray-300 text-gray-600 hover:bg-gray-50">취소</button>
      </div>
    </div>
  );
}

  const setChecked = k => e => setF(prev => ({ ...prev, [k]: e.target.checked }));
  const toggleAssign = id => setAssign(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  const inputCls = 'w-full border border-gray-300 rounded-lg px-2.5 py-1.5 text-sm mt-1 bg-white';

          <select value={f.grade} onChange={set('grade')} className={inputCls}>

            {f.grade && !GRADE_ORDER.includes(f.grade) && <option value={f.grade}>{f.grade}</option>}

          </label>
          <label className="text-xs text-gray-600">시간
            <input type="time" value={f.time} onChange={set('time')} className={inputCls} />
          </label>
        </div>
        <label className="text-xs text-gray-600 col-span-2">상담 내용
          <textarea value={f.content} onChange={set('content')} rows={2} className={inputCls} />
        </label>
        <label className="text-xs text-gray-600 col-span-2">다음 액션 (팔로우업 계획)
          <input value={f.nextAction} onChange={set('nextAction')} className={inputCls} />
        </label>
      </div>
      <div className="flex gap-2 mt-3 items-center">
        <button
          disabled={!f.studentName.trim()}
          onClick={() => onSave({ ...f, studentName: f.studentName.trim() })}
          className="px-4 py-1.5 rounded-lg text-sm bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed">저장</button>
        <button onClick={onCancel} className="px-4 py-1.5 rounded-lg text-sm border border-gray-300 text-gray-600 hover:bg-gray-50">취소</button>
        {!f.studentName.trim() && <span className="text-xs text-gray-400">학생 이름을 입력하면 저장할 수 있어요</span>}
      </div>
    </div>
  );
}

function VocabTestCalendar({ month, byDate, selectedDate, todayDateStr, onPrev, onNext, onToday, onSelectDate, onClear }) {
  const year = parseInt(month.slice(0, 4), 10);
  const mo = parseInt(month.slice(5, 7), 10) - 1;
  const startDow = new Date(year, mo, 1).getDay();
  const daysInMonth = new Date(year, mo + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(<div key={'e' + i} />);
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${month}-${String(d).padStart(2, '0')}`;
    const info = byDate[dateStr];
    const isSelected = dateStr === selectedDate;
    const isToday = dateStr === todayDateStr;
    cells.push(
      <button
        key={dateStr}
        type="button"
        disabled={!info}
        onClick={() => onSelectDate(dateStr)}
        className={`aspect-square rounded-lg text-xs flex flex-col items-center justify-center gap-0.5 border ${
          isSelected ? 'border-indigo-400 bg-indigo-50 font-bold text-indigo-700' : 'border-transparent'
        } ${info ? 'bg-gray-100 font-semibold text-gray-800 cursor-pointer hover:border-indigo-300' : 'bg-gray-50 text-gray-300'} ${isToday && !isSelected ? 'ring-1 ring-indigo-400' : ''}`}
      >
        <span>{d}</span>
        {info && <span className={`w-1.5 h-1.5 rounded-full ${info.fail > 0 ? 'bg-red-500' : 'bg-green-500'}`} />}
      </button>
    );
  }
  const monthLabel = `${year}년 ${mo + 1}월`;
  return (
    <div className="bg-white border border-gray-200 rounded-xl p-4 mb-4">
      <div className="flex items-center justify-between mb-2.5">
        <span className="text-sm font-bold text-gray-900">{monthLabel}</span>
        <div className="flex gap-1">
          <button type="button" onClick={onPrev} className="border border-gray-300 rounded-lg px-2.5 py-1 text-xs text-gray-500 hover:border-indigo-300">‹</button>
          <button type="button" onClick={onToday} className="border border-gray-300 rounded-lg px-2.5 py-1 text-xs text-gray-500 hover:border-indigo-300">오늘</button>
          <button type="button" onClick={onNext} className="border border-gray-300 rounded-lg px-2.5 py-1 text-xs text-gray-500 hover:border-indigo-300">›</button>
        </div>
      </div>
      <div className="grid grid-cols-7 gap-1">
        {['일','월','화','수','목','금','토'].map(d => (
          <div key={d} className="text-center text-[10px] text-gray-400 font-semibold pb-1">{d}</div>
        ))}
        {cells}
      </div>
      {selectedDate && (
        <button type="button" onClick={onClear} className="text-xs text-indigo-600 hover:underline mt-2.5">{selectedDate} 필터 해제 ×</button>
      )}
    </div>
  );
}

function MonthNav({ month, onPrev, onNext, onToday }) {
  const year = parseInt(month.slice(0, 4), 10);
  const mo = parseInt(month.slice(5, 7), 10);
  return (
    <div className="flex items-center justify-between mb-3">
      <span className="text-sm font-bold text-gray-900">{year}년 {mo}월</span>
      <div className="flex gap-1">
        <button type="button" onClick={onPrev} className="border border-gray-300 rounded-lg px-2.5 py-1 text-xs text-gray-500 hover:border-indigo-300">‹</button>
        <button type="button" onClick={onToday} className="border border-gray-300 rounded-lg px-2.5 py-1 text-xs text-gray-500 hover:border-indigo-300">오늘</button>
        <button type="button" onClick={onNext} className="border border-gray-300 rounded-lg px-2.5 py-1 text-xs text-gray-500 hover:border-indigo-300">›</button>
      </div>
    </div>
  );
}

function ScheduleCalendarGrid({ month, events, todayDateStr }) {
  const year = parseInt(month.slice(0, 4), 10);
  const mo = parseInt(month.slice(5, 7), 10) - 1;
  const startDow = new Date(year, mo, 1).getDay();
  const daysInMonth = new Date(year, mo + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(<div key={'e' + i} />);
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${month}-${String(d).padStart(2, '0')}`;
    const dow = (startDow + d - 1) % 7;
    const overlapping = events.filter(ev => ev.startDate <= dateStr && ev.endDate >= dateStr);
    const multiDay = overlapping.filter(ev => ev.startDate !== ev.endDate);
    const singleDay = overlapping.filter(ev => ev.startDate === ev.endDate);
    const isToday = dateStr === todayDateStr;
    let bar = null;
    if (multiDay.length) {
      const ev = multiDay[0];
      const isTrueStart = dateStr === ev.startDate;
      const isTrueEnd = dateStr === ev.endDate;
      const bridgeLeft = !isTrueStart && dow !== 0;
      const bridgeRight = !isTrueEnd && dow !== 6;
      bar = (
        <span
          className="absolute h-[5px] rounded bg-indigo-500"
          style={{
            bottom: '4px',
            left: bridgeLeft ? '-3px' : '3px',
            right: bridgeRight ? '-3px' : '3px',
            borderTopLeftRadius: bridgeLeft ? 0 : undefined,
            borderBottomLeftRadius: bridgeLeft ? 0 : undefined,
            borderTopRightRadius: bridgeRight ? 0 : undefined,
            borderBottomRightRadius: bridgeRight ? 0 : undefined,
            clipPath: isTrueEnd ? 'polygon(0 0, calc(100% - 5px) 0, 100% 50%, calc(100% - 5px) 100%, 0 100%)' : undefined,
          }}
        />
      );
    }
    cells.push(
      <div
        key={dateStr}
        className={`relative aspect-square rounded-lg text-xs flex flex-col items-center justify-center gap-0.5 border border-transparent ${
          overlapping.length ? 'bg-gray-100 font-semibold text-gray-800' : 'bg-gray-50 text-gray-300'
        } ${isToday ? 'ring-1 ring-indigo-400' : ''}`}
      >
        <span>{d}</span>
        {singleDay.length > 0 && <span className="w-1.5 h-1.5 rounded-full bg-indigo-500" />}
        {bar}
      </div>
    );
  }
  return (
    <div className="grid grid-cols-7 gap-1">
      {['일','월','화','수','목','금','토'].map(d => (
        <div key={d} className="text-center text-[10px] text-gray-400 font-semibold pb-1">{d}</div>
      ))}
      {cells}
    </div>
  );
}

/* 학부모용 열람 전용 월간 리포트 페이지 — 알림톡 버튼 링크(#r=...)로 열리며,
   대시보드 데이터(localStorage) 없이 링크에 담긴 내용만 표시한다. */
function SharedReportView({ r }) {
  const statusMeta = [
    ['present', '출석', 'bg-green-100 text-green-700'],
    ['late', '지각', 'bg-yellow-100 text-yellow-700'],
    ['early', '조퇴', 'bg-gray-100 text-gray-600'],
    ['absent', '결석', 'bg-red-100 text-red-700'],
  ];
  return (
    <div className="max-w-xl mx-auto p-4">
      <div className="bg-white border border-gray-200 rounded-2xl p-6 mt-6 shadow-sm">
        <p className="text-xs font-semibold text-indigo-600 mb-1">{r.a}</p>
        <h1 className="text-lg font-bold text-gray-900 mb-0.5">{r.n} 학생 {r.m} 학습리포트</h1>
        <p className="text-xs text-gray-500 mb-4">{r.c}</p>

        <div className="grid grid-cols-2 gap-2 mb-4">
          <div className="bg-gray-50 rounded-lg p-3">
            <p className="text-xs text-gray-500 mb-1">출석률</p>
            <p className="text-lg font-semibold text-gray-900">{r.ar}</p>
          </div>
          <div className="bg-gray-50 rounded-lg p-3">
            <p className="text-xs text-gray-500 mb-1">숙제 제출률</p>
            <p className="text-lg font-semibold text-gray-900">{r.hr}</p>
          </div>
        </div>

        <p className="text-xs font-semibold text-gray-500 mb-1.5">출결 현황</p>
        <div className="flex gap-1.5 flex-wrap mb-4">
          {statusMeta.map(([key, label, cls]) => (
            <span key={key} className={`text-xs px-2.5 py-1 rounded-full ${cls}`}>{label} {(r.at && r.at[key]) || 0}회</span>
          ))}
        </div>

        {r.al && (
          <div className="mb-4 bg-red-50 border border-red-200 rounded-lg p-3">
            <p className="text-sm text-red-700 font-medium">⚠ {r.al}</p>
          </div>
        )}

        <p className="text-xs font-semibold text-gray-500 mb-1.5">단어/문법시험</p>
        <p className="text-sm text-gray-700 bg-gray-50 rounded-lg p-3 mb-4">{r.ts || '시험 없음'}</p>

        {r.sc && r.sc.length > 0 && (
          <div className="mb-4">
            <p className="text-xs font-semibold text-gray-500 mb-1.5">시험 점수</p>
            <div className="space-y-1">
              {r.sc.map((s, i) => (
                <div key={i} className="flex justify-between text-sm bg-gray-50 rounded-lg px-3 py-1.5">
                  <span className="text-gray-600">{s.d} · {s.l}</span>
                  <span className="font-semibold text-gray-900">{s.s}점</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {r.cm && (
          <div className="mb-4">
            <p className="text-xs font-semibold text-gray-500 mb-1.5">강사 코멘트</p>
            <p className="text-sm text-gray-700 bg-indigo-50 rounded-lg p-3 whitespace-pre-wrap">{r.cm}</p>
          </div>
        )}

        <p className="text-xs text-gray-400 pt-3 border-t border-gray-100">
          본 페이지는 {r.a}에서 발송한 열람 전용 리포트입니다. 궁금하신 점은 학원으로 문의해 주세요.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(SHARED_REPORT ? <SharedReportView r={SHARED_REPORT} /> : <App />);
</script>
</body>
