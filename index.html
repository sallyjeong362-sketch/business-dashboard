const GRADE_ORDER = ['초1','초2','초3','초4','초5','초6','중1','중2','중3','고1','고2','고3'];
const TAB_META = {

  directory:   { label: '학생 전체 인적사항', icon: '👤', pinned: true },
  schedule:    { label: '시간표', icon: '🗓️' },
  attendance:  { label: '출결', icon: '✅' },
  payment:     { label: '수납현황', icon: '💳' },
  manage:      { label: '반 관리', icon: '🏫' },
  report:      { label: '학습리포트', icon: '📊' },
  vocabtest:   { label: '단어/문법시험', icon: '📝' },
  metrics:     { label: '경영지표', icon: '📈' },
  notice:      { label: '공지사항', icon: '📢' },
  counseling:  { label: '상담관리', icon: '💬' },
  academySchedule: { label: '학원일정', icon: '📅' },
  worklog:     { label: '업무일지', icon: '🗒️' },
  news:        { label: '교육뉴스', icon: '📰' },
  admin:       { label: '관리자', icon: '⚙️' },
};
const DEFAULT_TAB_ORDER = ['home','directory','schedule','attendance','payment','metrics','manage','report','vocabtest','notice','counseling','academySchedule','worklog','news','admin'];

function normalizeTabOrder(order) {
  const seen = {};
  const result = [];
  (order || []).forEach(id => { if (TAB_META[id] && !seen[id]) { seen[id] = true; result.push(id); } });
  DEFAULT_TAB_ORDER.forEach(id => { if (!seen[id]) { seen[id] = true; result.push(id); } });
  const pinned = result.filter(id => TAB_META[id].pinned);
  const rest = result.filter(id => !TAB_META[id].pinned);
  // '홈'은 기존에 저장된 탭 순서에는 없을 수 있으므로(새로 추가된 탭), 고정 탭 중에서도
  // 항상 맨 앞에 오도록 보정한다.
  pinned.sort((a, b) => (a === 'home' ? -1 : b === 'home' ? 1 : 0));
  return pinned.concat(rest);
}

function nextGrade(grade) {
  const i = GRADE_ORDER.indexOf(grade);
  if (i === -1 || i === GRADE_ORDER.length - 1) return grade;
  return GRADE_ORDER[i + 1];
}

function currentYear() {
  return new Date().getFullYear();
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function daysAgoStr(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0,10);
}

    classes: [

        students: [{id:'s1',name:'이서준',grade:'중2'},{id:'s2',name:'최유나',grade:'중2'},{id:'s3',name:'정민수',grade:'중2'}] },

        students: [{id:'s4',name:'박하은',parentPhone:'010-1234-5678',grade:'고1'},{id:'s5',name:'김도윤',grade:'고1'}] },
      { id: 'c3', name: '고3 실전모의고사', teacher: '김선생', room: '301호', time: '19:00', endTime: '20:50', days: ['월','수','금'],
        students: [{id:'s6',name:'한지우',grade:'고3'},{id:'s7',name:'윤서연',grade:'고3'},{id:'s8',name:'조은우',grade:'고3'}] },

    counseling: [
      { id: 'k1', studentName: '박하은', parentName: '박하은 학부모', type: '정기상담', date: todayStr(), time: '18:00', content: '최근 성적 상승 관련 안내 및 다음 학기 목표 설정', nextAction: '2주 후 진도 재점검', status: '예정' },

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.records) parsed.records = {};
      if (!parsed.reports) parsed.reports = {};
      if (!parsed.announcements) parsed.announcements = [];
      if (parsed.newsProxyUrl === undefined) parsed.newsProxyUrl = '';
      if (!parsed.newsQuery) parsed.newsQuery = '수능 영어';
      if (parsed.alimtalkProxyUrl === undefined) parsed.alimtalkProxyUrl = '';
      if (!parsed.counseling) parsed.counseling = [];
      if (!parsed.lessonLogs) parsed.lessonLogs = {};
      if (!parsed.classHomework) parsed.classHomework = {};
      if (!parsed.classCancellations) parsed.classCancellations = {};
      if (!parsed.workLogs) parsed.workLogs = [];
      if (!parsed.vocabTests) parsed.vocabTests = [];
      parsed.vocabTests.forEach(v => {
        if (v.retest === true) v.retest = 'needed';
        else if (v.retest === false) v.retest = null;
      });
      if (!parsed.academyEvents) parsed.academyEvents = [];
      parsed.academyEvents.forEach(ev => {
        if (!ev.tasks) ev.tasks = [];
        if (!ev.startDate) ev.startDate = ev.date || todayStr();
        if (!ev.endDate) ev.endDate = ev.startDate;
        delete ev.date;
      });
      if (!parsed.planItems) parsed.planItems = [];
      if (parsed.paymentGatewayProxyUrl === undefined) parsed.paymentGatewayProxyUrl = '';
      if (parsed.autoPaymentReminderEnabled === undefined) parsed.autoPaymentReminderEnabled = false;
      if (parsed.autoPaymentReminderLastSent === undefined) parsed.autoPaymentReminderLastSent = '';
      parsed.tabOrder = normalizeTabOrder(parsed.tabOrder);
      if (!parsed.gradePromotionYear) parsed.gradePromotionYear = currentYear();
      // Migrate the old single-record-per-student payments map (no monthly reset) into
      // paymentsByMonth (tuition/status/paidDate, resets each month) + bookFees (one-time,
      // never resets). Existing data is preserved, not discarded: it becomes this month's record.
      if (parsed.payments && !parsed.paymentsByMonth) {
        const migratedMonthKey = todayStr().slice(0, 7);
        parsed.paymentsByMonth = { [migratedMonthKey]: {} };
        parsed.bookFees = {};
        Object.keys(parsed.payments).forEach(k => {
          const p = parsed.payments[k];
          parsed.paymentsByMonth[migratedMonthKey][k] = {
            tuition: p.tuition || 0,
            status: p.status || 'unpaid',
            paidDate: p.paidDate || null,
          };
          parsed.bookFees[k] = {
            bookFee: p.bookFee === undefined ? 0 : p.bookFee,
            bookFeeStatus: p.bookFeeStatus || 'unpaid',
          };
        });
        delete parsed.payments;
      }
      if (!parsed.paymentsByMonth) parsed.paymentsByMonth = {};
      // Migrate one-time bookFees (bookFee/bookFeeStatus per student) into the monthly
      // bookFeesByMonth model: the existing charge becomes this month's record, paid ones
      // keep today's paidDate so this month's 수납액 stays consistent.
      if (parsed.bookFees && !parsed.bookFeesByMonth) {
        const bfMonthKey = todayStr().slice(0, 7);
        parsed.bookFeesByMonth = { [bfMonthKey]: {} };
        Object.keys(parsed.bookFees).forEach(sid => {
          const b = parsed.bookFees[sid];
          if ((b.bookFee || 0) > 0) {
            parsed.bookFeesByMonth[bfMonthKey][sid] = {
              fee: b.bookFee,
              status: b.bookFeeStatus === 'paid' ? 'paid' : 'unpaid',
              paidDate: b.bookFeeStatus === 'paid' ? todayStr() : null,
            };
          }
        });
      }
      delete parsed.bookFees;
      if (!parsed.bookFeesByMonth) parsed.bookFeesByMonth = {};
      if (!parsed.expensesByMonth) parsed.expensesByMonth = {};
      if (!parsed.studentSnapshots) parsed.studentSnapshots = {};
      if (!parsed.teacherSalaries) parsed.teacherSalaries = {};
      if (!parsed.monthlyGoals) parsed.monthlyGoals = {};
      // Migrate single 주교재/부교재 string fields into the textbooks list (multiple
      // books per class, each with a category like 주교재/어휘/문법/독해).
      (parsed.classes || []).forEach(c => {
        if (!c.textbooks) {
          c.textbooks = [];
          if (c.mainTextbook) c.textbooks.push({ id: 'tb_m_' + c.id, category: '주교재', name: c.mainTextbook });
          if (c.subTextbook) c.textbooks.push({ id: 'tb_s_' + c.id, category: '부교재', name: c.subTextbook });
        }
        delete c.mainTextbook;
        delete c.subTextbook;
        // 결제일이 "5일"처럼 문자로 저장된 데이터가 있으면 정렬·자동알림·D-day
        // 비교가 전부 어긋나므로 항상 숫자(1~31) 또는 ''로 정규화한다.
        (c.students || []).forEach(s => {
          s.paymentDueDay = normalizeDueDay(s.paymentDueDay);
        });
      });
      return parsed;
    }
  } catch (e) {}
  return defaultData();
}

function csvCell(v) {
  let s = v === null || v === undefined ? '' : String(v);
  if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function stripHtml(str) {
  if (!str) return '';
  return str
    .replace(/<\/?b>/g, '')
    .replace(/&quot;/g, '"')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&#39;/g, "'");
}

function formatTimeRange(c) {
  return c.endTime ? `${c.time}~${c.endTime}` : c.time;
}

function classTimeForDay(c, day) {
  const o = c.daySchedule && c.daySchedule[day];
  return o ? { time: o.time, endTime: o.endTime } : { time: c.time, endTime: c.endTime };
}

function formatClassTimeForDay(c, day) {
  const t = classTimeForDay(c, day);
  return t.endTime ? `${t.time}~${t.endTime}` : t.time;
}

function hasVariedTimes(c) {
  if (!c.daySchedule) return false;
  return c.days.some(d => {
    const o = c.daySchedule[d];
    return o && (o.time !== c.time || o.endTime !== c.endTime);
  });
}

function classScheduleSummary(c) {
  if (!hasVariedTimes(c)) return `${formatTimeRange(c)} · ${c.days.join(',')}`;
  return c.days.map(d => `${d} ${formatClassTimeForDay(c, d)}`).join(', ');
}

function collectDaySchedulePrompt(days, baseTime, baseEndTime, existing) {
  const daySchedule = {};
  if (!days.length) return daySchedule;
  const setPerDay = confirm('요일마다 수업 시간이 다른가요? (아니오를 누르면 위에서 입력한 기본 시간이 모든 요일에 적용됩니다)');
  if (!setPerDay) return daySchedule;
  for (const d of days) {
    const current = (existing && existing[d]) || { time: baseTime, endTime: baseEndTime };
    const dTime = prompt(`${d}요일 시작 시간`, current.time) ?? current.time;
    const dEnd = prompt(`${d}요일 종료 시간`, current.endTime || '') ?? current.endTime;
    if (dTime !== baseTime || dEnd !== (baseEndTime || '')) {
      daySchedule[d] = { time: dTime, endTime: dEnd };
    }
  }
  return daySchedule;
}

function saveData(data) {
  // 경영지표의 월별 재원생 흐름(신규/퇴원)을 위해 이번 달 재원생(퇴소자 제외) 수를 기록해둔다.
  if (!data.studentSnapshots) data.studentSnapshots = {};
  data.studentSnapshots[todayStr().slice(0, 7)] =
    groupStudentsByName(allStudents(data).filter(s => isActiveStudent(s, todayStr()))).length;
  // 원격(다른 기기)에서 받아온 데이터를 반영하는 저장이면 시각을 새로 찍지 않는다
  // — 찍으면 두 기기가 서로 "내가 더 최신"이라며 계속 주고받는 루프가 생긴다.
  if (syncState.applyingRemote) {
    syncState.applyingRemote = false;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return;
  }
  // 내용이 그대로면 시각을 새로 찍지 않는다 — 페이지를 "열기만" 한 기기가
  // 최신으로 오인되어 다른 기기의 실제 수정을 덮어쓰는 것을 막는다.
  const prevRaw = localStorage.getItem(STORAGE_KEY);
  if (prevRaw) {
    try {
      const stripTs = obj => { const c = { ...obj }; delete c._updatedAt; return JSON.stringify(c); };
      if (stripTs(JSON.parse(prevRaw)) === stripTs(data)) return;
    } catch (e) {}
  }
  data._updatedAt = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  scheduleSyncPush();
}

/* ---- PC ↔ 모바일 실시간 동기화 ----
   원장님 소유의 GitHub "비공개 저장소"를 데이터 금고로 사용한다.
   저장할 때마다 저장소의 data.json에 올리고(푸시), 주기적으로 내려받아(풀)
   더 최신인 쪽을 따른다(마지막 저장 우선). 접속 토큰은 이 기기의 브라우저에만
   저장되며, 동기화되는 데이터에는 절대 포함되지 않는다. */
const SYNC_CONFIG_KEY = 'academy_sync_config_v1';
const syncState = { status: 'off', lastSyncAt: null, lastError: '', lastRemoteUpdatedAt: null, pushTimer: null, listeners: [], applyingRemote: false };

function getSyncConfig() {
  try {
    const cfg = JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY));
    return cfg && cfg.token && cfg.owner && cfg.repo ? cfg : null;
  } catch (e) { return null; }
}
function saveSyncConfig(cfg) {
  if (cfg) localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg));
  else localStorage.removeItem(SYNC_CONFIG_KEY);
}
function notifySyncListeners() {
  syncState.listeners.forEach(fn => { try { fn(); } catch (e) {} });
}

function b64EncodeUnicode(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUnicode(str) { return decodeURIComponent(escape(atob(String(str).replace(/\n/g, '')))); }

async function syncApiRequest(cfg, method, bodyObj) {
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json` + (method === 'GET' ? `?t=${Date.now()}` : '');
  const res = await fetch(url, {
    method,
    headers: {
      Authorization: 'Bearer ' + cfg.token,
      Accept: 'application/vnd.github+json',
    },
    body: bodyObj ? JSON.stringify(bodyObj) : undefined,
  });
  if (res.status === 404) {
    // GET의 404는 "아직 파일이 없음"(정상)일 수 있지만, PUT의 404는
    // 저장소를 못 찾거나 토큰에 그 저장소 접근 권한이 없는 것 → 반드시 오류로 알린다.
    if (method === 'GET') return { notFound: true };
    throw new Error('저장소를 찾을 수 없습니다. ① 저장소 이름 철자 ② 토큰 만들 때 Repository access에서 이 저장소를 선택했는지 확인해주세요.');
  }
  if (res.status === 401 || res.status === 403) throw new Error('토큰이 잘못되었거나 권한이 없습니다. 관리자 탭의 동기화 설정을 확인해주세요.');
  if (!res.ok) throw new Error('동기화 서버 응답 오류 (' + res.status + ')');
  return res.json();
}

async function syncPull(cfg) {
  const r = await syncApiRequest(cfg, 'GET');
  if (r.notFound) return { sha: null, envelope: null };
  let envelope = null;
  if (r.content) { try { envelope = JSON.parse(b64DecodeUnicode(r.content)); } catch (e) {} }
  if (!envelope && r.sha) {
    // 1MB가 넘는 파일은 GitHub이 content를 비워서 주므로 원문(raw)으로 다시 받는다
    try {
      const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json?t=${Date.now()}`, {
        headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github.raw+json' },
      });
      if (res.ok) envelope = JSON.parse(await res.text());
    } catch (e) {}
  }
  return { sha: r.sha, envelope };
}

async function syncPushNow() {
  const cfg = getSyncConfig();
  if (!cfg) return;
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  const localData = JSON.parse(raw);
  // 방금 원격에서 받아온 그대로면 다시 올릴 필요 없음
  if (localData._updatedAt && localData._updatedAt === syncState.lastRemoteUpdatedAt) return;
  // 동기화 이전부터 쓰던 데이터라 저장 시각이 없으면 지금 시각으로 찍고 올린다
  if (!localData._updatedAt) {
    localData._updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(localData));
  }
  syncState.status = 'syncing'; notifySyncListeners();
  const current = await syncPull(cfg);
  // 원격이 더 최신이면 덮어쓰지 않는다 (다음 풀에서 이 기기가 원격을 따라감)
  if (current.envelope && current.envelope.updatedAt && localData._updatedAt && current.envelope.updatedAt > localData._updatedAt) {
    syncState.status = 'ok'; notifySyncListeners();
    return;
  }
  const envelope = { updatedAt: localData._updatedAt || new Date().toISOString(), data: localData };
  await syncApiRequest(cfg, 'PUT', {
    message: 'dashboard sync ' + envelope.updatedAt,
    content: b64EncodeUnicode(JSON.stringify(envelope)),
    ...(current.sha ? { sha: current.sha } : {}),
  });
  syncState.lastRemoteUpdatedAt = envelope.updatedAt;
  syncState.status = 'ok';
  syncState.lastSyncAt = new Date();
  syncState.lastError = '';
  notifySyncListeners();
}

function scheduleSyncPush() {
  const cfg = getSyncConfig();
  if (!cfg) return;
  if (syncState.pushTimer) clearTimeout(syncState.pushTimer);
  syncState.pushTimer = setTimeout(() => {
    syncPushNow().catch(e => {
      syncState.status = 'error';
      syncState.lastError = e.message || '동기화에 실패했습니다.';
      notifySyncListeners();
    });
  }, 2000);
}

function getAttendanceEntry(data, date, classId, studentId) {
  const raw = data.attendance[date]?.[classId]?.[studentId];
  if (!raw) return null;
  if (typeof raw === 'string') return { status: raw, homework: false };
  return raw;
}

function normalizeHomework(entry) {
  if (!entry) return null;
  if (entry.homework === true) return 'done';
  // none: 그날 애초에 내준 숙제가 없었던 경우 — 이행률 계산에서는 완료와 동일하게 취급해
  // (숙제가 없었으니 못 해온 것으로 깎이지 않도록) 제출률에 불이익이 없게 한다.
  if (entry.homework === 'done' || entry.homework === 'missing' || entry.homework === 'unchecked' || entry.homework === 'none') return entry.homework;
  return null;
}

// 그 학생의 실제 출결 기록(수업이 있었던 날)만 날짜순으로 모아, 가장 최근 기록부터
// 거슬러 올라가며 statusKey(결석/지각)가 몇 번 연속으로 이어지는지 센다.
// 출석·조퇴 등 다른 상태가 한 번이라도 나오면 그 지점에서 연속이 끊긴다.
function attendanceStreak(data, classId, studentId, statusKey) {
  const dates = Object.keys(data.attendance || {})
    .filter(d => data.attendance[d]?.[classId]?.[studentId]?.status)
    .sort();
  let streak = 0;
  for (let i = dates.length - 1; i >= 0; i--) {
    if (data.attendance[dates[i]][classId][studentId].status === statusKey) streak++;
    else break;
  }
  return streak;
}

// 결석 2연속=주의, 3연속 이상=경고 / 지각도 동일 기준. 마지막 출결 기록의 상태 하나만
// 연속으로 이어질 수 있으므로 결석·지각 배지가 동시에 뜨는 일은 없다.
function attendanceStreakBadge(data, classId, studentId) {
  const absentStreak = attendanceStreak(data, classId, studentId, 'absent');
  if (absentStreak >= 3) return { label: `결석 ${absentStreak}회 연속 · 경고`, color: 'bg-red-100 text-red-700 border-red-300' };
  if (absentStreak >= 2) return { label: `결석 ${absentStreak}회 연속 · 주의`, color: 'bg-yellow-100 text-yellow-700 border-yellow-300' };
  const lateStreak = attendanceStreak(data, classId, studentId, 'late');
  if (lateStreak >= 3) return { label: `지각 ${lateStreak}회 연속 · 경고`, color: 'bg-red-100 text-red-700 border-red-300' };
  if (lateStreak >= 2) return { label: `지각 ${lateStreak}회 연속 · 주의`, color: 'bg-yellow-100 text-yellow-700 border-yellow-300' };
  return null;
}

// 같은 이름의 학생이 여러 반에 속해 있으면(entries) 그중 가장 심각한 배지를 대표로 보여준다.
function worstAttendanceStreakBadge(data, entries) {
  let best = null, bestScore = -1;
  (entries || []).forEach(e => {
    const b = attendanceStreakBadge(data, e.classId, e.id);
    if (!b) return;
    const score = (b.label.includes('경고') ? 100 : 10) + parseInt(b.label.match(/\d+/)[0], 10);
    if (score > bestScore) { bestScore = score; best = b; }
  });
  return best;
}

const HW_META = {
  done: { label: '완료', cls: 'bg-green-100 text-green-700' },
  missing: { label: '미완', cls: 'bg-red-100 text-red-700' },
  unchecked: { label: '미확인', cls: 'bg-gray-200 text-gray-600' },
  none: { label: '숙제 없음', cls: 'bg-blue-100 text-blue-700' },
};

// '미확인'은 결석이라 애초에 검사할 수 없었던 경우와, 출석은 했지만 아직 선생님이
// 검사를 안 한 경우를 둘 다 포함한다. 학부모에게는 둘이 전혀 다른 의미라 혼동을 막기
// 위해, 출결 상태(status)를 함께 보고 "미확인 (결석)" / "미확인 (출석)"로 구분해 보여준다.
function homeworkLabel(hw, status) {
  const meta = HW_META[hw] || HW_META.missing;
  if (hw !== 'unchecked' || !status) return meta.label;
  return meta.label + (status === 'absent' ? ' (결석)' : ' (출석)');
}

/* 데일리 리포트: 특정 날짜의 출결·수업 진도·숙제·시험 결과를 알림톡 변수로 구성.
   숙제 이행률은 그날 하루 기준(했으면 100%, 안 했으면 0%) — 위클리·먼슬리처럼
   기간을 누적하는 게 아니라 "오늘" 리포트이므로 그날의 결과만 반영한다. */
function buildDailyReportVars(data, student, dateStr) {
  const entry = getAttendanceEntry(data, dateStr, student.classId, student.id);
  const attendance = entry && entry.status && STATUS[entry.status] ? STATUS[entry.status].label : '기록 없음';
  const lesson = getLessonLog(data, dateStr, student.classId) || '기록 없음';
  const hw = normalizeHomework(entry);
  const assigned = getClassHomework(data, dateStr, student.classId);
  const hwParts = [hw ? '검사 ' + homeworkLabel(hw, entry && entry.status) : '검사 기록 없음'];
  if (assigned) hwParts.push('오늘 숙제: ' + assigned);
  const homework = hwParts.join(' · ');
  // 단어/문법시험 탭의 채점 기록과 연동: 시험 종류별로 통과 여부를 구분해 표시
  const testParts = VOCAB_TEST_TYPES.map(tt => {
    const v = (data.vocabTests || []).find(x => x.studentId === student.id && x.date === dateStr && x.testType === tt && x.result);
    if (!v) return null;
    const shortName = tt === '문법 복습시험' ? '문법시험' : tt;
    let part = `${shortName} ${(VOCAB_RESULT_META[v.result] || VOCAB_RESULT_META.fail).label}`;
    if (v.result !== 'absent' && v.result !== 'skipped' && v.wrongCount) part += ` (${v.wrongCount}개 틀림)`;
    if (v.retest === 'needed') part += ' · 재시험 필요';
    else if (v.retest === 'done') part += ' · 재시험 완료';
    return part;
  }).filter(Boolean);
  const test = testParts.length ? testParts.join(' / ') : '시험 없음';
  // 그날 하루의 숙제 이행 여부만 반영 (완료·숙제없음 = 100%, 미완·미확인 = 0%)
  const hwRate = hw ? ((hw === 'done' || hw === 'none') ? '100%' : '0%') : '기록 없음';
  const [, m, dd] = dateStr.split('-');
  const dateLabel = `${parseInt(m, 10)}월 ${parseInt(dd, 10)}일`;
  return { attendance, lesson, homework, test, hwRate, dateLabel };
}

function getLessonLog(data, date, classId) {
  return data.lessonLogs?.[date]?.[classId] || '';
}

function getClassHomework(data, date, classId) {
  return data.classHomework?.[date]?.[classId] || '';
}

function getClassCancellation(data, date, classId) {
  return data.classCancellations?.[date]?.[classId] || null;
}

function mdLabel(dateStr) {
  if (!dateStr) return '';
  const [, m, dd] = dateStr.split('-');
  return `${parseInt(m, 10)}월 ${parseInt(dd, 10)}일`;
}

// 결강되어 보강이 아직 필요한(완료되지 않은) 수업 목록을 날짜순으로 모은다.
// 결강 기록은 날짜별로 흩어져 있어 오늘 시간표만 봐서는 놓치기 쉬우므로,
// 시간표 탭 상단에 따로 모아 보여줘 보강이 잊히지 않게 트래킹한다.
function pendingMakeups(data) {
  const classById = {};
  data.classes.forEach(c => { classById[c.id] = c; });
  const list = [];
  Object.keys(data.classCancellations || {}).forEach(d => {
    Object.keys(data.classCancellations[d]).forEach(classId => {
      const entry = data.classCancellations[d][classId];
      if (entry.makeupNeeded && !entry.makeupDone) {
        list.push({ date: d, classId, className: classById[classId]?.name || '(삭제된 반)', ...entry });
      }
    });
  });
  return list.sort((a, b) => a.date.localeCompare(b.date));
}

// 출결 탭에서 반별로 기록한 "오늘 수업 내용(진도)"과 "오늘 내준 숙제"를 모아, 업무일지 탭에
// 선생님별 → 반별로 자동 표시하기 위한 데이터. 별도 저장 없이 lessonLogs/classHomework를 읽는다.
function lessonLogEntriesByTeacher(data) {
  const classById = {};
  data.classes.forEach(c => { classById[c.id] = c; });
  const dates = new Set([...Object.keys(data.lessonLogs || {}), ...Object.keys(data.classHomework || {})]);
  const entries = [];
  dates.forEach(date => {
    const lessonDay = data.lessonLogs?.[date] || {};
    const hwDay = data.classHomework?.[date] || {};
    const classIds = new Set([...Object.keys(lessonDay), ...Object.keys(hwDay)]);
    classIds.forEach(classId => {
      const lesson = lessonDay[classId] || '';
      const homework = hwDay[classId] || '';
      if (!lesson && !homework) return;
      const c = classById[classId];
      entries.push({
        date,
        classId,
        className: c ? c.name : '삭제된 반',
        teacher: (c && c.teacher) || '미지정',
        lesson,
        homework,
      });
    });
  });
  entries.sort((a, b) => b.date.localeCompare(a.date));
  const byTeacher = {};
  entries.forEach(e => {
    if (!byTeacher[e.teacher]) byTeacher[e.teacher] = {};
    if (!byTeacher[e.teacher][e.className]) byTeacher[e.teacher][e.className] = [];
    byTeacher[e.teacher][e.className].push(e);
  });
  return byTeacher;
}

function ReportBarRow({ label, count, total, color }) {

function buildReportSummaryText(data, rd, comment) {
  const att = rd.statusCounts, hw = rd.hwCounts;
  const attTotal = att.present + att.late + att.early + att.absent;
  const hwTotal = hw.done + hw.missing;
  const lines = [];
  lines.push(`[${data.academyName}] ${rd.student.name} 학습리포트 (${rd.startDate} ~ ${rd.endDate})`);
  if (attTotal) lines.push(`출결: 출석 ${att.present}회, 지각 ${att.late}회, 조퇴 ${att.early}회, 결석 ${att.absent}회` + (rd.attendanceRate !== null ? ` (출석률 ${rd.attendanceRate}%)` : ''));
  if (hwTotal) lines.push(`숙제: 완료 ${hw.done}회, 미완 ${hw.missing}회` + (rd.homeworkRate !== null ? ` (제출률 ${rd.homeworkRate}%)` : ''));
  if (rd.scores.length) lines.push('최근 시험: ' + rd.scores.map(sc => `${sc.label} ${sc.score}점`).join(', '));
  if (comment) lines.push('강사 코멘트: ' + comment);
  return lines.join('\n');
}

// 다운로드용 독립 리포트 파일: 열면 인쇄 대화상자가 자동으로 떠서 바로 PDF로 저장할 수 있다.
function buildReportStandaloneHTML(data, rd, comment) {
  const att = rd.statusCounts, hw = rd.hwCounts;
  const attTotal = att.present + att.late + att.early + att.absent;
  const hwTotal = hw.done + hw.missing;
  const escH = s => String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const barRow = (label, count, total, color) => {
    const pct = total ? Math.round((count / total) * 100) : 0;

  };
  const attRows = attTotal ? REPORT_STATUS_BARS.map(b => barRow(b.label, att[b.key], attTotal, b.color)).join('') : '<p style="color:#999;font-size:12px;">기간 내 출결 기록이 없습니다.</p>';
  const hwRows = hwTotal ? REPORT_HW_BARS.map(b => barRow(b.label, hw[b.key], hwTotal, b.color)).join('') : '<p style="color:#999;font-size:12px;">기간 내 숙제 기록이 없습니다.</p>';
  const details = rd.attendanceDetails.map(a => {

  return `<!doctype html><html lang="ko"><head><meta charset="utf-8" /><title>${escH(rd.student.name)} 학습리포트</title><style>*{-webkit-print-color-adjust:exact;print-color-adjust:exact;}body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#222;}h1{font-size:20px;}h2{font-size:14px;margin:18px 0 6px;color:#555;}ul{padding-left:18px;font-size:13px;}.meta{color:#777;font-size:13px;}.metric{display:inline-block;margin-right:18px;font-size:13px;color:#555;}.metric strong{font-size:18px;color:#222;}@media print{body{margin:8px auto;}}</style></head><body><h1>${escH(data.academyName)} · ${escH(rd.student.name)} 학습리포트</h1><p class="meta">${rd.startDate} ~ ${rd.endDate} · ${escH(rd.student.className)}${rd.student.parentPhone ? ' · 학부모 연락처: ' + escH(rd.student.parentPhone) : ''}</p><p><span class="metric">출석률 <strong>${rd.attendanceRate !== null ? rd.attendanceRate + '%' : '기록없음'}</strong></span><span class="metric">숙제 제출률 <strong>${rd.homeworkRate !== null ? rd.homeworkRate + '%' : '기록없음'}</strong></span><span class="metric">최근 점수 <strong>${rd.scores[0] ? rd.scores[0].score + '점' : '기록없음'}</strong></span></p><h2>출결 현황 (${attTotal}회 기록)</h2>${attRows}<h2>숙제 제출 (${hwTotal}회 기록)</h2>${hwRows}${details ? '<h2>출결 상세</h2><ul>' + details + '</ul>' : ''}${scoreRows ? '<h2>최근 시험 기록</h2><ul>' + scoreRows + '</ul>' : ''}${comment ? '<h2>담당 강사 코멘트</h2><p style="font-size:13px;">' + escH(comment) + '</p>' : ''}<scr` + `ipt>window.addEventListener("load",function(){window.print();});</scr` + `ipt></body></html>`;
}

// 선생님별 폴더 색상: Tailwind 팔레트를 순환 사용해 폴더/반 카드를 구분한다.
const LESSON_TONE_CYCLE = [
  { border: 'border-l-indigo-500', bg: 'bg-indigo-50/60', text: 'text-indigo-700' },
  { border: 'border-l-green-500', bg: 'bg-green-50/60', text: 'text-green-700' },
  { border: 'border-l-teal-500', bg: 'bg-teal-50/60', text: 'text-teal-700' },
  { border: 'border-l-amber-500', bg: 'bg-amber-50/60', text: 'text-amber-700' },

];

function sendAlimtalk(proxyUrl, to, templateCode, variables) {
  if (!proxyUrl) {
    return Promise.reject(new Error('알림톡 프록시 URL이 설정되지 않았습니다. 관리자 탭에서 먼저 설정해주세요.'));
  }
  return fetch(proxyUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to, templateCode, variables }),
  })
    .then(res => { if (!res.ok) throw new Error('요청 실패'); return res.json(); })
    .then(json => { if (!json.success) throw new Error(json.error || '발송에 실패했습니다.'); return json; });
}

function allStudents(data) {
  const map = {};
  data.classes.forEach(c => c.students.forEach(s => {
    map[s.id] = {
      ...s, className: c.name, classId: c.id, teacher: c.teacher, classArchived: !!c.archived,
      classSpecialBillingMonth: (c.special && c.specialStart) ? c.specialStart.slice(0, 7) : null,
    };
  }));
  return Object.values(map);
}

const STUDENT_SORT_OPTIONS = [
  { key: 'name_asc', label: '이름 오름차순' },
  { key: 'name_desc', label: '이름 내림차순' },
  { key: 'grade', label: '학년별' },
  { key: 'class', label: '학급별' },
  { key: 'teacher', label: '선생님별' },
];

function studentSortComparator(sortKey) {
  return (a, b) => {
    switch (sortKey) {
      case 'name_desc':
        return b.name.localeCompare(a.name, 'ko');
      case 'grade': {
        let ai = GRADE_ORDER.indexOf(a.grade); if (ai === -1) ai = 999;
        let bi = GRADE_ORDER.indexOf(b.grade); if (bi === -1) bi = 999;
        return ai - bi || a.name.localeCompare(b.name, 'ko');
      }
      case 'class':
        return (a.className || '').localeCompare(b.className || '', 'ko') || a.name.localeCompare(b.name, 'ko');
      case 'teacher':
        return (a.teacher || '').localeCompare(b.teacher || '', 'ko') || a.name.localeCompare(b.name, 'ko');
      case 'name_asc':
      default:
        return a.name.localeCompare(b.name, 'ko');
    }
  };
}

/* 퇴소 처리: 퇴소일자가 지난 학생은 출결·수납·시험 등 "진행 중" 명단에서
   자동 제외한다. 과거 기록(출결·납부·시험·리포트)은 모두 보존되고,
   인적사항에는 퇴소 배지와 함께 계속 표시된다. 퇴소일 당일까지는 재원으로 취급.
   반이 보관(삭제) 처리된 경우도 마찬가지로 오늘 기준 "진행 중" 명단에서는 빠지지만
   과거 기록·인적사항은 그대로 열람 가능하다. 홀딩(일시 중지) 처리된 학생도
   같은 방식으로 잠시 빠졌다가, 체크 해제하면 바로 다시 반영된다. */
function isActiveStudent(s, dateStr) {
  if (s.classArchived) return false;
  if (s.onHold) return false;
  return !s.withdrawDate || s.withdrawDate >= dateStr;
}
// 해당 월에 하루라도 재원했으면 그 달의 수납 대상에 포함
function isActiveInMonth(s, monthKey) {
  return !s.withdrawDate || s.withdrawDate >= monthKey + '-01';
}

// 수납현황 명단·미납 알림 대상·매출액: 이번 달(또는 미래 달)을 보는 중이면, 퇴소일이 그
// 달 안에(실제로 아직 지나지 않은 미래 날짜로 입력해도) 들어오는 순간 바로 그 달 명단·
// 매출액에서 빠진다 — 퇴소 처리하면서 "이 학생이 빠지면 매출이 얼마가 될지" 바로 확인할
// 수 있게 하기 위함. 지난 달 기록을 조회할 때는 그 달에 실제 재원했던 그대로 보여준다
// (기록 보존). 특강반(수강료를 운영 시작월에 한 번만 일괄로 받는 반)은 그 시작월에만
// 수납현황에 나타나고, 그 외의 달에는(반이 아직 운영 중이더라도) 매달 다시 청구되는 것처럼
// 보이지 않도록 제외한다.
function isActiveForPaymentView(s, monthKey) {
  if (s.classSpecialBillingMonth && monthKey !== s.classSpecialBillingMonth) return false;
  if (s.classArchived) return false;
  if (s.onHold) return false;
  if (monthKey >= currentMonthKey()) return !s.withdrawDate || s.withdrawDate > monthKey + '-31';
  return isActiveInMonth(s, monthKey);
}

// 반 정원: 재원생(퇴소생 제외)이 정원에 차면 마감, 퇴소생이 생기면 자동으로 풀린다.
function classCapacityInfo(c) {
  const active = c.students.filter(s => isActiveStudent(s, todayStr())).length;
  const capacity = parseInt(c.capacity, 10) || 0;
  return {
    active,
    capacity,
    full: capacity > 0 && active >= capacity,
    seats: capacity > 0 ? Math.max(0, capacity - active) : null,
  };
}

/* 기간 내 단어/문법시험 결과 요약 (위클리·먼슬리 리포트 알림톡용)
   예: "단어시험 합격 2회·불합격 1회 (재시험 필요 1건) / 문법시험 합격 2회" */
// 재시험 필요(retest === 'needed')로 남아있는(완료 처리 안 된) 항목들을 학생별로 묶는다.
// 퇴소생은 제외. 안내 발송 대상 판단과 화면 목록 표시에 함께 쓰인다.
// 학생 이름순으로 정렬해 반환한다 — 시험 날짜 순서로 두면, 한 학생의 여러 재시험 중 하나만
// 완료 처리했을 때 남은 시험의 날짜가 달라 그 학생 줄이 목록에서 위치를 옮겨 다녀
// 마치 사라진 것처럼 보이는 문제가 있었다. 이름순은 처리 여부와 무관하게 항상 같은 자리다.
function pendingRetests(data) {
  const studentById = {};
  allStudents(data).forEach(s => { if (isActiveStudent(s, todayStr())) studentById[s.id] = s; });
  const map = {};
  const order = [];
  data.vocabTests.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(v => {
    if (v.retest !== 'needed') return;
    const student = studentById[v.studentId];
    if (!student) return;
    if (!map[v.studentId]) { map[v.studentId] = { student, tests: [] }; order.push(v.studentId); }
    map[v.studentId].tests.push({
      id: v.id,
      testType: v.testType === '문법 복습시험' ? '문법시험' : v.testType,
      date: v.date,
      retestDate: v.retestDate || '',
    });
  });
  return order.map(sid => map[sid]).sort((a, b) => a.student.name.localeCompare(b.student.name, 'ko'));
}

function pendingTestsSummary(tests) {
  return tests.map(t => `${t.testType}(${mdLabel(t.date)}${t.retestDate ? ` → 재시험 ${mdLabel(t.retestDate)}` : ''})`).join(', ');
}

function tomorrowStr() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

// 재시험 안내 발송 대상: 재시험 예정일이 입력되어 있는 학생은 그 날짜가 언제든(임박했든,
// 아직 멀었든, 이미 지났든) 상관없이 모두 포함한다. 예정일이 지났는데도 여전히
// '재시험 필요'로 남아있으면(연락 없이 안 온 등) 완료 처리·삭제 전까지 계속 대상에 남는다.
function dueSoonRetests(data) {
  return pendingRetests(data)
    .map(p => ({
      student: p.student,
      tests: p.tests.filter(t => t.retestDate)
        .map(t => ({ ...t, overdue: t.retestDate < todayStr() })),
    }))
    .filter(p => p.tests.length > 0);
}

function buildPeriodTestSummary(data, studentId, startDate, endDate) {
  const stats = {};
  const order = [];
  (data.vocabTests || []).forEach(v => {
    if (v.studentId !== studentId || !v.result) return;
    if (v.date < startDate || v.date > endDate) return;
    const name = v.testType === '문법 복습시험' ? '문법시험' : v.testType;
    if (!stats[name]) { stats[name] = { pass: 0, fail: 0, absent: 0, skipped: 0, retest: 0 }; order.push(name); }
    if (v.result === 'pass') stats[name].pass++;
    else if (v.result === 'fail') stats[name].fail++;
    else if (v.result === 'absent') stats[name].absent++;
    else if (v.result === 'skipped') stats[name].skipped++;
    if (v.retest === 'needed') stats[name].retest++;
  });
  const parts = order.map(name => {
    const s = stats[name];
    const bits = [];
    if (s.pass) bits.push(`합격 ${s.pass}회`);
    if (s.fail) bits.push(`불합격 ${s.fail}회`);
    if (s.absent) bits.push(`결석 ${s.absent}회`);
    if (s.skipped) bits.push(`미응시 ${s.skipped}회`);
    let out = `${name} ${bits.join('·')}`;
    if (s.retest) out += ` (재시험 필요 ${s.retest}건)`;
    return out;
  });
  return parts.length ? parts.join(' / ') : '시험 없음';
}

/* 먼슬리 리포트: 한 달치 리포트 데이터를 계산하고, 그 내용을 담은
   열람 전용 링크(#r=인코딩)를 만든다. 학부모는 이 링크를 열면
   대시보드 데이터 없이도 월간 리포트를 볼 수 있다. */
function buildMonthlyReportInfo(data, student, monthKey) {
  const y = parseInt(monthKey.slice(0, 4), 10);
  const mo = parseInt(monthKey.slice(5, 7), 10);
  const start = monthKey + '-01';
  const lastDay = new Date(y, mo, 0).getDate();
  const end = `${monthKey}-${String(lastDay).padStart(2, '0')}`;
  const counts = { present: 0, late: 0, early: 0, absent: 0 };
  let attTotal = 0, presentish = 0, hwTotal = 0, hwDone = 0;
  for (let d = 1; d <= lastDay; d++) {
    const ds = `${monthKey}-${String(d).padStart(2, '0')}`;
    const entry = getAttendanceEntry(data, ds, student.classId, student.id);
    if (entry && entry.status) {
      attTotal++;
      if (counts[entry.status] !== undefined) counts[entry.status]++;
      if (entry.status === 'present' || entry.status === 'late') presentish++;
      const hw = normalizeHomework(entry);
      if (hw) { hwTotal++; if (hw === 'done' || hw === 'none') hwDone++; }
    }
  }
  const attendanceRate = attTotal ? Math.round((presentish / attTotal) * 100) + '%' : '기록 없음';
  const homeworkRate = hwTotal ? Math.round((hwDone / hwTotal) * 100) + '%' : '기록 없음';
  const testResults = buildPeriodTestSummary(data, student.id, start, end);
  const scores = ((data.records[student.id] && data.records[student.id].scores) || [])
    .filter(sc => sc.date >= start && sc.date <= end)
    .slice(-6)
    .map(sc => ({ d: sc.date, l: sc.label, s: sc.score }));
  const monthLabel = `${y}년 ${mo}월`;
  const streakBadge = attendanceStreakBadge(data, student.classId, student.id);
  const attendanceAlert = streakBadge ? streakBadge.label : '';
  const attendanceDetail = `출석 ${counts.present}회·지각 ${counts.late}회·조퇴 ${counts.early}회·결석 ${counts.absent}회`;
  const scoresText = scores.length
    ? scores.map(sc => `${parseInt(sc.d.slice(5, 7), 10)}/${parseInt(sc.d.slice(8, 10), 10)} ${sc.l} ${sc.s}점`).join(', ')
    : '기록 없음';
  const payload = {
    v: 1,
    a: data.academyName,
    n: student.name,
    c: student.className,
    m: monthLabel,
    at: counts,
    ar: attendanceRate,
    hr: homeworkRate,
    ts: testResults,
    sc: scores,
    al: attendanceAlert,
  };
  return { payload, monthLabel, attendanceRate, homeworkRate, testResults, counts, scores, attendanceAlert, attendanceDetail, scoresText };
}

function encodeSharedReport(payload) {
  const json = JSON.stringify(payload);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// 발송된 열람 링크(#r=...)를 해석 — 실패하면 null (일반 대시보드로 동작)
const SHARED_REPORT = (() => {
  try {
    if (window.location.hash && window.location.hash.indexOf('#r=') === 0) {
      let b64 = window.location.hash.slice(3).replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const parsed = JSON.parse(decodeURIComponent(escape(atob(b64))));
      if (parsed && parsed.v === 1 && parsed.n) return parsed;
    }
  } catch (e) {}
  return null;
})();

// 인적사항 탭용: 같은 이름의 학생(여러 반에 중복 등록)을 한 사람으로 묶는다.
// entries에는 반별 사본이 모두 들어가고, 대표 정보는 첫 사본에서 가져온다.
function groupStudentsByName(students) {
  const map = {};
  const list = [];
  students.forEach(s => {
    const key = (s.name || '').trim();
    if (!map[key]) {
      map[key] = { name: key, entries: [] };
      list.push(map[key]);
    }
    map[key].entries.push(s);
  });
  return list;
}

// 월별 등록/퇴소/재원생 추이: 같은 이름(=같은 학생)당 대표 정보 하나(첫 사본)로 판단한다.
// 등록·퇴소는 그 달에 등록일/퇴소일이 있는 학생 수, 재원생 수는 그 달 말일 기준 스냅샷.
function monthlyStudentStats(data) {
  const students = groupStudentsByName(allStudents(data)).map(g => g.entries[0]);
  const months = new Set();
  students.forEach(s => {
    if (s.enrollDate) months.add(s.enrollDate.slice(0, 7));
    if (s.withdrawDate) months.add(s.withdrawDate.slice(0, 7));
  });
  if (!months.size) return [];
  const sortedMonths = [...months].sort();
  let [y, m] = sortedMonths[0].split('-').map(Number);
  const todayMonth = todayStr().slice(0, 7);
  const lastMonth = sortedMonths[sortedMonths.length - 1] > todayMonth ? sortedMonths[sortedMonths.length - 1] : todayMonth;
  const [maxY, maxM] = lastMonth.split('-').map(Number);
  const all = [];
  while (y < maxY || (y === maxY && m <= maxM)) {
    all.push(`${y}-${String(m).padStart(2, '0')}`);
    m++; if (m > 12) { m = 1; y++; }
  }
  return all.map(monthKey => {
    const monthEnd = monthKey + '-31';
    const enrolled = students.filter(s => s.enrollDate && s.enrollDate.slice(0, 7) === monthKey).length;
    const withdrawn = students.filter(s => s.withdrawDate && s.withdrawDate.slice(0, 7) === monthKey).length;
    const active = students.filter(s => {
      const enrolledByThen = !s.enrollDate || s.enrollDate <= monthEnd;
      const notYetWithdrawn = !s.withdrawDate || s.withdrawDate > monthEnd;
      return enrolledByThen && notYetWithdrawn;
    }).length;
    return { monthKey, enrolled, withdrawn, active };
  });
}

// 결제일 값을 어떤 형태("5", "5일", 5, " 5 ")로 저장돼 있어도 숫자(1~31) 또는 ''로 통일
function normalizeDueDay(v) {
  if (v === null || v === undefined || v === '') return '';
  const n = parseInt(String(v).replace(/[^0-9]/g, ''), 10);
  return isNaN(n) || n < 1 || n > 31 ? '' : n;
}

const PAYMENT_SORT_OPTIONS = [
  { key: 'duedate_asc', label: '결제일(매월) 오름차순' },
  { key: 'duedate_desc', label: '결제일(매월) 내림차순' },
  { key: 'paiddate_asc', label: '납부일 오름차순' },
  { key: 'paiddate_desc', label: '납부일 내림차순' },
  { key: 'name_asc', label: '이름 오름차순' },
  { key: 'name_desc', label: '이름 내림차순' },
];

function paymentSortComparator(sortKey, payments) {
  return (a, b) => {
    if (sortKey === 'name_asc') return a.name.localeCompare(b.name, 'ko');
    if (sortKey === 'name_desc') return b.name.localeCompare(a.name, 'ko');
    if (sortKey === 'duedate_asc' || sortKey === 'duedate_desc') {
      const ra = normalizeDueDay(a.paymentDueDay) || 0, rb = normalizeDueDay(b.paymentDueDay) || 0;
      if (!ra && !rb) return a.name.localeCompare(b.name, 'ko');
      if (!ra) return 1;
      if (!rb) return -1;
      const cmp2 = ra - rb;
      if (cmp2 === 0) return a.name.localeCompare(b.name, 'ko');
      return sortKey === 'duedate_desc' ? -cmp2 : cmp2;
    }
    const da = (payments[a.id] || {}).paidDate || '';
    const db = (payments[b.id] || {}).paidDate || '';
    if (!da && !db) return a.name.localeCompare(b.name, 'ko');
    if (!da) return 1;
    if (!db) return -1;
    const cmp = da.localeCompare(db);
    return sortKey === 'paiddate_desc' ? -cmp : cmp;
  };
}

// 수납현황 데이터 모델: 수업료(tuition/status/paidDate)는 매월 리셋되어야 하는 반복 항목이라
// 월(YYYY-MM)별로 분리 저장하고(data.paymentsByMonth), 교재비(bookFee/bookFeeStatus)는 보통
// 1회성 구매라 월과 무관하게 학생별로 하나만 유지한다(data.bookFees).
function currentMonthKey() {
  return todayStr().slice(0, 7);
}

function monthKeyLabel(mk) {
  const [y, m] = mk.split('-').map(n => parseInt(n, 10));
  return `${y}년 ${m}월`;
}

function availableMonthKeys(data) {
  const keys = Object.keys(data.paymentsByMonth || {});
  const cur = currentMonthKey();
  if (!keys.includes(cur)) keys.push(cur);
  return keys.sort().reverse();
}

function mostRecentTuitionRecord(data, studentId, beforeMonthKey) {
  const keys = Object.keys(data.paymentsByMonth || {}).filter(k => k < beforeMonthKey).sort().reverse();
  for (const k of keys) {
    const rec = data.paymentsByMonth[k][studentId];
    if (rec) return rec;
  }
  return null;
}

// Read-only: never mutates `data`. If this student has no record yet for this month, returns a
// fresh unpaid default (carrying forward only the tuition amount, not paid status) — that's what
// makes each month start fresh without needing an explicit "reset" step.
function getTuitionRecord(data, studentId, monthKey) {
  const existing = data.paymentsByMonth && data.paymentsByMonth[monthKey] && data.paymentsByMonth[monthKey][studentId];
  if (existing) return existing;
  const carried = mostRecentTuitionRecord(data, studentId, monthKey);
  return { tuition: carried ? (carried.tuition || 0) : 0, status: 'unpaid', paidDate: null };
}

// monthKey까지(포함) 아직 납부되지 않은 수업료 이월 누적 내역. 매달 새로 청구되는 수업료라도
// 지난달분을 안 냈으면 그 미납은 사라지지 않고 완납할 때까지 계속 쌓여 보여야 한다.
function tuitionOutstanding(data, studentId, monthKey) {
  const byMonth = data.paymentsByMonth || {};
  const items = [];
  Object.keys(byMonth).sort().forEach(mk => {
    if (mk > monthKey) return;
    const r = byMonth[mk][studentId];
    if (r && (r.tuition || 0) > 0 && r.status !== 'paid') items.push({ monthKey: mk, tuition: r.tuition });
  });
  return { items, total: items.reduce((sum, it) => sum + it.tuition, 0) };
}

/* 교재비: 수업료처럼 월별 청구(bookFeesByMonth[YYYY-MM][studentId] = {fee, status, paidDate, payments}).
   payments는 [{date, amount}] 형태의 실제 납부 내역 목록 — 부분납이 여러 번에 걸쳐 이뤄져도
   각각 언제 얼마씩 냈는지 남는다. 완납한 교재비는 다음 달에 다시 나타나지 않고, 미납분·부분납의
   남은 금액은 완납할 때까지 다음 달로 이월 누적되어 "한 번에 결제" 대상으로 표시된다. */
function getBookFeeMonthRecord(data, studentId, monthKey) {
  return (data.bookFeesByMonth && data.bookFeesByMonth[monthKey] && data.bookFeesByMonth[monthKey][studentId]) || null;
}

function bookFeePaidAmount(r) {
  if (!r) return 0;
  const fromLog = (r.payments || []).reduce((sum, p) => sum + (p.amount || 0), 0);
  if (fromLog > 0) return fromLog;
  // 부분납 기능 도입 전 기록(납부 로그 없이 status만 있던 데이터) 호환: 완납이었다면 전액으로 간주
  if (r.status === 'paid') return r.fee || 0;
  return 0;
}

function bookFeeRemaining(r) {
  return Math.max(0, ((r && r.fee) || 0) - bookFeePaidAmount(r));
}

// monthKey까지(포함) 아직 다 납부되지 않은 교재비 이월 누적 내역 (부분납의 남은 금액 포함)
function bookFeeOutstanding(data, studentId, monthKey) {
  const byMonth = data.bookFeesByMonth || {};
  const items = [];
  Object.keys(byMonth).sort().forEach(mk => {
    if (mk > monthKey) return;
    const r = byMonth[mk][studentId];
    if (!r || (r.fee || 0) <= 0) return;
    const remaining = bookFeeRemaining(r);
    if (remaining > 0) items.push({ monthKey: mk, fee: r.fee, remaining, paidAmount: bookFeePaidAmount(r) });
  });
  return { items, total: items.reduce((sum, it) => sum + it.remaining, 0), hasPartial: items.some(it => it.paidAmount > 0) };
}

// 상태 칩 표시용: 보고 있는 달의 청구 + 이월된 미납·부분납만 (지난달 완납분은 숨김)
function bookFeeChips(data, studentId, monthKey) {
  const byMonth = data.bookFeesByMonth || {};
  const items = [];
  Object.keys(byMonth).sort().forEach(mk => {
    if (mk > monthKey) return;
    const r = byMonth[mk][studentId];
    if (!r || (r.fee || 0) <= 0) return;
    const remaining = bookFeeRemaining(r);
    if (mk === monthKey || remaining > 0) items.push({ monthKey: mk, fee: r.fee, status: r.status, remaining, paidAmount: bookFeePaidAmount(r) });
  });
  return items;
}

// Mutates the already-cloned `next` draft (the standard `setData(prev => { const next = ...; ... })`
// pattern already used throughout this file), auto-vivifying this month's record on first write.
function ensureTuitionRecord(next, studentId, monthKey) {
  if (!next.paymentsByMonth) next.paymentsByMonth = {};
  if (!next.paymentsByMonth[monthKey]) next.paymentsByMonth[monthKey] = {};
  if (!next.paymentsByMonth[monthKey][studentId]) {
    const carried = mostRecentTuitionRecord(next, studentId, monthKey);
    next.paymentsByMonth[monthKey][studentId] = { tuition: carried ? (carried.tuition || 0) : 0, status: 'unpaid', paidDate: null };
  }
  return next.paymentsByMonth[monthKey][studentId];
}

function ensureBookFeeMonthRecord(next, studentId, monthKey) {
  if (!next.bookFeesByMonth) next.bookFeesByMonth = {};
  if (!next.bookFeesByMonth[monthKey]) next.bookFeesByMonth[monthKey] = {};
  if (!next.bookFeesByMonth[monthKey][studentId]) {
    next.bookFeesByMonth[monthKey][studentId] = { fee: 0, status: 'unpaid', paidDate: null, payments: [] };
  }
  if (!next.bookFeesByMonth[monthKey][studentId].payments) next.bookFeesByMonth[monthKey][studentId].payments = [];
  return next.bookFeesByMonth[monthKey][studentId];
}

// 이미 클론된 next 초안을 그대로 변형한다(다른 곳과 같은 setData(prev => { const next = ...; ... })
// 패턴). amount만큼 납부 기록을 추가하고, 남은 금액에 따라 상태를 완납/부분납/미납으로 갱신한다.
function addBookFeePayment(next, studentId, monthKey, amount) {
  const r = ensureBookFeeMonthRecord(next, studentId, monthKey);
  if (amount > 0) r.payments.push({ date: todayStr(), amount });
  const paid = bookFeePaidAmount(r);
  if (paid <= 0) { r.status = 'unpaid'; r.paidDate = null; }
  else if (paid >= (r.fee || 0)) { r.status = 'paid'; r.paidDate = todayStr(); }
  else { r.status = 'partial'; r.paidDate = todayStr(); }
}

// 결제일이 31일처럼 그 달에 없는 날짜일 수 있다(30일까지만 있는 달, 28·29일까지만 있는
// 2월 등). 그런 달에는 그 달의 마지막 날을 결제일로 쳐서 판단한다.
function effectivePaymentDueDay(paymentDueDay, year, month1to12) {
  if (!paymentDueDay) return null;
  const lastDay = new Date(year, month1to12, 0).getDate();
  return Math.min(paymentDueDay, lastDay);
}

// Before this month's due date arrives, an unpaid record isn't "미납(연체)" yet — it's simply not
// due. Only the current month gets this leniency; a still-unpaid record from a past month is
// unambiguously overdue.
function isBeforeDueDateThisMonth(student, monthKey) {
  // 아직 오지 않은 달(다음 달, 그다음 달...)은 결제일 자체가 아직 도래할 수 없으므로
  // 학생마다 결제일이 설정되어 있는지와 무관하게 항상 "결제 예정"으로 본다.
  if (monthKey > currentMonthKey()) return true;
  if (monthKey !== currentMonthKey() || !student.paymentDueDay) return false;
  const todayDay = parseInt(todayStr().split('-')[2], 10);
  const y = parseInt(monthKey.slice(0, 4), 10), mo = parseInt(monthKey.slice(5, 7), 10);
  return todayDay < effectivePaymentDueDay(student.paymentDueDay, y, mo);
}

function paymentDisplayStatus(student, monthKey, record) {
  if (record.status !== 'unpaid') return PAYMENT_STATUS[record.status] || PAYMENT_STATUS.unpaid;
  if (isBeforeDueDateThisMonth(student, monthKey)) return { label: '결제 예정', color: 'bg-gray-100 text-gray-500 border-gray-300' };
  return PAYMENT_STATUS.unpaid;
}

function computePaymentSummary(data, monthKey) {
  const students = allStudents(data).filter(s => isActiveForPaymentView(s, monthKey));
  let paidCount = 0, totalDue = 0, totalCollected = 0;
  students.forEach(s => {
    const t = getTuitionRecord(data, s.id, monthKey);
    totalDue += t.tuition || 0;
    if (t.status === 'paid') { paidCount++; totalCollected += t.tuition || 0; }
  });
  // 교재비 수납액: 실제로 그 달에 들어온 납부 금액 — 부분납이어도 낸 만큼, 낸 달에 잡힌다
  // (이월분을 다음 달에 나눠 내면 각각 낸 달에 반영됨)
  let bookFeeCollected = 0;
  const byMonth = data.bookFeesByMonth || {};
  Object.keys(byMonth).forEach(mk => {
    Object.keys(byMonth[mk]).forEach(sid => {
      const r = byMonth[mk][sid];
      if (r.payments && r.payments.length) {
        r.payments.forEach(p => { if ((p.date || '').startsWith(monthKey)) bookFeeCollected += p.amount || 0; });
      } else if (r.status === 'paid' && (r.paidDate || '').startsWith(monthKey)) {
        // 부분납 기능 도입 전 기록(납부 로그 없음) 호환
        bookFeeCollected += r.fee || 0;
      }
    });
  });
  const rate = students.length ? Math.round((paidCount / students.length) * 100) : 0;
  return { paidCount, total: students.length, rate, totalDue, totalCollected, bookFeeCollected };
}

function shiftMonth(monthKey, delta) {
  const year = parseInt(monthKey.slice(0, 4), 10);
  const month = parseInt(monthKey.slice(5, 7), 10) - 1;
  const d = new Date(year, month + delta, 1);
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  return `${y}-${String(m).padStart(2, '0')}`;
}

/* ---- 경영지표 (metrics) ----
   매출·수납은 수납현황 데이터에서, 재원생 흐름은 등록일과 월별 스냅샷에서,
   비용(인건비·임대료·기타)은 이 탭에서 월별로 입력받아 계산한다. */
const METRICS_COST_FIELDS = [
  { key: 'labor', label: '인건비' },
  { key: 'rent', label: '임대료' },
  { key: 'other', label: '기타 비용 (교재 매입·관리비 등)' },
];

// 인건비·임대료는 매달 그대로인 경우가 많아, 그 달에 직접 입력하지 않았으면 가장 최근에
// 입력했던 달의 값을 그대로 이어서 보여준다(수업료 이월과 같은 방식). 특정 달만 다르게
// 바뀌었으면(급여 인상 등) 그 달에 새로 입력하면 되고, 그 이후부터는 그 값이 이어진다.
// 기타 비용은 매달 달라지는 경우가 많아 이어받지 않고 그 달의 값만 쓴다.
function mostRecentExpenseValue(data, beforeMonthKey, key) {
  const byMonth = data.expensesByMonth || {};
  const keys = Object.keys(byMonth).filter(k => k < beforeMonthKey && byMonth[k][key] !== undefined).sort().reverse();
  return keys.length ? byMonth[keys[0]][key] : 0;
}

function getExpenses(data, monthKey) {
  const e = (data.expensesByMonth || {})[monthKey] || {};
  const labor = e.labor !== undefined ? e.labor : mostRecentExpenseValue(data, monthKey, 'labor');
  const rent = e.rent !== undefined ? e.rent : mostRecentExpenseValue(data, monthKey, 'rent');
  return { labor, rent, other: e.other || 0 };
}

// 이달의 목표 (재원생·매출액 숫자 목표 + 커스텀 목표 + 고객에게 듣고 싶은 말) — 계속 눈에
// 보이게 게시해두고 확언하기 위한 용도라, 계산에는 쓰이지 않는다.
function getMonthlyGoals(data, monthKey) {
  const g = (data.monthlyGoals || {})[monthKey];
  return {
    targetStudents: g?.targetStudents ?? '',
    targetRevenue: g?.targetRevenue ?? '',
    customGoals: g?.customGoals || [],
    customerLanguage: g?.customerLanguage ?? '',
  };
}

function monthAttendanceRate(data, monthKey) {
  let total = 0, attended = 0;
  Object.keys(data.attendance).forEach(d => {
    if (!d.startsWith(monthKey)) return;
    const byClass = data.attendance[d];
    Object.keys(byClass).forEach(cid => {
      Object.keys(byClass[cid]).forEach(sid => {
        const entry = getAttendanceEntry(data, d, cid, sid);
        if (entry && entry.status) {
          total++;
          if (entry.status === 'present' || entry.status === 'late') attended++;
        }
      });
    });
  });
  return total ? Math.round((attended / total) * 100) : null;
}

function computeMetrics(data, monthKey) {
  const pay = computePaymentSummary(data, monthKey);
  const exp = getExpenses(data, monthKey);
  const totalCost = exp.labor + exp.rent + exp.other;
  const revenue = pay.totalDue; // 청구 기준 월 매출 (수업료)
  const groups = groupStudentsByName(allStudents(data));
  const isCurrent = monthKey === todayStr().slice(0, 7);
  const snapshots = data.studentSnapshots || {};
  // 재원생: 퇴소일자가 지나지 않은 학생만 (사람 기준)
  const activeGroups = groups.filter(g => g.entries.some(e => isActiveStudent(e, todayStr())));
  const currentCount = isCurrent ? activeGroups.length : (snapshots[monthKey] !== undefined ? snapshots[monthKey] : null);
  // 신규 등록: 등록일자가 해당 월인 학생 (사람 기준)
  let newCount = 0;
  groups.forEach(g => {
    if (g.entries.some(e => (e.enrollDate || '').startsWith(monthKey))) newCount++;
  });
  // 퇴원: 퇴소일자가 해당 월인 학생 수 (사람 기준, 정확 집계).
  // 퇴소일자 기록이 없던 시기는 월별 스냅샷 기반 추정을 유지한다.
  let churn = 0;
  groups.forEach(g => {
    if (g.entries.length && g.entries.every(e => e.withdrawDate) && g.entries.some(e => (e.withdrawDate || '').startsWith(monthKey))) churn++;
  });
  const prevCount = snapshots[shiftMonth(monthKey, -1)];
  let churnRate = null;
  if (churn === 0 && prevCount !== undefined && currentCount !== null) {
    churn = Math.max(0, prevCount + newCount - currentCount);
  }
  if (prevCount) churnRate = Math.round((churn / prevCount) * 100);
  // 상담 → 등록 전환: "입학상담을 했던 바로 그 학생"이 실제로 반에 등록된 경우만 집계
  // (상담 기록의 학생 이름과 등록된 학생 이름이 같고, 등록일이 상담일 이후인 경우)
  const admissionList = (data.counseling || []).filter(k => k.type === '입학상담' && (k.date || '').startsWith(monthKey));
  const admissionConsults = admissionList.length;
  const groupByName = {};
  groups.forEach(g => { groupByName[g.name] = g; });
  let convertedCount = 0;
  admissionList.forEach(k => {
    const g = groupByName[(k.studentName || '').trim()];
    if (!g) return;
    const enrolled = g.entries.some(e => !e.enrollDate || e.enrollDate >= (k.date || ''));
    if (enrolled) convertedCount++;
  });
  const conversionRate = admissionConsults ? Math.round((convertedCount / admissionConsults) * 100) : null;
  // 비용을 입력하지 않은 항목은 0%로 오해되지 않도록 null(입력 필요)로 처리
  const laborRate = revenue && exp.labor ? Math.round((exp.labor / revenue) * 100) : null;
  const rentRate = revenue && exp.rent ? Math.round((exp.rent / revenue) * 100) : null;
  const profit = revenue - totalCost;
  const profitRate = revenue && totalCost ? Math.round((profit / revenue) * 100) : null;
  // 매출(revenue)과 같은 모수(pay.total, 청구 대상 학생 수)로 나눠야 "고정 매출액 대비 인원수"가
  // 되어 값이 안정적이다. 재원생 카운트(currentCount)는 그룹핑·집계 방식이 달라(이름 기준 중복
  // 제거, 특강반 청구월 제외 여부 등) revenue의 모수와 어긋날 수 있어 쓰지 않는다.
  const arpu = pay.total ? Math.round(revenue / pay.total) : null;
  return {
    pay, exp, totalCost, revenue, currentCount, newCount, churn, churnRate,
    admissionConsults, convertedCount, conversionRate, laborRate, rentRate, profit, profitRate, arpu,
    attendanceRate: monthAttendanceRate(data, monthKey),
  };
}

// 비율 지표의 상태 판정 (학원업계 통상 기준, 참고용)
function metricStatus(kind, value) {
  if (value === null) return null;
  if (kind === 'labor') {
    if (value <= 40) return { label: '적정', tone: 'good' };
    if (value <= 50) return { label: '주의', tone: 'warn' };
    return { label: '높음', tone: 'bad' };
  }
  if (kind === 'rent') {
    if (value <= 15) return { label: '적정', tone: 'good' };
    if (value <= 25) return { label: '주의', tone: 'warn' };
    return { label: '높음', tone: 'bad' };
  }
  if (kind === 'profit') {
    if (value >= 20) return { label: '양호', tone: 'good' };
    if (value >= 5) return { label: '보통', tone: 'warn' };
    return { label: '낮음', tone: 'bad' };
  }
  return null;
}

function metricsTrendMonths(monthKey, n) {

/* 선생님별 수익성: 담당 반들의 학생 수·수업료 매출을 집계하고,
   입력된 월급 기준으로 인건비율과 "적정선(40%)까지 필요한 추가 원생 수"를 계산 */
const TEACHER_LABOR_TARGET = 40; // 매출 대비 인건비 적정 상한(%)

function computeTeacherMetrics(data, monthKey) {
  const byTeacher = {};
  const order = [];
  data.classes.filter(c => !c.archived).forEach(c => {
    const t = (c.teacher || '').trim() || '담당 미지정';
    if (!byTeacher[t]) {
      byTeacher[t] = { teacher: t, classNames: [], studentCount: 0, revenue: 0 };
      order.push(t);
    }
    byTeacher[t].classNames.push(c.name);
    // 이번 달(또는 미래 달)을 보는 중이면 "지금 재원 중인지"로 판단해 이미 퇴소한 학생은
    // 바로 매출·인원에서 빠지고(수납현황과 동일한 기준), 지난 달을 조회할 때는 그 달에
    // 실제 재원했던 그대로 보여준다.
    const activeStudents = c.students.filter(s => isActiveForPaymentView(s, monthKey));
    byTeacher[t].studentCount += activeStudents.length;
    // 특강반은 운영 시작월에만 매출로 집계 (수강료를 그 달에 한 번만 받으므로, 매달 반복 청구되는
    // 것처럼 잡히지 않게 함)
    const billingMonth = (c.special && c.specialStart) ? c.specialStart.slice(0, 7) : null;
    if (!billingMonth || billingMonth === monthKey) {
      activeStudents.forEach(s => {
        byTeacher[t].revenue += getTuitionRecord(data, s.id, monthKey).tuition || 0;
      });
    }
  });
  return order.map(name => {
    const row = byTeacher[name];
    const salary = (data.teacherSalaries || {})[name] || 0;
    const laborRate = row.revenue && salary ? Math.round((salary / row.revenue) * 100) : null;
    const avgTuition = row.studentCount && row.revenue ? row.revenue / row.studentCount : 0;
    // 인건비율을 적정선까지 낮추려면 매출이 salary/0.4 이상이어야 함 → 부족분을 평균 수강료로 환산
    let neededStudents = null;
    if (laborRate !== null && avgTuition > 0) {
      neededStudents = laborRate <= TEACHER_LABOR_TARGET
        ? 0
        : Math.ceil((salary / (TEACHER_LABOR_TARGET / 100) - row.revenue) / avgTuition);
    }
    return { ...row, salary, laborRate, avgTuition, neededStudents };
  });
}

// 반별 매출액(청구 기준, 수납 여부 무관): 선생님별 매출과 같은 로직을 반 단위로 계산.
// 보관된 반은 더 이상 운영 중이 아니므로 제외한다.
function computeClassMetrics(data, monthKey) {
  return data.classes.filter(c => !c.archived).map(c => {
    const activeStudents = c.students.filter(s => isActiveForPaymentView(s, monthKey));
    const billingMonth = (c.special && c.specialStart) ? c.specialStart.slice(0, 7) : null;
    let revenue = 0;
    if (!billingMonth || billingMonth === monthKey) {
      activeStudents.forEach(s => { revenue += getTuitionRecord(data, s.id, monthKey).tuition || 0; });
    }
    return { classId: c.id, className: c.name, teacher: (c.teacher || '').trim() || '담당 미지정', studentCount: activeStudents.length, revenue };
  }).sort((a, b) => b.revenue - a.revenue);
}

function unpaidPhoneList(data) {

  const monthKey = currentMonthKey();
  allStudents(data).filter(s => isActiveInMonth(s, monthKey)).forEach(s => {

    // Only count as unpaid/overdue once this month's due date has actually arrived — before

    if ((t.status === 'unpaid' || t.status === 'overdue') && !isBeforeDueDateThisMonth(s, monthKey) && s.parentPhone && !phones.includes(s.parentPhone)) {
      phones.push(s.parentPhone);

}

function eventTaskDueDate(ev, task) {
  const d = new Date(ev.startDate + 'T00:00:00');
  d.setDate(d.getDate() - (task.offsetDays || 0));
  return d.toISOString().slice(0, 10);
}

function eventOverlapsMonth(ev, monthKey) {
  const monthStart = `${monthKey}-01`;
  const lastDay = new Date(parseInt(monthKey.slice(0, 4), 10), parseInt(monthKey.slice(5, 7), 10), 0).getDate();
  const monthEnd = `${monthKey}-${String(lastDay).padStart(2, '0')}`;
  return ev.startDate <= monthEnd && ev.endDate >= monthStart;
}

function eventDateRangeLabel(ev) {
  const startWd = DAYS[new Date(ev.startDate + 'T00:00:00').getDay()];
  if (ev.startDate === ev.endDate) return `${ev.startDate} (${startWd})`;
  const endWd = DAYS[new Date(ev.endDate + 'T00:00:00').getDay()];
  return `${ev.startDate} (${startWd}) ~ ${ev.endDate} (${endWd})`;
}

function monthPlanItems(data, monthKey) {
  const items = [];
  data.planItems.forEach(p => {
    if (p.dueDate && p.dueDate.slice(0, 7) === monthKey) {
      items.push({ kind: 'plain', id: p.id, title: p.title, dueDate: p.dueDate, done: p.done });
    }
  });
  data.academyEvents.forEach(ev => {
    ev.tasks.forEach(t => {
      const due = eventTaskDueDate(ev, t);
      if (due.slice(0, 7) === monthKey) {
        items.push({ kind: 'event', id: t.id, eventId: ev.id, title: t.title, dueDate: due, done: t.done, eventTitle: ev.title, offsetDays: t.offsetDays });
      }
    });
  });
  items.sort((a, b) => a.dueDate.localeCompare(b.dueDate) || (a.done === b.done ? 0 : a.done ? 1 : -1));
  return items;
}

function scheduleShareContent(data, monthKey) {
  const events = data.academyEvents
    .filter(ev => eventOverlapsMonth(ev, monthKey))
    .slice().sort((a, b) => a.startDate.localeCompare(b.startDate));
  if (!events.length) return '';
  const month = parseInt(monthKey.slice(5, 7), 10);
  const lines = [`[${month}월 학원 일정]`];
  events.forEach(ev => {
    const startWd = DAYS[new Date(ev.startDate + 'T00:00:00').getDay()];
    const startLabel = `${parseInt(ev.startDate.slice(5, 7), 10)}/${ev.startDate.slice(8, 10)}(${startWd})`;
    let dateLabel;
    if (ev.startDate === ev.endDate) {
      dateLabel = startLabel;
    } else {
      const endWd = DAYS[new Date(ev.endDate + 'T00:00:00').getDay()];
      const endLabel = `${parseInt(ev.endDate.slice(5, 7), 10)}/${ev.endDate.slice(8, 10)}(${endWd})`;
      dateLabel = `${startLabel} ~ ${endLabel}`;
    }
    lines.push(`${dateLabel} ${ev.title}${ev.memo ? ' - ' + ev.memo : ''}`);
  });
  return lines.join('\n');
}

function dDayInfo(ev, todayDateStr) {
  if (todayDateStr >= ev.startDate && todayDateStr <= ev.endDate) {
    return { label: '진행중', color: 'bg-green-100 text-green-700' };
  }
  const diff = Math.round((new Date(ev.startDate + 'T00:00:00') - new Date(todayDateStr + 'T00:00:00')) / 86400000);
  if (diff < 0) return { label: '종료', color: 'bg-gray-100 text-gray-500' };
  const label = diff === 0 ? 'D-DAY' : `D-${diff}`;
  const color = diff <= 3 ? 'bg-red-100 text-red-700'
    : diff <= 7 ? 'bg-yellow-50 text-yellow-700'
    : 'bg-indigo-50 text-indigo-700';
  return { label, color };
}

      const cls = next.classes.find(c => c.id === classId);
      if (!cls) return prev;
      if (!cls.textbooks) cls.textbooks = [];
      cls.textbooks.push({ id: 'tb' + Date.now() + Math.floor(Math.random() * 1000), category, name });
      return next;

    setAddTextbookOpenFor(null);
  }

  function saveTextbookEntry(classId, entryId, category, name) {
    if (!name) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const cls = next.classes.find(c => c.id === classId);
      const tb = cls && (cls.textbooks || []).find(t => t.id === entryId);
      if (!tb) return prev;
      tb.category = category;
      tb.name = name;
      return next;

  function deleteTextbookEntry(classId, entryId) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const cls = next.classes.find(c => c.id === classId);

  // 교재 사진은 localStorage 용량(약 5MB)을 아끼기 위해 캔버스로 최대 900px, JPEG 75%로
  // 줄여서 저장한다. 저장 공간이 부족하면 방금 추가한 사진을 되돌리고 안내를 표시한다.
  function addTextbookPhoto(classId, file) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 900;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        setTextbookPhotoErrorFor(null);
        setData(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          const cls = next.classes.find(c => c.id === classId);
          if (!cls) return prev;
          if (!cls.textbookPhotos) cls.textbookPhotos = [];
          cls.textbookPhotos.push({ id: 'tp' + Date.now() + Math.floor(Math.random() * 1000), dataUrl });
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          } catch (e) {
            setTextbookPhotoErrorFor(classId);
            return prev;
          }
          return next;
        });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function deleteTextbookPhoto(classId, photoId) {
    setTextbookPhotoErrorFor(null);
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const cls = next.classes.find(c => c.id === classId);
      if (cls && cls.textbookPhotos) cls.textbookPhotos = cls.textbookPhotos.filter(p => p.id !== photoId);
      return next;
    });
  }

  // 날짜/반을 바꿔 저장하면 기록이 원래 자리에서 삭제되고 새 날짜·반으로 이동한다.
  // 이동한 자리에 이미 기록이 있으면 덮어쓰지 않고 줄바꿈으로 이어붙여 데이터 유실을 막는다.
  function saveLessonLogEntry(oldDate, oldClassId, newDate, newClassId, lesson, homework) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const moved = newDate !== oldDate || newClassId !== oldClassId;
      if (moved) {
        if (next.lessonLogs[oldDate]) delete next.lessonLogs[oldDate][oldClassId];
        if (next.classHomework[oldDate]) delete next.classHomework[oldDate][oldClassId];
      }
      if (!next.lessonLogs[newDate]) next.lessonLogs[newDate] = {};
      if (!next.classHomework[newDate]) next.classHomework[newDate] = {};
      const existingLesson = moved ? (next.lessonLogs[newDate][newClassId] || '') : '';
      const existingHw = moved ? (next.classHomework[newDate][newClassId] || '') : '';
      const mergedLesson = existingLesson && lesson ? existingLesson + '\n' + lesson : (lesson || existingLesson);
      const mergedHw = existingHw && homework ? existingHw + '\n' + homework : (homework || existingHw);
      if (mergedLesson) next.lessonLogs[newDate][newClassId] = mergedLesson;
      else delete next.lessonLogs[newDate][newClassId];
      if (mergedHw) next.classHomework[newDate][newClassId] = mergedHw;
      else delete next.classHomework[newDate][newClassId];
      return next;
    });
    setEditLessonLogFor(null);
  }

  useEffect(() => { saveData(data); }, [data]);

  // 특강반은 운영 종료일이 지나면 손대지 않아도 자동으로 보관 처리되어 재원생 수·시간표·
  // 수납현황에서 빠진다 (기록은 반 관리의 "보관된 반"에서 계속 열람 가능).
  useEffect(() => {

    if (!expired) return;
    setData(prev => ({
      ...prev,

        ? { ...c, archived: true, archivedAt: today }

  /* ---- 실시간 동기화 (PC ↔ 모바일) ---- */
  const [syncTick, setSyncTick] = useState(0); // 상태 표시 갱신용
  const [syncCfgVer, setSyncCfgVer] = useState(0); // 설정 저장/해제 시 재시작용
  useEffect(() => {
    const fn = () => setSyncTick(t => t + 1);
    syncState.listeners.push(fn);
    return () => { syncState.listeners = syncState.listeners.filter(x => x !== fn); };
  }, []);

  async function applyRemoteIfNewer() {
    const cfg = getSyncConfig();
    if (!cfg) return;
    try {
      syncState.status = 'syncing'; notifySyncListeners();
      const r = await syncPull(cfg);
      if (r.envelope && r.envelope.data) {
        const remoteAt = r.envelope.updatedAt || '';
        const localRaw = localStorage.getItem(STORAGE_KEY);
        let localAt = '';
        try { localAt = localRaw ? (JSON.parse(localRaw)._updatedAt || '') : ''; } catch (e) {}
        syncState.lastRemoteUpdatedAt = remoteAt;
        if (remoteAt && remoteAt > localAt) {
          r.envelope.data._updatedAt = remoteAt;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(r.envelope.data));
          syncState.applyingRemote = true;
          setData(loadData());
        }
      }
      syncState.status = 'ok'; syncState.lastSyncAt = new Date(); syncState.lastError = '';
    } catch (e) {
      syncState.status = 'error'; syncState.lastError = e.message || '동기화에 실패했습니다.';
    }
    notifySyncListeners();
  }

  useEffect(() => {
    if (!getSyncConfig()) { syncState.status = 'off'; notifySyncListeners(); return; }
    applyRemoteIfNewer();
    const iv = setInterval(applyRemoteIfNewer, 30000);
    return () => clearInterval(iv);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [syncCfgVer]);

  const savedSyncCfg = getSyncConfig();
  const [syncOwner, setSyncOwner] = useState(savedSyncCfg ? savedSyncCfg.owner : (window.location.hostname.endsWith('.github.io') ? window.location.hostname.split('.')[0] : ''));
  const [syncRepo, setSyncRepo] = useState(savedSyncCfg ? savedSyncCfg.repo : 'academy-data');
  const [syncToken, setSyncToken] = useState(savedSyncCfg ? savedSyncCfg.token : '');
  async function connectSync() {
    if (!syncOwner.trim() || !syncRepo.trim() || !syncToken.trim()) return;
    const cfg = { owner: syncOwner.trim(), repo: syncRepo.trim(), token: syncToken.trim() };
    saveSyncConfig(cfg);
    try {
      syncState.status = 'syncing'; notifySyncListeners();
      const r = await syncPull(cfg);
      if (r.envelope && r.envelope.data) {
        // 저장소에 이미 데이터가 있으면 어느 쪽을 쓸지 반드시 묻는다
        // — 두 번째 기기의 예시 데이터가 진짜 데이터를 덮어쓰는 사고 방지.
        const useRemote = confirm(
          '저장소에 이미 저장된 데이터가 있습니다.\n\n' +
          '[확인] 저장소의 데이터를 이 기기로 가져오기 — 두 번째 기기(휴대폰 등)를 연결할 때는 이걸 선택하세요\n' +
          '[취소] 이 기기의 데이터를 저장소에 덮어쓰기 — 저장소 데이터가 필요 없을 때만'
        );
        if (useRemote) {
          r.envelope.data._updatedAt = r.envelope.updatedAt;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(r.envelope.data));
          syncState.lastRemoteUpdatedAt = r.envelope.updatedAt;
          syncState.applyingRemote = true;
          setData(loadData());
        } else {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const local = JSON.parse(raw);
            local._updatedAt = new Date().toISOString();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(local));
          }
          scheduleSyncPush();
        }
      } else {
        scheduleSyncPush(); // 저장소가 비어있으면 현재 데이터를 첫 업로드
      }
      syncState.status = 'ok'; syncState.lastSyncAt = new Date(); syncState.lastError = '';
    } catch (e) {
      syncState.status = 'error'; syncState.lastError = e.message || '동기화에 실패했습니다.';
    }
    notifySyncListeners();
    setSyncCfgVer(v => v + 1);
  }
  function disconnectSync() {
    saveSyncConfig(null);
    syncState.status = 'off'; syncState.lastError = '';
    setSyncCfgVer(v => v + 1);
  }

  /* 알림톡 자동발송 없음: 모든 발송은 확인 패널에서 수신자·문구를 확인한 뒤

  }, [date, todayClasses]);

  function setVocabTest(studentId, testType, patch) {

  // 채점지 사진 리사이즈는 비동기라, 처리 중인 항목(key = studentId_testType 또는 vocabTest id)만

  function setAttendance(classId, studentId, patch) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.attendance[date]) next.attendance[date] = {};
      if (!next.attendance[date][classId]) next.attendance[date][classId] = {};
      const current = getAttendanceEntry(next, date, classId, studentId) || { status: null, homework: false };
      next.attendance[date][classId][studentId] = { ...current, ...patch };
      // 결석 체크 시 그날 단어/문법시험도 함께 결석으로 표시 — 출결·시험 탭 양쪽에서
      // 따로따로 결석 체크하지 않아도 되도록
      if (patch.status === 'absent') {
        VOCAB_TEST_TYPES.forEach(testType => {
          let v = next.vocabTests.find(x => x.studentId === studentId && x.date === date && x.testType === testType);

            next.vocabTests.push(v);

          v.result = 'absent';
          v.wrongCount = 0;
          v.retest = null;
          v.retestDate = '';
        });

  function setLessonLog(classId, content) {

      const next = JSON.parse(JSON.stringify(prev));
      if (!next.lessonLogs[date]) next.lessonLogs[date] = {};
      if (content) next.lessonLogs[date][classId] = content;
      else delete next.lessonLogs[date][classId];
      return next;
    });
  }

  function setClassHomework(classId, content) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.classHomework[date]) next.classHomework[date] = {};
      if (content) next.classHomework[date][classId] = content;
      else delete next.classHomework[date][classId];

  // 수업내용/숙제 칸은 입력할 때마다 바로 저장되어(잘못 붙여넣기 등) 실수해도 되돌릴 방법이
  // 없었다. 이제 칸에 커서를 올렸을 때(포커스) 그 시점 내용을 기억해뒀다가, 칸을 벗어날 때
  // 내용이 바뀌었으면 "직전 내용"으로 한 칸 보관해서 "되돌리기" 버튼으로 복원할 수 있게 한다.
  // 되돌리기를 누르면 현재값과 직전값이 서로 자리를 바꾸므로, 다시 누르면 되돌리기 취소(재실행)도 된다.
  const editSnapshotRef = useRef({});
  function captureEditSnapshot(field, classId) {
    const key = `${field}_${date}_${classId}`;
    editSnapshotRef.current[key] = field === 'lesson' ? getLessonLog(data, date, classId) : getClassHomework(data, date, classId);
  }
  function commitEditUndo(field, classId) {
    const key = `${field}_${date}_${classId}`;
    const before = editSnapshotRef.current[key];
    if (before === undefined) return;
    const after = field === 'lesson' ? getLessonLog(data, date, classId) : getClassHomework(data, date, classId);
    if (before === after) return;
    const undoField = field === 'lesson' ? 'lessonLogsUndo' : 'classHomeworkUndo';
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next[undoField]) next[undoField] = {};
      if (!next[undoField][date]) next[undoField][date] = {};
      next[undoField][date][classId] = before;
      return next;
    });
  }
  function undoEdit(field, classId) {
    const undoField = field === 'lesson' ? 'lessonLogsUndo' : 'classHomeworkUndo';
    const undoValue = (data[undoField]?.[date]?.[classId]) || '';
    const current = field === 'lesson' ? getLessonLog(data, date, classId) : getClassHomework(data, date, classId);
    if (field === 'lesson') setLessonLog(classId, undoValue); else setClassHomework(classId, undoValue);
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next[undoField]) next[undoField] = {};
      if (!next[undoField][date]) next[undoField][date] = {};
      next[undoField][date][classId] = current;
      return next;
    });
  }

  // patch.cancelled === false면 그 반의 결강 기록 자체를 지운다(사유·보강 일정 초기화).
  function setClassCancellation(classId, patch) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.classCancellations[date]) next.classCancellations[date] = {};
      const cur = next.classCancellations[date][classId] ||
        { cancelled: false, reason: '', makeupNeeded: false, makeupDate: '', makeupTime: '', makeupDone: false };
      const merged = { ...cur, ...patch };
      if (!merged.cancelled) delete next.classCancellations[date][classId];
      else next.classCancellations[date][classId] = merged;
      return next;
    });
  }

  const summary = useMemo(() => {

      c.students.filter(s => isActiveStudent(s, date)).forEach(s => {
        total++;
        const entry = getAttendanceEntry(data, date, c.id, s.id);
        const st = entry?.status;
        if (st === 'present') present++;
        else if (st === 'late') late++;
        else if (st === 'absent') absent++;
        else if (st === 'early') early++;
      });
    });
    return { present, late, absent, early, total, unchecked: total - present - late - absent - early };

  /* 학생 정보 수정: 항목별 팝업 대신 모든 항목을 한 화면에서 입력하는 인라인 폼 */
  const [studentFormFor, setStudentFormFor] = useState(null); // { classId, studentId } | null
  function saveStudentInfo(classId, studentId, fields) {
    setData(prev => ({
      ...prev,
      classes: prev.classes.map(c => c.id === classId
        ? { ...c, students: c.students.map(s => s.id === studentId ? { ...s, ...fields } : s) }
        : c)
    }));
    setStudentFormFor(null);
  }

  /* 인적사항(학생 명부) 중심 관리: 같은 이름의 학생은 한 사람으로 취급해
     정보 수정 시 모든 반의 사본에 동시 반영하고, 소속 반 체크로 배정을 관리한다.
     oldName이 null이면 신규 학생 등록. */
  const [directoryFormFor, setDirectoryFormFor] = useState(null); // 학생이름 | 'new' | null
  function saveStudentMaster(oldName, fields, classIds) {
    const key = (oldName || '').trim();
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      // 반 이동(체크 해제 + 다른 반 체크) 시에도 같은 학생의 id를 그대로 이어서 써서
      // 출결·시험·수납 기록이 새 반에서도 끊기지 않게 한다. 이미 여러 반에 동시에
      // 속해 있던 경우(특강반 등)까지 id를 섞으면 서로 다른 반 사본끼리 id가 겹치므로,
      // "이번에 빠지는 반"의 id만 "이번에 새로 추가되는 반"에 순서대로 넘겨 재사용한다.
      const removedFrom = [];
      next.classes.forEach(c => {
        const match = key && c.students.find(s => (s.name || '').trim() === key);
        if (match && !classIds.includes(c.id)) removedFrom.push({ classId: c.id, id: match.id });
      });
      next.classes.forEach(c => {
        const has = key && c.students.some(s => (s.name || '').trim() === key);
        const want = classIds.includes(c.id);
        if (has && !want) {
          c.students = c.students.filter(s => (s.name || '').trim() !== key);
        } else if (has) {
          c.students.forEach(s => { if ((s.name || '').trim() === key) Object.assign(s, fields); });
        } else if (want) {
          const reused = removedFrom.shift();
          const newId = reused ? reused.id : ('s' + Date.now() + Math.random().toString(36).slice(2, 6));
          c.students.push({ id: newId, ...fields });
          if (reused) {
            // 옮겨온 반이 있으면, 그 반에서의 날짜별 출결 기록도 새 반으로 함께 옮긴다.
            Object.keys(next.attendance || {}).forEach(date => {
              const entry = next.attendance[date]?.[reused.classId]?.[reused.id];
              if (!entry) return;
              if (!next.attendance[date][c.id]) next.attendance[date][c.id] = {};
              if (!next.attendance[date][c.id][newId]) next.attendance[date][c.id][newId] = entry;
            });
          }
        }
      });
      return next;
    });
    setDirectoryFormFor(null);
  }

  function addScore(studentId) {

    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.records[studentId]) next.records[studentId] = { scores: [], homework: [] };
      next.records[studentId].scores.push({ id: 'sc' + Date.now(), date: todayStr(), label, score });
      return next;
    });

  // 특정 달의 교재비 완납/미납 토글 (칩 클릭). 완납 상태면 미납으로 되돌리고(납부 기록 초기화),
  // 미납·부분납 상태면 남은 금액을 한 번에 완납 처리한다. 부분 금액만 입력하려면
  // "부분납 입력" 버튼(payPartialBookFee)을 쓴다.
  function toggleBookFeeMonth(studentId, monthKey) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const r = next.bookFeesByMonth?.[monthKey]?.[studentId];
      if (!r) return prev;
      if (!r.payments) r.payments = [];
      const remaining = bookFeeRemaining(r);
      if (remaining <= 0) {
        r.payments = [];
        r.status = 'unpaid';
        r.paidDate = null;
      } else {
        addBookFeePayment(next, studentId, monthKey, remaining);
      }
      return next;
    });
  }

  // 이 달(또는 이월된 과거 달) 교재비를 일부만 납부한 경우 사용 — 남은 금액 중 일부만 입력하면
  // 나머지는 계속 부분납 상태로 다음 달까지 이월된다.
  function payPartialBookFee(studentId, monthKey) {
    const r0 = getBookFeeMonthRecord(data, studentId, monthKey);
    const remaining = bookFeeRemaining(r0);
    if (remaining <= 0) { alert('이미 완납된 교재비입니다.'); return; }
    const amountStr = prompt(`${monthKeyLabel(monthKey)} 교재비 부분 납부 금액 입력 (원)\n남은 금액: ${remaining.toLocaleString()}원`, String(remaining));
    if (amountStr === null) return;
    const amount = parseInt(amountStr, 10);
    if (isNaN(amount) || amount <= 0) return;
    const applied = Math.min(amount, remaining);
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      addBookFeePayment(next, studentId, monthKey, applied);
      return next;
    });
  }

  // 이월 누적된 미납·부분납 교재비를 한 번에 완납 처리 (남은 금액만큼 납부 기록을 채운다)
  function payAllBookFees(studentId) {
    const monthKey = activePaymentMonthKey();
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const byMonth = next.bookFeesByMonth || {};
      Object.keys(byMonth).forEach(mk => {
        if (mk > monthKey) return;
        const r = byMonth[mk][studentId];
        if (!r || (r.fee || 0) <= 0) return;
        const remaining = bookFeeRemaining(r);
        if (remaining > 0) addBookFeePayment(next, studentId, mk, remaining);
      });
      return next;
    });

  // 잘못 입력한 수업료 청구를 취소 (이 달 금액을 0원·미납으로 초기화 — 다음 달로도 더 이상 이월되지 않음)
