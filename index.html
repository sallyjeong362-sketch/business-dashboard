function normalizeTabOrder(order) {
  const seen = {};
  const result = [];
  (order || []).forEach(id => { if (TAB_META[id] && !seen[id]) { seen[id] = true; result.push(id); } });
  DEFAULT_TAB_ORDER.forEach(id => { if (!seen[id]) { seen[id] = true; result.push(id); } });
  const pinned = result.filter(id => TAB_META[id].pinned);
  const rest = result.filter(id => !TAB_META[id].pinned);
  return pinned.concat(rest);
}

function nextGrade(grade) {
  const i = GRADE_ORDER.indexOf(grade);
  if (i === -1 || i === GRADE_ORDER.length - 1) return grade;
  return GRADE_ORDER[i + 1];
}

function currentYear() {
  return new Date().getFullYear();
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function daysAgoStr(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0,10);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.records) parsed.records = {};
      if (!parsed.reports) parsed.reports = {};
      if (!parsed.announcements) parsed.announcements = [];
      if (!parsed.payments) parsed.payments = {};
      if (parsed.newsProxyUrl === undefined) parsed.newsProxyUrl = '';
      if (!parsed.newsQuery) parsed.newsQuery = '수능 영어';
      if (parsed.alimtalkProxyUrl === undefined) parsed.alimtalkProxyUrl = '';
      if (!parsed.counseling) parsed.counseling = [];
      if (!parsed.lessonLogs) parsed.lessonLogs = {};
      if (!parsed.classHomework) parsed.classHomework = {};
      if (!parsed.workLogs) parsed.workLogs = [];
      if (!parsed.vocabTests) parsed.vocabTests = [];
      if (parsed.paymentGatewayProxyUrl === undefined) parsed.paymentGatewayProxyUrl = '';
      if (parsed.autoPaymentReminderEnabled === undefined) parsed.autoPaymentReminderEnabled = false;
      if (parsed.autoPaymentReminderLastSent === undefined) parsed.autoPaymentReminderLastSent = '';
      parsed.tabOrder = normalizeTabOrder(parsed.tabOrder);
      if (!parsed.gradePromotionYear) parsed.gradePromotionYear = currentYear();
      Object.keys(parsed.payments || {}).forEach(k => {
        const p = parsed.payments[k];
        if (p.bookFee === undefined) p.bookFee = 0;
        if (!p.bookFeeStatus) p.bookFeeStatus = 'unpaid';
      });
      return parsed;
    }
  } catch (e) {}
  return defaultData();
}

function stripHtml(str) {
  if (!str) return '';
  return str
    .replace(/<\/?b>/g, '')
    .replace(/&quot;/g, '"')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&#39;/g, "'");
}

function formatTimeRange(c) {
  return c.endTime ? `${c.time}~${c.endTime}` : c.time;
}

function classTimeForDay(c, day) {
  const o = c.daySchedule && c.daySchedule[day];
  return o ? { time: o.time, endTime: o.endTime } : { time: c.time, endTime: c.endTime };
}

function formatClassTimeForDay(c, day) {
  const t = classTimeForDay(c, day);
  return t.endTime ? `${t.time}~${t.endTime}` : t.time;
}

function hasVariedTimes(c) {
  if (!c.daySchedule) return false;
  return c.days.some(d => {
    const o = c.daySchedule[d];
    return o && (o.time !== c.time || o.endTime !== c.endTime);
  });
}

function classScheduleSummary(c) {
  if (!hasVariedTimes(c)) return `${formatTimeRange(c)} · ${c.days.join(',')}`;
  return c.days.map(d => `${d} ${formatClassTimeForDay(c, d)}`).join(', ');
}

function collectDaySchedulePrompt(days, baseTime, baseEndTime, existing) {
  const daySchedule = {};
  if (!days.length) return daySchedule;
  const setPerDay = confirm('요일마다 수업 시간이 다른가요? (아니오를 누르면 위에서 입력한 기본 시간이 모든 요일에 적용됩니다)');
  if (!setPerDay) return daySchedule;
  for (const d of days) {
    const current = (existing && existing[d]) || { time: baseTime, endTime: baseEndTime };
    const dTime = prompt(`${d}요일 시작 시간`, current.time) ?? current.time;
    const dEnd = prompt(`${d}요일 종료 시간`, current.endTime || '') ?? current.endTime;
    if (dTime !== baseTime || dEnd !== (baseEndTime || '')) {
      daySchedule[d] = { time: dTime, endTime: dEnd };
    }
  }
  return daySchedule;
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getAttendanceEntry(data, date, classId, studentId) {
  const raw = data.attendance[date]?.[classId]?.[studentId];
  if (!raw) return null;
  if (typeof raw === 'string') return { status: raw, homework: false };
  return raw;
}

function normalizeHomework(entry) {
  if (!entry) return null;
  if (entry.homework === true) return 'done';
  if (entry.homework === 'done' || entry.homework === 'missing') return entry.homework;
  return null;
}

function getLessonLog(data, date, classId) {
  return data.lessonLogs?.[date]?.[classId] || '';
}

function getClassHomework(data, date, classId) {
  return data.classHomework?.[date]?.[classId] || '';
}

function sendAlimtalk(proxyUrl, to, templateCode, variables) {
  if (!proxyUrl) {
    return Promise.reject(new Error('알림톡 프록시 URL이 설정되지 않았습니다. 관리자 탭에서 먼저 설정해주세요.'));
  }
  return fetch(proxyUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to, templateCode, variables }),
  })
    .then(res => { if (!res.ok) throw new Error('요청 실패'); return res.json(); })
    .then(json => { if (!json.success) throw new Error(json.error || '발송에 실패했습니다.'); return json; });
}

function allStudents(data) {
  const map = {};
  data.classes.forEach(c => c.students.forEach(s => { map[s.id] = { ...s, className: c.name, classId: c.id, teacher: c.teacher }; }));
  return Object.values(map);
}

const STUDENT_SORT_OPTIONS = [
  { key: 'name_asc', label: '이름 오름차순' },
  { key: 'name_desc', label: '이름 내림차순' },
  { key: 'grade', label: '학년별' },
  { key: 'class', label: '학급별' },
  { key: 'teacher', label: '선생님별' },
];

function studentSortComparator(sortKey) {
  return (a, b) => {
    switch (sortKey) {
      case 'name_desc':
        return b.name.localeCompare(a.name, 'ko');
      case 'grade': {
        let ai = GRADE_ORDER.indexOf(a.grade); if (ai === -1) ai = 999;
        let bi = GRADE_ORDER.indexOf(b.grade); if (bi === -1) bi = 999;
        return ai - bi || a.name.localeCompare(b.name, 'ko');
      }
      case 'class':
        return (a.className || '').localeCompare(b.className || '', 'ko') || a.name.localeCompare(b.name, 'ko');
      case 'teacher':
        return (a.teacher || '').localeCompare(b.teacher || '', 'ko') || a.name.localeCompare(b.name, 'ko');
      case 'name_asc':
      default:
        return a.name.localeCompare(b.name, 'ko');
    }
  };
}

const PAYMENT_SORT_OPTIONS = [
  { key: 'paiddate_asc', label: '결제일 오름차순' },
  { key: 'paiddate_desc', label: '결제일 내림차순' },
  { key: 'name_asc', label: '이름 오름차순' },
  { key: 'name_desc', label: '이름 내림차순' },
];

function paymentSortComparator(sortKey, payments) {
  return (a, b) => {
    if (sortKey === 'name_asc') return a.name.localeCompare(b.name, 'ko');
    if (sortKey === 'name_desc') return b.name.localeCompare(a.name, 'ko');
    const da = (payments[a.id] || {}).paidDate || '';
    const db = (payments[b.id] || {}).paidDate || '';
    if (!da && !db) return a.name.localeCompare(b.name, 'ko');
    if (!da) return 1;
    if (!db) return -1;
    const cmp = da.localeCompare(db);
    return sortKey === 'paiddate_desc' ? -cmp : cmp;
  };
}

function promoteGradesInData(data) {
  const next = JSON.parse(JSON.stringify(data));
  next.classes.forEach(c => c.students.forEach(s => { if (s.grade) s.grade = nextGrade(s.grade); }));
  next.gradePromotionYear = currentYear();
  return next;
}

const VOCAB_TEST_TYPES = ['단어시험', '문법 복습시험'];

function getVocabTest(data, studentId, dateStr, testType) {
  return data.vocabTests.find(v => v.studentId === studentId && v.date === dateStr && v.testType === testType);
}

function unpaidPhoneList(data) {
  const phones = [];
  allStudents(data).forEach(s => {
    const p = data.payments[s.id];
    if (p && (p.status === 'unpaid' || p.status === 'overdue') && s.parentPhone && !phones.includes(s.parentPhone)) {
      phones.push(s.parentPhone);
    }
  });
  return phones;
}

function App() {
  const [data, setData] = useState(loadData());
  const [tab, setTab] = useState('schedule');
  const [selectedClassId, setSelectedClassId] = useState(null);
  const [date, setDate] = useState(todayStr());
  const [reportStudentId, setReportStudentId] = useState(null);

  const [newsError, setNewsError] = useState('');

  const [gatewayPendingFor, setGatewayPendingFor] = useState(null);
  const [gatewayErrorFor, setGatewayErrorFor] = useState({});

  const [reminderSendError, setReminderSendError] = useState('');
  const [reminderSendFlash, setReminderSendFlash] = useState('');
  const [bulkGradeSelect, setBulkGradeSelect] = useState(GRADE_ORDER[0]);
  const [bulkGradeAmount, setBulkGradeAmount] = useState('');
  const [bulkGradeApplyFlash, setBulkGradeApplyFlash] = useState('');
  const [directorySort, setDirectorySort] = useState('name_asc');
  const [manageSort, setManageSort] = useState('name_asc');
  const [paymentSort, setPaymentSort] = useState('name_asc');

  useEffect(() => { saveData(data); }, [data]);

  useEffect(() => {
    if (data.gradePromotionYear < currentYear()) {
      setData(prev => promoteGradesInData(prev));
    }
  }, []);

  useEffect(() => {
    if (!data.autoPaymentReminderEnabled) return;
    if (data.autoPaymentReminderLastSent === todayStr()) return;
    if (!data.alimtalkProxyUrl) return;
    const phones = unpaidPhoneList(data);
    if (!phones.length) return;
    sendPaymentReminders(false);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const weekday = DAYS[new Date(date + 'T00:00:00').getDay()];

  const todayClasses = useMemo(() => {
    return data.classes
      .filter(c => c.days.includes(weekday))
      .sort((a,b) => classTimeForDay(a, weekday).time.localeCompare(classTimeForDay(b, weekday).time));
  }, [data.classes, weekday]);

  useEffect(() => {
    if (todayClasses.length && !todayClasses.find(c => c.id === selectedClassId)) {
      setSelectedClassId(todayClasses[0].id);
    }
    if (!todayClasses.length) setSelectedClassId(null);
  }, [todayClasses]);

  useEffect(() => {
    setData(prev => {
      let changed = false;
      let counter = 0;
      const vocabTests = prev.vocabTests.slice();
      todayClasses.forEach(c => {
        c.students.forEach(s => {
          VOCAB_TEST_TYPES.forEach(testType => {
            if (!vocabTests.some(v => v.studentId === s.id && v.date === date && v.testType === testType)) {
              vocabTests.push({ id: 'vt' + Date.now() + '_' + (counter++), studentId: s.id, testType, date, result: null, wrongCount: 0, retest: false, comment: '' });
              changed = true;
            }
          });
        });
      });
      return changed ? { ...prev, vocabTests } : prev;
    });
  }, [date, todayClasses]);

  function setVocabTest(studentId, testType, patch) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      let v = next.vocabTests.find(x => x.studentId === studentId && x.date === date && x.testType === testType);
      if (!v) {
        v = { id: 'vt' + Date.now() + Math.floor(Math.random() * 1000), studentId, testType, date, result: null, wrongCount: 0, retest: false, comment: '' };
        next.vocabTests.push(v);
      }
      Object.assign(v, patch);
      return next;
    });
  }

  useEffect(() => {
    const students = allStudents(data);
    if (students.length && !students.find(s => s.id === reportStudentId)) {
      setReportStudentId(students[0].id);
    }
  }, [data.classes]);

  const attendanceForDate = data.attendance[date] || {};

  function setAttendance(classId, studentId, patch) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.attendance[date]) next.attendance[date] = {};
      if (!next.attendance[date][classId]) next.attendance[date][classId] = {};
      const current = getAttendanceEntry(next, date, classId, studentId) || { status: null, homework: false };
      next.attendance[date][classId][studentId] = { ...current, ...patch };
      return next;
    });
  }

  function setLessonLog(classId, content) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.lessonLogs[date]) next.lessonLogs[date] = {};
      if (content) next.lessonLogs[date][classId] = content;
      else delete next.lessonLogs[date][classId];
      return next;
    });
  }

  function setClassHomework(classId, content) {
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.classHomework[date]) next.classHomework[date] = {};
      if (content) next.classHomework[date][classId] = content;
      else delete next.classHomework[date][classId];
      return next;
    });
  }

  const summary = useMemo(() => {
    let present=0, late=0, absent=0, early=0, total=0;
    todayClasses.forEach(c => {
      c.students.forEach(s => {
        total++;
        const entry = getAttendanceEntry(data, date, c.id, s.id);
        const st = entry?.status;
        if (st === 'present') present++;
        else if (st === 'late') late++;
        else if (st === 'absent') absent++;
        else if (st === 'early') early++;
      });
    });
    return { present, late, absent, early, total, unchecked: total - present - late - absent - early };
  }, [todayClasses, data, date]);

  function addClass() {

  function bulkSetTuitionByGrade(grade, amount) {
    if (isNaN(amount) || amount < 0) { setBulkGradeApplyFlash(''); return; }
    let count = 0;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      next.classes.forEach(c => c.students.forEach(s => {
        if (s.grade === grade) {
          if (!next.payments[s.id]) next.payments[s.id] = { tuition: 0, status: 'unpaid', dueDate: todayStr(), bookFee: 0, bookFeeStatus: 'unpaid' };
          next.payments[s.id].tuition = amount;
          count++;
        }
      }));
      return next;
    });
    setBulkGradeApplyFlash(count ? `${grade} 학생 ${count}명에게 수업료 ${amount.toLocaleString()}원을 일괄 적용했습니다.` : `${grade} 학년 학생이 없습니다.`);
  }

  function requestPayment(studentId) {
    const s = allStudents(data).find(s => s.id === studentId);
    const p = data.payments[studentId];
    if (!s || !p) return;
    if (!data.paymentGatewayProxyUrl) {
      setGatewayErrorFor(prev => ({ ...prev, [studentId]: '결제선생 등 외부 결제창 프록시 URL이 설정되지 않았습니다. 관리자 탭에서 먼저 설정해주세요.' }));
      return;
    }
    setGatewayPendingFor(studentId);
    setGatewayErrorFor(prev => ({ ...prev, [studentId]: '' }));
    fetch(data.paymentGatewayProxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        studentId, studentName: s.name, phone: s.parentPhone || s.studentPhone || '',
        tuition: p.tuition || 0, bookFee: p.bookFee || 0, amount: (p.tuition || 0) + (p.bookFee || 0),
      }),
    })
      .then(res => { if (!res.ok) throw new Error('요청 실패'); return res.json(); })
      .then(json => {
        if (!json.success) throw new Error(json.error || '결제 요청에 실패했습니다.');
        setData(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          if (!next.payments[studentId]) next.payments[studentId] = { tuition: 0, status: 'unpaid', bookFee: 0, bookFeeStatus: 'unpaid' };
          next.payments[studentId].gatewayRequestedAt = todayStr();
          return next;
        });
      })
      .catch(err => setGatewayErrorFor(prev => ({ ...prev, [studentId]: err.message || '결제 요청에 실패했습니다.' })))
      .finally(() => setGatewayPendingFor(null));
  }

      classes: prev.classes.map(c => c.id === classId
        ? { ...c, students: c.students.map(s => s.id === studentId ? { ...s, name } : s) }
        : c)
    }));
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `academy-dashboard-data-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const paymentSummary = useMemo(() => {
    const students = allStudents(data);
    let paidCount = 0, totalDue = 0, totalCollected = 0, bookFeeCollected = 0;
    students.forEach(s => {
      const p = data.payments[s.id];
      if (!p) return;
      totalDue += p.tuition || 0;
      if (p.status === 'paid') { paidCount++; totalCollected += p.tuition || 0; }
      if (p.bookFeeStatus === 'paid') bookFeeCollected += p.bookFee || 0;
    });
    const rate = students.length ? Math.round((paidCount / students.length) * 100) : 0;
    return { paidCount, total: students.length, rate, totalDue, totalCollected, bookFeeCollected };
  }, [data]);

  const paymentAlerts = useMemo(() => {
    const now = new Date();
    const todayDay = now.getDate();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowDay = tomorrow.getDate();
    const dueToday = [], dueTomorrow = [], unpaidList = [];
    allStudents(data).forEach(s => {
      const p = data.payments[s.id];
      if (s.paymentDueDay === todayDay) dueToday.push(s);
      else if (s.paymentDueDay === tomorrowDay) dueTomorrow.push(s);
      if (p && (p.status === 'unpaid' || p.status === 'overdue')) unpaidList.push(s);
    });
    return { dueToday, dueTomorrow, unpaidList };
  }, [data]);

  const reportData = useMemo(() => {
    if (!reportStudentId) return null;
    const students = allStudents(data);
    const student = students.find(s => s.id === reportStudentId);
    if (!student) return null;

    const rangeDates = Array.from({length:7}, (_,i) => daysAgoStr(6-i));
    let attCount=0, presentCount=0, hwTotal=0, hwDone=0;
    const attendanceDetails = [];
    rangeDates.forEach(d => {
      const entry = getAttendanceEntry(data, d, student.classId, student.id);
      if (entry && entry.status) {
        attCount++;
        if (entry.status === 'present' || entry.status === 'late') presentCount++;
        const hw = normalizeHomework(entry);
        if (hw) { hwTotal++; if (hw === 'done') hwDone++; }
        attendanceDetails.push({
          date: d, status: entry.status, note: entry.note || '', hw, hwNote: entry.homeworkNote || '',
          attitude: entry.attitude || '', lesson: getLessonLog(data, d, student.classId),
          homeworkAssigned: getClassHomework(data, d, student.classId),
        });
      }
    });
    attendanceDetails.reverse();
    const attendanceRate = attCount ? Math.round((presentCount/attCount)*100) : null;
    const homeworkRate = hwTotal ? Math.round((hwDone/hwTotal)*100) : null;

    const scores = (data.records[student.id]?.scores || []).slice(-3).reverse();

    let homeworkHistory = [];
    Object.keys(data.attendance).sort().reverse().forEach(d => {
      const entry = getAttendanceEntry(data, d, student.classId, student.id);
      const hw = normalizeHomework(entry);
      if (hw) homeworkHistory.push({ date: d, hw, hwNote: entry?.homeworkNote || '' });
    });
    homeworkHistory = homeworkHistory.slice(0, 10);

    const vtByDate = {};
    let vocabTestHistory = [];
    data.vocabTests
      .filter(v => v.studentId === student.id && v.result)
      .forEach(v => {
        if (!vtByDate[v.date]) { vtByDate[v.date] = { date: v.date, tests: [] }; vocabTestHistory.push(vtByDate[v.date]); }
        vtByDate[v.date].tests.push(v);
      });
    vocabTestHistory = vocabTestHistory
      .slice().sort((a,b) => b.date.localeCompare(a.date))
      .slice(0, 10);
    vocabTestHistory.forEach(g => g.tests.sort((a,b) => VOCAB_TEST_TYPES.indexOf(a.testType) - VOCAB_TEST_TYPES.indexOf(b.testType)));

    return { student, attendanceRate, homeworkRate, scores, attCount, hwTotal, attendanceDetails, homeworkHistory, vocabTestHistory };
  }, [reportStudentId, data]);

  const groupedVocabTests = useMemo(() => {
    const groups = {};
    const order = [];
    data.vocabTests.forEach(v => {
      if (!v.result) return;
      const key = v.studentId + '|' + v.date;
      if (!groups[key]) { groups[key] = { studentId: v.studentId, date: v.date, records: [] }; order.push(key); }
      groups[key].records.push(v);
    });
    return order
      .map(k => groups[k])
      .sort((a, b) => b.date.localeCompare(a.date))
      .map(g => ({ ...g, records: g.records.slice().sort((a,b) => VOCAB_TEST_TYPES.indexOf(a.testType) - VOCAB_TEST_TYPES.indexOf(b.testType)) }));
  }, [data.vocabTests]);

  function saveComment() {
    if (!reportStudentId) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next.reports[reportStudentId]) next.reports[reportStudentId] = [];
      next.reports[reportStudentId].push({ date: todayStr(), comment, channel: '미정' });
      return next;
    });
    alert('리포트가 저장됐어요.');
    setComment('');
  }

  function sendReportAlimtalk() {
    if (!reportData) return;
    if (!reportData.student.parentPhone) {
      setReportSendError('학부모 연락처가 등록되어 있지 않습니다. 반 관리 탭에서 먼저 등록해주세요.');
      return;
    }
    setReportSendPending(true);
    setReportSendError('');
    const variables = {
      studentName: reportData.student.name,
      className: reportData.student.className,
      rangeStart: daysAgoStr(6),
      rangeEnd: todayStr(),
      attendanceRate: reportData.attendanceRate !== null ? reportData.attendanceRate + '%' : '기록없음',
      homeworkRate: reportData.homeworkRate !== null ? reportData.homeworkRate + '%' : '기록없음',
      recentScore: reportData.scores[0] ? reportData.scores[0].score + '점' : '기록없음',
      comment: comment || '',
    };
    sendAlimtalk(data.alimtalkProxyUrl, reportData.student.parentPhone, 'report', variables)
      .then(() => {
        setData(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          if (!next.reports[reportData.student.id]) next.reports[reportData.student.id] = [];
          next.reports[reportData.student.id].push({ date: todayStr(), comment, channel: '카카오 알림톡', phone: reportData.student.parentPhone });
          return next;
        });
        setComment('');
        setReportSendSuccessFlash(true);
      })
      .catch(err => setReportSendError(err.message || '발송에 실패했습니다.'))
      .finally(() => setReportSendPending(false));
  }

  return (

        <div>

          <div className="space-y-1">

            {paymentAlerts.dueTomorrow.length > 0 && (

                {paymentAlerts.dueTomorrow.map(s => s.name).join(', ')}
              </p>

            {paymentAlerts.unpaidList.length > 0 && (
              <p className="text-xs text-gray-800 flex items-center gap-2 flex-wrap">

          <button onClick={() => setTab('payment')} className="shrink-0 text-xs font-medium px-3 py-1.5 rounded-lg border border-yellow-400 text-yellow-800 bg-white hover:bg-yellow-100">

      <div className="grid grid-cols-5 gap-2 mb-5">

      {tab === 'schedule' && (

                  출결 {checked}/{c.students.length}
                </span>

      {tab === 'attendance' && (

              <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
                {todayClasses.map(c => (
                  <button key={c.id} onClick={() => setSelectedClassId(c.id)}

                    {formatClassTimeForDay(c, weekday)} {c.name}

              </div>
              {selectedClassId && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                  <div>
                    <label className="text-xs text-gray-500 mb-1 block">오늘 수업 내용 (진도)</label>
                    <textarea
                      value={getLessonLog(data, date, selectedClassId)}
                      onChange={e => setLessonLog(selectedClassId, e.target.value)}
                      placeholder="예: 3과 본문 해석, 단어시험 진행"

                    <textarea

            <div key={a.id} className="bg-white border border-gray-200 rounded-xl p-4">
              <div className="flex items-start justify-between mb-1.5">
                <p className="font-medium text-gray-900">{a.title}</p>
                <div className="flex items-center gap-2 shrink-0 ml-2">
                  <button onClick={() => editAnnouncement(a.id)} className="text-xs text-indigo-600 hover:underline">수정</button>
                  <button onClick={() => deleteAnnouncement(a.id)} className="text-xs text-gray-400 hover:text-red-500">삭제</button>
                </div>
              </div>
              <p className="text-sm text-gray-600 mb-2">{a.content}</p>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700">대상: {a.target}</span>
                <span className="text-xs text-gray-400">{a.date}</span>
                {a.sentAt ? (
                  <span className="text-xs px-2 py-0.5 rounded-full bg-green-50 text-green-700">알림톡 발송됨 ({a.sentCount}명, {a.sentAt})</span>
                ) : (
                  <button onClick={() => sendNoticeAlimtalk(a.id)} className="text-xs text-indigo-600 hover:underline">
                    {noticeSendPending[a.id] ? '발송 중...' : '카카오 알림톡 발송'}
                  </button>
                )}
              </div>
              {noticeSendError[a.id] && <p className="text-xs text-red-500 mt-1.5">{noticeSendError[a.id]}</p>}
            </div>
          ))}
        </div>
      )}

      {tab === 'counseling' && (
        <div className="space-y-3">
          <button onClick={addCounseling} className="w-full py-2 border-2 border-dashed border-indigo-300 rounded-xl text-sm text-indigo-600 hover:bg-indigo-50">
            + 새 상담 등록
          </button>
          {data.counseling.length === 0 && <EmptyState text="등록된 상담이 없습니다." />}
          {data.counseling
            .slice()
            .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time))
            .map(k => (
              <div key={k.id} className="bg-white border border-gray-200 rounded-xl p-4">
                <div className="flex items-start justify-between mb-1.5">
                  <div>
                    <p className="font-medium text-gray-900">{k.studentName}{k.parentName ? ` · ${k.parentName}` : ''}</p>
                    <p className="text-xs text-gray-500">{k.date} {k.time} · {k.type}</p>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    <button
                      onClick={() => toggleCounselingStatus(k.id)}
                      className={`text-xs px-2 py-0.5 rounded-full border ${k.status==='완료' ? 'bg-green-100 text-green-700 border-green-300' : 'bg-yellow-50 text-yellow-700 border-yellow-300'}`}
                    >{k.status}</button>
                    <button onClick={() => editCounseling(k.id)} className="text-xs text-indigo-600 hover:underline">수정</button>
                    <button onClick={() => deleteCounseling(k.id)} className="text-xs text-gray-400 hover:text-red-500">삭제</button>
                  </div>
                </div>
                {k.content && <p className="text-sm text-gray-600 mb-1">{k.content}</p>}
                {k.nextAction && <p className="text-xs text-indigo-600">다음 액션: {k.nextAction}</p>}
              </div>
          ))}
        </div>
      )}

      {tab === 'worklog' && (
        <div className="space-y-3">
          <button onClick={addWorkLog} className="w-full py-2 border-2 border-dashed border-indigo-300 rounded-xl text-sm text-indigo-600 hover:bg-indigo-50">
            + 업무일지 작성
          </button>
          {data.workLogs.length === 0 && <EmptyState text="작성된 업무일지가 없습니다." />}
          {data.workLogs
            .slice()
            .sort((a,b) => b.date.localeCompare(a.date))
            .map(w => (
              <div key={w.id} className="bg-white border border-gray-200 rounded-xl p-4">
                <div className="flex items-start justify-between mb-1.5">
                  <div>
                    <p className="font-medium text-gray-900">{w.teacher || '미지정'}</p>
                    <p className="text-xs text-gray-500">{w.date}</p>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700">{w.category}</span>
                    <button onClick={() => editWorkLog(w.id)} className="text-xs text-indigo-600 hover:underline">수정</button>
                    <button onClick={() => deleteWorkLog(w.id)} className="text-xs text-gray-400 hover:text-red-500">삭제</button>
                  </div>
                </div>
                <p className="text-sm text-gray-600">{w.content}</p>
              </div>
          ))}
        </div>
      )}

      {tab === 'news' && (
        <div>
          <div className="bg-white border border-gray-200 rounded-xl p-4 mb-4 space-y-2">
            <div>
              <label className="text-xs text-gray-500 mb-1 block">Worker 프록시 URL</label>
              <input
                type="text"
                value={data.newsProxyUrl}
                onChange={e => setData(prev => ({ ...prev, newsProxyUrl: e.target.value }))}
                placeholder="https://your-worker-name.your-subdomain.workers.dev"
                className="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm"
              />
            </div>
            <div className="flex gap-2">
              <input
                type="text"
                value={data.newsQuery}
                onChange={e => setData(prev => ({ ...prev, newsQuery: e.target.value }))}
                placeholder="검색어 (예: 수능 영어)"
                className="flex-1 border border-gray-300 rounded-lg px-3 py-1.5 text-sm"
              />
              <button onClick={fetchNews} disabled={newsLoading} className="px-4 py-1.5 text-sm rounded-lg bg-indigo-600 text-white disabled:opacity-50">
                {newsLoading ? '불러오는 중...' : '뉴스 불러오기'}
              </button>
            </div>
            {newsError && <p className="text-xs text-red-500">{newsError}</p>}
            {!data.newsProxyUrl && <p className="text-xs text-gray-400">naver-news-proxy-worker.js를 Cloudflare Worker에 배포하고 주소를 입력하시면 뉴스를 불러올 수 있어요.</p>}
          </div>

          <div className="space-y-2">
            {newsItems.map((item, i) => (
              <a key={i} href={item.link} target="_blank" rel="noopener noreferrer"
                 className="block bg-white border border-gray-200 rounded-xl p-4 hover:border-indigo-300 transition">
                <p className="font-medium text-gray-900 mb-1">{stripHtml(item.title)}</p>
                <p className="text-xs text-gray-500 mb-1.5">{stripHtml(item.description)}</p>
                <p className="text-xs text-gray-400">{item.pubDate}</p>
              </a>
            ))}
            {newsItems.length === 0 && !newsLoading && (
              <EmptyState text="검색어를 입력하고 '뉴스 불러오기'를 눌러주세요." />
            )}
          </div>
        </div>
      )}

      {tab === 'admin' && (
        <div className="space-y-5">
          <div>
            <p className="text-sm font-medium text-gray-900 mb-2">학원 설정</p>
            <div className="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between">
              <span className="text-sm text-gray-700">{data.academyName}</span>
              <button onClick={editAcademyName} className="text-xs text-indigo-600 hover:underline">학원명 수정</button>
            </div>
          </div>

          <div>
            <p className="text-sm font-medium text-gray-900 mb-2">카카오 알림톡 연동</p>
            <div className="bg-white border border-gray-200 rounded-xl p-4">
              <p className="text-xs text-gray-500 mb-2">
                학습리포트·공지사항을 학부모에게 카카오 알림톡으로 보내려면, 카카오 비즈니스 채널 개설 → 발신대행사(알리고, 솔라피 등) 계약 → 템플릿 승인을 먼저 마친 뒤, 발급받은 API로 메시지를 전달할 프록시 서버 주소를 아래에 입력하세요.
              </p>
              <label className="text-xs text-gray-500 mb-1 block">알림톡 프록시 URL</label>
              <input
                type="text"
                value={data.alimtalkProxyUrl}
                onChange={e => setData(prev => ({ ...prev, alimtalkProxyUrl: e.target.value }))}
                placeholder="https://your-worker-name.your-subdomain.workers.dev"
                className="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm"
              />
              <label className="flex items-center gap-2 text-xs text-gray-600 mt-3">
                <input
                  type="checkbox"
                  checked={data.autoPaymentReminderEnabled}
                  onChange={e => setData(prev => ({ ...prev, autoPaymentReminderEnabled: e.target.checked }))}
                />
                결제일 D-1/당일 및 미납 학생 대상 알림문자 자동발송 (대시보드를 열 때마다 하루 1회 확인 후 발송)
              </label>
            </div>
          </div>

          <div>
            <p className="text-sm font-medium text-gray-900 mb-2">외부 결제창 연동 (결제선생 등)</p>
            <div className="bg-white border border-gray-200 rounded-xl p-4">
              <p className="text-xs text-gray-500 mb-2">
                결제선생, 이니시스 등 실제 결제 대행사와 연동하려면 사업자 가맹 계약 및 API 키 발급을 먼저 진행한 뒤, 결제 요청을 대신 전달할 프록시 서버 주소를 아래에 입력하세요. 수납현황 탭에서 학생별로 "외부 결제창 연동 요청" 버튼을 누르면 이 프록시로 결제 요청이 전송됩니다.
              </p>
              <label className="text-xs text-gray-500 mb-1 block">결제 프록시 URL</label>
              <input
                type="text"
                value={data.paymentGatewayProxyUrl}
                onChange={e => setData(prev => ({ ...prev, paymentGatewayProxyUrl: e.target.value }))}
                placeholder="https://your-worker-name.your-subdomain.workers.dev"
                className="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm"
              />
            </div>
          </div>

          <div>
            <p className="text-sm font-medium text-gray-900 mb-2">반 정보 · 학생 이름 수정</p>
            <div className="space-y-2">
              {data.classes.map(c => (
                <div key={c.id} className="bg-white border border-gray-200 rounded-xl p-4">
                  <div className="flex items-center justify-between mb-2">
                    <div>
                      <p className="font-medium text-gray-900">{c.name}</p>
                      <p className="text-xs text-gray-500">{c.teacher} · {c.room} · {classScheduleSummary(c)}</p>
                    </div>
                    <button onClick={() => editClassInfo(c.id)} className="text-xs text-indigo-600 hover:underline">정보 수정</button>
                  </div>
                  <div className="space-y-1">
                    {c.students.map(s => (
                      <div key={s.id} className="flex items-center justify-between text-xs bg-gray-50 px-2.5 py-1.5 rounded-lg">
                        <span className="text-gray-700">{s.name}</span>
                        <button onClick={() => renameStudent(c.id, s.id)} className="text-indigo-600 hover:underline">이름 수정</button>
                      </div>
                    ))}
                    {c.students.length === 0 && <p className="text-xs text-gray-400">등록된 학생이 없습니다.</p>}
                  </div>
                </div>
              ))}
              {data.classes.length === 0 && <EmptyState text="등록된 반이 없습니다." />}
            </div>
          </div>

          <div>
            <p className="text-sm font-medium text-gray-900 mb-2">전체 데이터 한눈에 보기</p>
            <div className="bg-white border border-gray-200 rounded-xl overflow-x-auto">
              <table className="w-full text-xs whitespace-nowrap">
                <thead>
                  <tr className="text-left text-gray-500 border-b border-gray-100">
                    <th className="p-2.5">반</th>
                    <th className="p-2.5">학생</th>
                    <th className="p-2.5">학교/학년</th>
                    <th className="p-2.5">학부모 연락처</th>
                    <th className="p-2.5">수강료</th>
                    <th className="p-2.5">납부상태</th>
                    <th className="p-2.5">교재비</th>
                    <th className="p-2.5">교재비상태</th>
                  </tr>
                </thead>
                <tbody>
                  {allStudents(data).map(s => {
                    const p = data.payments[s.id] || { tuition: 0, status: 'unpaid', bookFee: 0, bookFeeStatus: 'unpaid' };
                    return (
                      <tr key={s.id} className="border-b border-gray-50 last:border-0">
                        <td className="p-2.5 text-gray-700">{s.className}</td>
                        <td className="p-2.5 text-gray-900 font-medium">{s.name}</td>
                        <td className="p-2.5 text-gray-500">{[s.school, s.grade].filter(Boolean).join(' ') || '-'}</td>
                        <td className="p-2.5 text-gray-500">{s.parentPhone || '-'}</td>
                        <td className="p-2.5 text-gray-700">{(p.tuition || 0).toLocaleString()}원</td>
                        <td className="p-2.5 text-gray-700">{PAYMENT_STATUS[p.status]?.label || p.status}</td>
                        <td className="p-2.5 text-gray-700">{(p.bookFee || 0).toLocaleString()}원</td>
                        <td className="p-2.5 text-gray-700">{BOOKFEE_STATUS[p.bookFeeStatus]?.label || p.bookFeeStatus}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {allStudents(data).length === 0 && <p className="p-4 text-xs text-gray-400">등록된 학생이 없습니다.</p>}
            </div>
          </div>

          <button onClick={exportData} className="w-full py-2 text-sm rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50">
            전체 데이터 JSON으로 내보내기
          </button>
        </div>
      )}
    </div>
  );
}

function SummaryCard({ label, value, tone }) {
  return (
    <div className={`rounded-xl p-3 ${tone}`}>
      <p className="text-xs opacity-80 mb-1">{label}</p>
      <p className="text-lg font-semibold">{value}</p>
    </div>
  );
}

function MetricBox({ label, value }) {
  return (
    <div className="bg-gray-50 rounded-lg p-2.5">
      <p className="text-xs text-gray-500 mb-1">{label}</p>
      <p className="text-base font-semibold text-gray-900">{value}</p>
    </div>
  );
}

function EmptyState({ text }) {
  return <div className="text-center py-12 text-sm text-gray-400">{text}</div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
